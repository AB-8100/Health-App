<!DOCTYPE html>
<html>
<head><title>Forma Icon Generator</title></head>
<body style="font-family:sans-serif;padding:24px;background:#F4F2EE">
<h2>Forma — Icon Generator</h2>
<p style="color:#6B6560;margin-bottom:20px">Click the buttons below to download the PNG icons needed for the PWA. Save them in the same folder as index.html.</p>

<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px">
  <div>
    <canvas id="c192" width="192" height="192" style="border-radius:42px;display:block;margin-bottom:8px"></canvas>
    <button onclick="dl('c192','icon-192.png')" style="width:100%;padding:8px;background:#BE5A38;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">Download icon-192.png</button>
  </div>
  <div>
    <canvas id="c512" width="512" height="512" style="border-radius:112px;display:block;margin-bottom:8px;width:192px;height:192px"></canvas>
    <button onclick="dl('c512','icon-512.png')" style="width:100%;padding:8px;background:#BE5A38;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">Download icon-512.png</button>
  </div>
  <div>
    <canvas id="cm512" width="512" height="512" style="border-radius:0;display:block;margin-bottom:8px;width:192px;height:192px"></canvas>
    <button onclick="dl('cm512','icon-maskable.png')" style="width:100%;padding:8px;background:#BE5A38;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">Download icon-maskable.png</button>
  </div>
</div>

<p style="color:#A8A39C;font-size:13px">Also save icon-192.png as <strong>icon-180.png</strong> (for iOS apple-touch-icon) — just duplicate the file and rename it.</p>

<script>
function drawIcon(canvasId, size, rounded) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const s = size;
  const pad = rounded ? s * 0.1 : 0;

  // Background
  ctx.fillStyle = '#BE5A38';
  if (rounded) {
    const r = s * 0.22;
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.lineTo(s-r, 0); ctx.quadraticCurveTo(s, 0, s, r);
    ctx.lineTo(s, s-r); ctx.quadraticCurveTo(s, s, s-r, s);
    ctx.lineTo(r, s); ctx.quadraticCurveTo(0, s, 0, s-r);
    ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.fillRect(0, 0, s, s);
  }

  // Subtle inner glow
  const grad = ctx.createRadialGradient(s*0.35, s*0.3, 0, s*0.5, s*0.5, s*0.7);
  grad.addColorStop(0, 'rgba(255,255,255,0.15)');
  grad.addColorStop(1, 'rgba(0,0,0,0.1)');
  ctx.fillStyle = grad;
  if (rounded) { ctx.fill(); } else { ctx.fillRect(0, 0, s, s); }

  // "F" lettermark
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.font = `700 ${Math.round(s * 0.55)}px Georgia, serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('F', s * 0.5, s * 0.52);
}

drawIcon('c192', 192, true);
drawIcon('c512', 512, true);
drawIcon('cm512', 512, false);

function dl(id, filename) {
  const canvas = document.getElementById(id);
  const a = document.createElement('a');
  a.download = filename;
  a.href = canvas.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
