name: Build — implement spec, test, gate merge

on:
  push:
    paths:
      - 'features/specs/**.md'
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  identify-specs:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.diff.outputs.specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          FILES=$(git diff --name-only HEAD^ HEAD -- 'features/specs/*.md' | jq -R -s -c 'split("\n")[:-1]')
          echo "specs=$FILES" >> "$GITHUB_OUTPUT"

  build:
    needs: identify-specs
    if: needs.identify-specs.outputs.specs != '[]'
    strategy:
      matrix:
        spec: ${{ fromJson(needs.identify-specs.outputs.specs) }}
      max-parallel: 2
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Create feature branch
        id: branch
        run: |
          name=$(basename "${{ matrix.spec }}" .md)
          branch="feature/$name"
          git checkout -b "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code to implement + self-test
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Edit,Write,Bash(npm run *),Bash(npx playwright *)"
          direct_prompt: |
            Read CLAUDE.md and ${{ matrix.spec }} in full before doing
            anything else.

            Implement exactly what the spec's acceptance criteria describe.
            Add or update Vitest tests for any new logic in utils/.
            Add or update a Playwright smoke assertion in tests/e2e/ if this
            feature changes a screen's core render path or navigation
            (see tests/e2e/README.md for the pattern to follow).

            Run `npm test` and `npx playwright test` yourself. If either
            fails, fix the code or the test and re-run, up to 3 total
            attempts. If still failing after 3 attempts, stop, leave the
            failure visible, and note in a FEATURE_NOTES.md (create if
            missing) what failed and why you believe it's blocked.

            Do not touch files outside what the spec says you'll touch,
            unless it's genuinely unavoidable — if so, say exactly why in
            FEATURE_NOTES.md.

      - name: Run full test suite (verification, not the agent's own run)
        id: tests
        continue-on-error: true
        run: |
          npm test -- --run
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Check for risk-flagged files
        id: risk
        run: |
          RISK_PATTERN='utils/supabase\.js|supabase/migrations/|LoginScreen\.jsx|bootstrapUser|googleSheets\.js'
          if git diff --name-only main | grep -E "$RISK_PATTERN"; then
            echo "flagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "flagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch
        run: |
          git add -A
          git commit -m "feat: implement ${{ steps.branch.outputs.name }}" || echo "nothing to commit"
          git push origin "${{ steps.branch.outputs.branch }}"

      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.branch.outputs.branch }}
          title: "feat: ${{ steps.branch.outputs.name }}"
          body: |
            Implements `${{ matrix.spec }}`.

            - Vitest + Playwright: ${{ steps.tests.outcome }}
            - Touches risk-flagged files: ${{ steps.risk.outputs.flagged }}

            Test results and any self-noted blockers are the agent's own
            probabilistic assessment, not a guarantee of correctness —
            treat a green run as "known cases pass," not "bug-free."
          labels: |
            ${{ steps.tests.outcome == 'success' && steps.risk.outputs.flagged == 'false' && 'auto-merge-eligible' || 'needs-human-review' }}

  auto-merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible PRs
        uses: pascalgn/automerge-action@v0.16.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: "auto-merge-eligible"
          MERGE_METHOD: "squash"
