<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

// ─── !! REPLACE THIS WITH YOUR CLIENT ID !! ───────────────────────────────────
// See README.md for how to get one (it's free, takes ~5 mins)
const CLIENT_ID = '377618672891-jo8pokb9r4i0rttq8646miaslj5cb3eo.apps.googleusercontent.com';
// ─────────────────────────────────────────────────────────────────────────────

const SCOPE = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email';
const FILE_NAME = 'forma-data.json';

// ─── DESIGN TOKENS ───────────────────────────────────────────────────────────
const C = {
  bg:      '#F4F2EE',
  surface: '#FFFFFF',
  s2:      '#FAF8F4',
  s3:      '#F0EDE8',
  border:  '#EAE6DE',
  border2: '#DDD8D0',
  text:    '#1C1917',

  t3:      '#A8A39C',

  greenBg: '#F0FDF4',

// ─── DATA MODEL ──────────────────────────────────────────────────────────────
const SPLITS = {
  3: ['Push', 'Pull', 'Legs'],
  4: ['Upper', 'Lower', 'Push', 'Pull'],
  5: ['Push', 'Pull', 'Legs', 'Upper', 'Lower'],
};

const WORKOUTS = {
  Push:  { focus: 'Chest · Shoulders · Triceps', exercises: ['Bench Press','Overhead Press','Incline DB Press','Lateral Raises','Tricep Pushdown'] },
  Pull:  { focus: 'Back · Biceps', exercises: ['Deadlift','Pull-ups','Bent-over Row','Face Pulls','Bicep Curls'] },
  Legs:  { focus: 'Quads · Hamstrings · Glutes', exercises: ['Squat','Romanian Deadlift','Leg Press','Leg Curl','Calf Raises'] },
  Upper: { focus: 'Chest · Back · Shoulders · Arms', exercises: ['Bench Press','Bent-over Row','Overhead Press','Pull-ups','Bicep Curls'] },
  Lower: { focus: 'Quads · Hamstrings · Glutes · Calves', exercises: ['Squat','Romanian Deadlift','Leg Press','Leg Extension','Calf Raises'] },
};

const GOALS = [
  { id: 'strength', label: 'Build strength',  icon: '💪' },
  { id: 'muscle',   label: 'Build muscle',    icon: '🏋️' },
  { id: 'fat-loss', label: 'Lose fat',         icon: '🔥' },
  { id: 'active',   label: 'Stay active',      icon: '🌿' },
];

const DEFAULT_DATA = {
  profile: { name: '', sex: '', age: 30, height: 168, weight: 65, goal: 'strength', splitDays: 3 },
  logs: [],       // [{ date, weight, sleep, mood, water, steps, protein }]
  sessions: [],   // [{ id, date, kind, name, duration, completed }]
};

// ─── UTILS ───────────────────────────────────────────────────────────────────
const todayStr  = () => new Date().toISOString().split('T')[0];
const uid       = () => Math.random().toString(36).slice(2, 9);
const fmtDate   = d => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const fmtDay    = d => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short' });

function getTodayWorkout(splitDays, sessions) {
  const split = SPLITS[splitDays] || SPLITS[3];
  const weekStart = new Date();
  weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7)); // Mon
  weekStart.setHours(0, 0, 0, 0);
  const doneThisWeek = sessions.filter(s => s.kind === 'gym' && s.completed && new Date(s.date) >= weekStart).length;
  const name = split[doneThisWeek % split.length];
  return { name, ...(WORKOUTS[name] || WORKOUTS.Push) };
}

function getTodayLog(logs) {
  return logs.find(l => l.date === todayStr()) || {};
}

// ─── GOOGLE DRIVE API ────────────────────────────────────────────────────────
async function getUserInfo(token) {
  const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
    headers: { Authorization: `Bearer ${token}` }
  });
  if (!r.ok) throw new Error('getUserInfo failed');
  return r.json();
}

async function driveSearchFile(token) {
  const r = await fetch(
    `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D'${FILE_NAME}'&fields=files(id,modifiedTime)`,
    { headers: { Authorization: `Bearer ${token}` } }
  );
  if (!r.ok) throw new Error('driveSearch failed');
  const d = await r.json();
  return d.files?.[0] || null;
}

async function driveDownload(token, fileId) {
  const r = await fetch(
    `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
    { headers: { Authorization: `Bearer ${token}` } }
  );
  if (!r.ok) throw new Error('driveDownload failed');
  return r.json();
}

async function driveCreate(token, data) {
  const meta = JSON.stringify({ name: FILE_NAME, parents: ['appDataFolder'] });
  const body = JSON.stringify(data);
  const b = 'fb_' + Date.now();
  const r = await fetch(
    'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
    {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${token}`,
        'Content-Type': `multipart/related; boundary=${b}`,
      },
      body: `--${b}\r\nContent-Type: application/json\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`,
    }
  );
  if (!r.ok) throw new Error('driveCreate failed');
  return r.json();
}

async function driveUpdate(token, fileId, data) {
  const r = await fetch(
    `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,
    {
      method: 'PATCH',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...data, _synced: new Date().toISOString() }),
    }
  );
  if (!r.ok) throw new Error('driveUpdate failed');
  return r.json();
}

// ─── SHARED COMPONENTS ───────────────────────────────────────────────────────

function Ring({ value = 0, goal = 100, color, label, unit = '', size = 82 }) {
  const pct = Math.min(1, goal > 0 ? value / goal : 0);
  const strokeW = 9;
  const r = (size - strokeW * 2) / 2;
  const circ = 2 * Math.PI * r;
  const cx = size / 2, cy = size / 2;
  const disp = value > 0 ? (Number.isInteger(value) ? value.toLocaleString() : value.toFixed(1)) : '—';

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 7 }}>
      <div style={{ position: 'relative', width: size, height: size }}>
        <svg width={size} height={size} style={{ transform: 'rotate(-90deg)', display: 'block' }}>
          <circle cx={cx} cy={cy} r={r} fill="none" stroke={color + '1A'} strokeWidth={strokeW} />
          <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth={strokeW}
            strokeDasharray={`${pct * circ} ${circ}`} strokeLinecap="round"
            style={{ transition: 'stroke-dasharray 0.8s cubic-bezier(0.34,1.56,0.64,1)' }} />
        </svg>
        <div style={{
          position: 'absolute', inset: 0,
          display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
          gap: 1,
        }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: C.text, fontFamily: F.mono, lineHeight: 1 }}>
            {disp}
          </span>
          {unit && <span style={{ fontSize: 9, color: C.t2, fontWeight: 500 }}>{unit}</span>}
        </div>
      </div>
      <span style={{ fontSize: 11, color: C.t2, fontWeight: 500, letterSpacing: '0.04em', textTransform: 'uppercase' }}>
        {label}
      </span>
    </div>
  );
}

function Card({ children, style, onClick }) {
  return (
    <div onClick={onClick} style={{
      background: C.surface,
      borderRadius: 20,
      border: `1px solid ${C.border}`,
      padding: '18px 20px',
      ...style,
    }}>
      {children}
    </div>
  );
}

function Sheet({ open, onClose, title, children }) {
  useEffect(() => {
    if (open) document.body.style.overflow = 'hidden';
    else document.body.style.overflow = '';
    return () => { document.body.style.overflow = ''; };
  }, [open]);

  if (!open) return null;
  return (
    <div
      style={{
        position: 'fixed', inset: 0, zIndex: 200,
        background: 'rgba(28,25,23,0.45)', backdropFilter: 'blur(6px)',
        display: 'flex', alignItems: 'flex-end', justifyContent: 'center',
      }}
      onClick={onClose}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{
          width: '100%', maxWidth: 430,
          background: C.surface,
          borderRadius: '28px 28px 0 0',
          padding: '0 24px 40px',
          maxHeight: '85vh',
          overflowY: 'auto',
          boxShadow: '0 -8px 40px rgba(0,0,0,0.12)',
        }}
      >
        <div style={{ width: 44, height: 5, borderRadius: 3, background: C.border2, margin: '14px auto 20px' }} />
        {title && (
          <h3 style={{ fontSize: 20, fontWeight: 600, color: C.text, marginBottom: 20, fontFamily: F.serif }}>
            {title}
          </h3>
        )}
        {children}
      </div>
    </div>
  );
}

function Btn({ children, onClick, variant = 'primary', style, disabled }) {
  const styles = {
    primary:   { background: C.accent, color: '#fff', border: 'none' },
    secondary: { background: C.surface, color: C.t2, border: `1px solid ${C.border}` },
    ghost:     { background: 'transparent', color: C.accent, border: 'none' },
    danger:    { background: C.redBg, color: C.red, border: `1px solid ${C.red}30` },
  };
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      style={{
        ...styles[variant],
        padding: '14px 20px',
        borderRadius: 14,
        fontSize: 15,
        fontWeight: 600,
        cursor: disabled ? 'default' : 'pointer',
        opacity: disabled ? 0.5 : 1,
        width: '100%',
        transition: 'opacity 0.15s, transform 0.1s',
        fontFamily: F.sans,
        ...style,
      }}
    >
      {children}
    </button>
  );
}

function Label({ children }) {
  return (
    <p style={{
      fontSize: 11, fontWeight: 600, color: C.t2,
      letterSpacing: '0.08em', textTransform: 'uppercase',
      marginBottom: 12,
    }}>
      {children}
    </p>
  );
}

// ─── ICONS ───────────────────────────────────────────────────────────────────
const SVGIco = ({ paths, size, color, strokeWidth = 1.8, fill = 'none' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill}
       stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
    {(Array.isArray(paths) ? paths : [paths]).map((p, i) => <path key={i} d={p} />)}
  </svg>
);
const IcoHome  = ({ s, c }) => <SVGIco size={s} color={c} paths={['M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z', 'M9 21V12h6v9']} />;
const IcoLog   = ({ s, c }) => <SVGIco size={s} color={c} paths={['M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2', 'M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2', 'M9 12h6M9 16h4']} />;
const IcoGym   = ({ s, c }) => <SVGIco size={s} color={c} paths={['M4 12h2M18 12h2', 'M8 8v8M16 8v8', 'M8 12h8']} strokeWidth={2} />;
const IcoMe    = ({ s, c }) => <SVGIco size={s} color={c} paths={['M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2', 'M12 11a4 4 0 100-8 4 4 0 000 8z']} />;
const IcoCheck = ({ s = 16, c = C.accent }) => <SVGIco size={s} color={c} paths="M20 6L9 17l-5-5" strokeWidth={2.5} />;
const IcoCloud = ({ s = 14, c = C.green }) => <SVGIco size={s} color={c} paths="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z" />;
const IcoWarn  = ({ s = 14, c = C.red })   => <SVGIco size={s} color={c} paths={['M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z', 'M12 9v4M12 17h.01']} />;

// ─── STATUS BAR ──────────────────────────────────────────────────────────────
function StatusBar({ syncStatus }) {
  const [time, setTime] = useState(() => new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false }));
  useEffect(() => {
    const iv = setInterval(() => setTime(new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false })), 15000);
    return () => clearInterval(iv);
  }, []);
  return (
    <div style={{
      position: 'absolute', top: 0, left: 0, right: 0, height: 48,
      display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between',
      padding: '0 22px 8px', zIndex: 10, pointerEvents: 'none',
    }}>
      <span style={{ fontSize: 14, fontWeight: 600, color: C.text, fontFamily: F.mono }}>{time}</span>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        {syncStatus === 'synced' && <IcoCloud s={13} c={C.green} />}
        {syncStatus === 'syncing' && <span style={{ fontSize: 11, color: C.t2, fontFamily: F.mono }}>↑</span>}
        {syncStatus === 'error'   && <IcoWarn s={13} c={C.red} />}
        {syncStatus === 'pending' && <span style={{ fontSize: 11, color: C.t3, fontFamily: F.mono }}>•</span>}
      </div>
    </div>
  );
}

// ─── TAB BAR ─────────────────────────────────────────────────────────────────
function TabBar({ active, onTab }) {
  const tabs = [
    { id: 'home', Icon: IcoHome, label: 'Home' },
    { id: 'log',  Icon: IcoLog,  label: 'Log'  },
    { id: 'gym',  Icon: IcoGym,  label: 'Gym'  },
    { id: 'me',   Icon: IcoMe,   label: 'Me'   },
  ];
  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0,
      background: C.surface,
      borderTop: `1px solid ${C.border}`,
      display: 'flex',
      paddingBottom: 'env(safe-area-inset-bottom, 8px)',
      height: 80,
    }}>
      {tabs.map(({ id, Icon, label }) => {
        const active_ = active === id;
        return (
          <button
            key={id} onClick={() => onTab(id)}
            style={{
              flex: 1, display: 'flex', flexDirection: 'column',
              alignItems: 'center', justifyContent: 'center',
              gap: 4, background: 'none', border: 'none',
              color: active_ ? C.accent : C.t3,
              paddingBottom: 2, cursor: 'pointer',
            }}
          >
            <Icon s={22} c={active_ ? C.accent : C.t3} />
            <span style={{ fontSize: 10, fontWeight: active_ ? 600 : 400, letterSpacing: '0.04em' }}>
              {label}
            </span>
          </button>
        );
      })}
    </div>
  );
}

// ─── HOME SCREEN ─────────────────────────────────────────────────────────────
function HomeScreen({ data, onNav }) {
  const { profile, logs, sessions } = data;
  const log = getTodayLog(logs);
  const workout = getTodayWorkout(profile.splitDays, sessions);

  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const firstName = (profile.name || 'there').split(' ')[0];

  const weekStart = new Date();
  weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7));
  weekStart.setHours(0, 0, 0, 0);
  const weekSessions = useMemo(() =>
    sessions.filter(s => s.completed && new Date(s.date) >= weekStart).slice(-3).reverse()
  , [sessions]);

  const protGoal = Math.round((profile.weight || 70) * 1.8);

  return (
    <div style={{ height: '100%', overflowY: 'auto', paddingTop: 52, paddingBottom: 96 }}>
      <div style={{ padding: '20px 20px 0' }}>
        {/* Greeting */}
        <div style={{ marginBottom: 22 }}>
          <p style={{ fontSize: 13, color: C.t2, marginBottom: 2 }}>{greeting}</p>
          <h1 style={{ fontSize: 32, fontFamily: F.serif, color: C.text, lineHeight: 1.15 }}>
            {firstName}.
          </h1>
        </div>

        {/* Today's session card */}
        <button onClick={() => onNav('gym')} style={{
          width: '100%', textAlign: 'left',
          background: C.accent,
          borderRadius: 22, padding: '20px 22px',
          marginBottom: 14, border: 'none', cursor: 'pointer',
          boxShadow: '0 8px 28px rgba(190,90,56,0.28)',
        }}>
          <p style={{ fontSize: 11, color: 'rgba(255,255,255,0.65)', fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 8 }}>
            Today's session
          </p>
          <p style={{ fontSize: 24, fontFamily: F.serif, color: '#fff', lineHeight: 1.2, marginBottom: 5 }}>
            {workout.name} day
          </p>
          <p style={{ fontSize: 13, color: 'rgba(255,255,255,0.7)', marginBottom: 18 }}>
            {workout.focus}
          </p>
          <span style={{
            display: 'inline-flex', alignItems: 'center', gap: 6,
            background: 'rgba(255,255,255,0.16)',
            border: '1px solid rgba(255,255,255,0.2)',
            borderRadius: 10, padding: '8px 14px',
            color: '#fff', fontSize: 13, fontWeight: 600,
          }}>
            Start session →
          </span>
        </button>

        {/* Rings */}
        <Card style={{ marginBottom: 14 }}>
          <Label>Today</Label>
          <div style={{ display: 'flex', justifyContent: 'space-between', padding: '4px 10px' }}>
            <Ring value={log.steps || 0}   goal={10000}   color={C.steps} label="Steps"   unit="steps" size={82} />
            <Ring value={log.protein || 0} goal={protGoal} color={C.prot}  label="Protein" unit="g"     size={82} />
            <Ring value={log.sleep || 0}   goal={8}        color={C.sleep} label="Sleep"   unit="h"     size={82} />
          </div>
          {!(log.steps || log.protein || log.sleep) && (
            <p style={{ textAlign: 'center', fontSize: 12, color: C.t3, marginTop: 12 }}>
              Log today's metrics to fill your rings →
            </p>
          )}
        </Card>

        {/* This week */}
        <Card>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
            <Label style={{ marginBottom: 0 }}>This week</Label>
            <span style={{ fontSize: 13, color: C.accent, fontWeight: 600 }}>
              {weekSessions.length} session{weekSessions.length !== 1 ? 's' : ''}
            </span>
          </div>
          {weekSessions.length === 0 ? (
            <p style={{ fontSize: 14, color: C.t3, padding: '8px 0' }}>No sessions yet this week.</p>
          ) : (
            weekSessions.map((s, i) => (
              <div key={s.id} style={{
                display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                padding: '11px 0',
                borderTop: i > 0 ? `1px solid ${C.border}` : 'none',
              }}>
                <div>
                  <p style={{ fontSize: 14, fontWeight: 500, color: C.text }}>{s.name}</p>
                  <p style={{ fontSize: 12, color: C.t3 }}>{fmtDay(s.date)} · {s.duration}m</p>
                </div>
                <div style={{
                  width: 26, height: 26, borderRadius: '50%',
                  background: C.aSoft,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  <IcoCheck s={13} c={C.accent} />
                </div>
              </div>
            ))
          )}
        </Card>
      </div>
    </div>
  );
}

// ─── LOG SCREEN ──────────────────────────────────────────────────────────────
function LogScreen({ data, onUpdate }) {
  const { logs, profile } = data;
  const todayLog = getTodayLog(logs);
  const [sheet, setSheet] = useState(null);
  const [val, setVal] = useState('');

    { id: 'sleep',   label: 'Sleep',   icon: '💤', unit: 'h',  type: 'decimal',  step: 0.5,  placeholder: '7.5'  },
    { id: 'steps',   label: 'Steps',   icon: '👟', unit: '',   type: 'integer',  step: 500,  placeholder: '8000' },
    { id: 'protein', label: 'Protein', icon: '🥩', unit: 'g',  type: 'integer',  step: 5,    placeholder: '140'  },
    { id: 'water',   label: 'Water',   icon: '💧', unit: 'L',  type: 'decimal',  step: 0.25, placeholder: '2.0'  },
    { id: 'mood',    label: 'Mood',    icon: '🙂', unit: '',   type: 'mood',     options: ['Great', 'Good', 'Okay', 'Bad'] },
  ];

  function openSheet(m) {
    setSheet(m);
    setVal(todayLog[m.id] ?? '');
  }

  function save() {
    if (!sheet) return;
    const today = todayStr();
    onUpdate(prev => {
      const existing = prev.logs.find(l => l.date === today) || { date: today };
      const rest = prev.logs.filter(l => l.date !== today);
      const newVal = sheet.type === 'integer' ? parseInt(val) || 0 :
                     sheet.type === 'decimal' ? parseFloat(val) || 0 : val;
      return { ...prev, logs: [...rest, { ...existing, [sheet.id]: newVal }] };
    });
    setSheet(null);
  }

  const last7 = useMemo(() => Array.from({ length: 7 }, (_, i) => {
    const d = new Date();
    d.setDate(d.getDate() - (6 - i));
    const ds = d.toISOString().split('T')[0];
    return { date: ds, log: logs.find(l => l.date === ds) };
  }), [logs]);

  const moodColors = { great: C.green, good: C.green, okay: C.prot, bad: C.red };

  return (
    <div style={{ height: '100%', overflowY: 'auto', paddingTop: 52, paddingBottom: 96 }}>
      <div style={{ padding: '20px 20px 0' }}>
        <h1 style={{ fontSize: 28, fontFamily: F.serif, color: C.text, marginBottom: 4 }}>Log</h1>
        <p style={{ fontSize: 13, color: C.t2, marginBottom: 24 }}>
          {new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}
        </p>

        {/* Metric tiles */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 20 }}>
          {METRICS.map(m => {
            const v = todayLog[m.id];
            const hasVal = v !== undefined && v !== null && v !== '';
            return (
              <button key={m.id} onClick={() => openSheet(m)} style={{
                background: hasVal ? C.aSoft : C.surface,
                border: `1px solid ${hasVal ? C.accent + '50' : C.border}`,
                borderRadius: 18, padding: '16px 16px 14px',
                textAlign: 'left', cursor: 'pointer',
              }}>
                <span style={{ fontSize: 26, display: 'block', marginBottom: 10 }}>{m.icon}</span>
                <p style={{ fontSize: 10, color: hasVal ? C.accent : C.t2, fontWeight: 600, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 5 }}>
                  {m.label}
                </p>
                {hasVal ? (
                  <p style={{ fontSize: 22, fontWeight: 700, color: C.text, fontFamily: F.mono, lineHeight: 1 }}>
                    {m.id === 'mood'
                      ? <span style={{ fontSize: 14, fontFamily: F.sans, color: moodColors[v.toLowerCase()] || C.text }}>{v}</span>
                      : <>{v}<span style={{ fontSize: 12, fontWeight: 400, color: C.t2, fontFamily: F.sans }}>{m.unit && ` ${m.unit}`}</span></>}
                  </p>
                ) : (
                  <p style={{ fontSize: 13, color: C.t3 }}>Tap to log</p>
                )}
              </button>
            );
          })}
        </div>

        {/* 7-day table */}
        <Card>
          <Label>Last 7 days</Label>
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
              <thead>
                <tr>
                  {['', 'Wt', 'Sleep', 'Steps', 'Prot'].map(h => (
                    <td key={h} style={{ color: C.t3, fontWeight: 600, padding: '4px 6px 10px', textAlign: h ? 'center' : 'left', whiteSpace: 'nowrap' }}>{h}</td>
                  ))}
                </tr>
              </thead>
              <tbody>
                {last7.map(({ date, log }) => (
                  <tr key={date} style={{ borderTop: `1px solid ${C.border}` }}>
                    <td style={{ padding: '10px 6px', color: date === todayStr() ? C.accent : C.t2, fontWeight: date === todayStr() ? 600 : 400, whiteSpace: 'nowrap' }}>
                      {date === todayStr() ? 'Today' : fmtDate(date)}
                    </td>
                    {['weight', 'sleep', 'steps', 'protein'].map(k => (
                      <td key={k} style={{ textAlign: 'center', padding: '10px 6px', color: log?.[k] ? C.text : C.t4, fontWeight: log?.[k] ? 500 : 400, fontFamily: log?.[k] ? F.mono : F.sans }}>
                        {log?.[k]
                          ? k === 'steps' ? (log[k] / 1000).toFixed(1) + 'k' : log[k]
                          : '—'}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>
      </div>

      {/* Log input sheet */}
      <Sheet open={!!sheet} onClose={() => setSheet(null)} title={`Log ${sheet?.label}`}>
        {sheet?.type === 'mood' ? (
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 20 }}>
            {sheet.options.map(o => (
              <button key={o} onClick={() => setVal(o)} style={{
                padding: '16px', borderRadius: 14,
                border: `2px solid ${val === o ? C.accent : C.border}`,
                background: val === o ? C.aSoft : C.s2,
                color: val === o ? C.accent : C.t2,
                fontSize: 16, fontWeight: 500, cursor: 'pointer',
              }}>
                {o}
              </button>
            ))}
          </div>
        ) : (
          <div style={{ textAlign: 'center', marginBottom: 28 }}>
            <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'center', gap: 8 }}>
              <input
                autoFocus
                type="number"
                inputMode={sheet?.type === 'decimal' ? 'decimal' : 'numeric'}
                value={val}
                onChange={e => setVal(e.target.value)}
                placeholder={sheet?.placeholder}
                step={sheet?.step}
                style={{
                  fontSize: 44, fontWeight: 700, color: C.text, fontFamily: F.mono,
                  border: 'none', borderBottom: `3px solid ${C.accent}`,
                  paddingBottom: 4, background: 'transparent',
                  width: 160, textAlign: 'center',
                }}
              />
              {sheet?.unit && (
                <span style={{ fontSize: 20, color: C.t2, fontWeight: 400 }}>{sheet.unit}</span>
              )}
            </div>
          </div>
        )}
        <Btn onClick={save} disabled={!val && sheet?.type !== 'mood'}>Save</Btn>
      </Sheet>
    </div>
  );
}

// ─── GYM SCREEN ──────────────────────────────────────────────────────────────
function GymScreen({ data, onUpdate }) {
  const { profile, sessions } = data;
  const workout = getTodayWorkout(profile.splitDays, sessions);
  const [active, setActive] = useState(false);
  const [startTs, setStartTs] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [done, setDone] = useState({});

  const todayDone = sessions.find(s => s.date === todayStr() && s.kind === 'gym' && s.completed);

  useEffect(() => {
    if (!active) return;
    const iv = setInterval(() => setElapsed(Math.floor((Date.now() - startTs) / 1000)), 1000);
    return () => clearInterval(iv);
  }, [active, startTs]);

  function startSession() {
    setActive(true);
    setStartTs(Date.now());
    setElapsed(0);
    setDone({});
  }

  function finishSession() {
    const dur = Math.max(1, Math.round(elapsed / 60));
    onUpdate(prev => ({
      ...prev,
      sessions: [...prev.sessions, {
        id: uid(), date: todayStr(), kind: 'gym',
        name: workout.name, duration: dur, completed: true,
      }],
    }));
    setActive(false);
  }

  const fmtTime = s => {
    const m = Math.floor(s / 60), sec = s % 60;
    return `${m}:${String(sec).padStart(2, '0')}`;
  };

  const recent = useMemo(() =>
    sessions.filter(s => s.kind === 'gym' && s.completed).slice(-5).reverse()
  , [sessions]);

  // ── Active session ──
  if (active) {
    const exs = workout.exercises || [];
    const doneCount = Object.values(done).filter(Boolean).length;
    return (
      <div style={{ height: '100%', overflowY: 'auto', paddingTop: 52, paddingBottom: 96 }}>
        <div style={{ padding: '24px 20px 0' }}>
          {/* Timer */}
          <div style={{ textAlign: 'center', marginBottom: 32 }}>
            <p style={{ fontSize: 11, color: C.t2, fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 6 }}>
              Active session
            </p>
            <p style={{ fontSize: 60, fontWeight: 700, color: C.text, fontFamily: F.mono, letterSpacing: '-2px', lineHeight: 1 }}>
              {fmtTime(elapsed)}
            </p>
            <p style={{ fontSize: 15, color: C.t2, marginTop: 8 }}>
              {workout.name} · {doneCount}/{exs.length} done
            </p>
          </div>

          {/* Exercise checklist */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 24 }}>
            {exs.map((ex, i) => {
              const isDone = done[i];
              return (
                <button key={i} onClick={() => setDone(p => ({ ...p, [i]: !p[i] }))} style={{
                  display: 'flex', alignItems: 'center', gap: 14,
                  padding: '16px 18px',
                  background: isDone ? C.aSoft : C.surface,
                  border: `1px solid ${isDone ? C.accent + '40' : C.border}`,
                  borderRadius: 16, textAlign: 'left', cursor: 'pointer',
                  transition: 'background 0.15s',
                }}>
                  <div style={{
                    width: 28, height: 28, borderRadius: '50%', flexShrink: 0,
                    background: isDone ? C.accent : 'transparent',
                    border: `2px solid ${isDone ? C.accent : C.border2}`,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    transition: 'all 0.15s',
                  }}>
                    {isDone && <IcoCheck s={13} c="#fff" />}
                  </div>
                  <span style={{
                    fontSize: 15, fontWeight: 500,
                    color: isDone ? C.t2 : C.text,
                    textDecoration: isDone ? 'line-through' : 'none',
                  }}>
                    {ex}
                  </span>
                </button>
              );
            })}
          </div>

          <Btn onClick={finishSession}>
            Finish — {fmtTime(elapsed)}
          </Btn>
        </div>
      </div>
    );
  }

  // ── Rest state ──
  return (
    <div style={{ height: '100%', overflowY: 'auto', paddingTop: 52, paddingBottom: 96 }}>
      <div style={{ padding: '20px 20px 0' }}>
        <h1 style={{ fontSize: 28, fontFamily: F.serif, color: C.text, marginBottom: 22 }}>Gym</h1>

        <Card style={{ marginBottom: 14 }}>
          <Label>Today's workout</Label>
          <p style={{ fontSize: 24, fontFamily: F.serif, color: C.text, marginBottom: 4 }}>{workout.name}</p>
          <p style={{ fontSize: 13, color: C.t2, marginBottom: 20 }}>{workout.focus}</p>

          <div style={{ marginBottom: 22 }}>
            {(workout.exercises || []).map((ex, i) => (
              <div key={i} style={{
                display: 'flex', alignItems: 'center', gap: 14,
                padding: '11px 0',
                borderBottom: i < workout.exercises.length - 1 ? `1px solid ${C.border}` : 'none',
              }}>
                <span style={{ fontSize: 11, color: C.t3, fontFamily: F.mono, minWidth: 22, textAlign: 'right' }}>
                  {String(i + 1).padStart(2, '0')}
                </span>
                <span style={{ fontSize: 15, color: C.text }}>{ex}</span>
              </div>
            ))}
          </div>

          {todayDone ? (
            <div style={{
              display: 'flex', alignItems: 'center', gap: 10,
              padding: '14px 16px',
              background: C.aSoft, borderRadius: 12,
            }}>
              <IcoCheck s={16} c={C.accent} />
              <span style={{ fontSize: 14, color: C.accent, fontWeight: 500 }}>
                Done · {todayDone.duration}m
              </span>
            </div>
          ) : (
            <Btn onClick={startSession}>Start session</Btn>
          )}
        </Card>

        {recent.length > 0 && (
          <Card>
            <Label>Recent sessions</Label>
            {recent.map((s, i) => (
              <div key={s.id} style={{
                display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                padding: '10px 0',
                borderTop: i > 0 ? `1px solid ${C.border}` : 'none',
              }}>
                <div>
                  <p style={{ fontSize: 14, fontWeight: 500, color: C.text }}>{s.name}</p>
                  <p style={{ fontSize: 12, color: C.t3 }}>{fmtDate(s.date)}</p>
                </div>
                <span style={{ fontSize: 13, color: C.t2, fontFamily: F.mono }}>{s.duration}m</span>
              </div>
            ))}
          </Card>
        )}
      </div>
    </div>
  );
}

          <div>

              ))}

          </div>
        </div>
        <Btn onClick={saveProfile}>Save profile</Btn>
      </Sheet>
    </div>
  );
}

// ─── ONBOARDING ───────────────────────────────────────────────────────────────
function OnboardingScreen({ googleUser, onComplete }) {
  const [step, setStep] = useState(0);
  const [p, setP] = useState({
    name: googleUser?.given_name || '',
    sex: '', age: 30, height: 168, weight: 65, goal: '', splitDays: 3,
  });

  const steps = ['name', 'goal', 'split'];
  const cur = steps[step];
  const isLast = step === steps.length - 1;
  const canNext = cur === 'name' ? !!p.name.trim() : cur === 'goal' ? !!p.goal : true;

  const next = () => {
    if (isLast) onComplete(p);
    else setStep(s => s + 1);
  };

  return (
    <div style={{
      height: '100%', display: 'flex', flexDirection: 'column',
      padding: 'calc(env(safe-area-inset-top, 48px) + 40px) 28px 48px',
      background: C.bg,
    }}>
      {/* Progress */}
      <div style={{ display: 'flex', gap: 6, marginBottom: 52 }}>
        {steps.map((s, i) => (
          <div key={s} style={{
            flex: 1, height: 3, borderRadius: 2,
            background: i <= step ? C.accent : C.border,
            transition: 'background 0.3s',
          }} />
        ))}
      </div>

      <div style={{ flex: 1 }}>
        {cur === 'name' && (
          <>
            <p style={{ fontSize: 13, color: C.t2, marginBottom: 6 }}>Welcome to</p>
            <h1 style={{ fontSize: 44, fontFamily: F.serif, color: C.text, marginBottom: 44, lineHeight: 1.05 }}>
              Forma.
            </h1>
            <p style={{ fontSize: 16, color: C.t2, marginBottom: 20 }}>What should we call you?</p>
            <input
              autoFocus type="text"
              value={p.name}
              onChange={e => setP(v => ({ ...v, name: e.target.value }))}
              onKeyDown={e => e.key === 'Enter' && canNext && next()}
              placeholder="Your first name"
              style={{
                width: '100%', fontSize: 30, fontWeight: 600, color: C.text,
                border: 'none', borderBottom: `3px solid ${C.accent}`,
                paddingBottom: 8, background: 'transparent',
                appearance: 'none',
              }}
            />
          </>
        )}

        {cur === 'goal' && (
          <>
            <h2 style={{ fontSize: 30, fontFamily: F.serif, color: C.text, lineHeight: 1.2, marginBottom: 8 }}>
              What's your main goal?
            </h2>
            <p style={{ fontSize: 14, color: C.t2, marginBottom: 28 }}>We'll tailor your workout plan around this.</p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {GOALS.map(g => (
                <button key={g.id} onClick={() => setP(v => ({ ...v, goal: g.id }))} style={{
                  display: 'flex', alignItems: 'center', gap: 16,
                  padding: '17px 18px', borderRadius: 18, textAlign: 'left', cursor: 'pointer',
                  border: `2px solid ${p.goal === g.id ? C.accent : C.border}`,
                  background: p.goal === g.id ? C.aSoft : C.surface,
                  transition: 'all 0.15s',
                }}>
                  <span style={{ fontSize: 26 }}>{g.icon}</span>
                  <span style={{ fontSize: 16, fontWeight: 500, color: p.goal === g.id ? C.accent : C.text }}>
                    {g.label}
                  </span>
                </button>
              ))}
            </div>
          </>
        )}

        {cur === 'split' && (
          <>
            <h2 style={{ fontSize: 30, fontFamily: F.serif, color: C.text, lineHeight: 1.2, marginBottom: 8 }}>
              How many days a week do you train?
            </h2>
            <p style={{ fontSize: 14, color: C.t2, marginBottom: 36 }}>
              We'll build your push/pull/legs split around this.
            </p>
            <div style={{ display: 'flex', gap: 14, marginBottom: 16 }}>
              {[3, 4, 5].map(n => (
                <button key={n} onClick={() => setP(v => ({ ...v, splitDays: n }))} style={{
                  flex: 1, padding: '28px 0', borderRadius: 20, cursor: 'pointer',
                  border: `2px solid ${p.splitDays === n ? C.accent : C.border}`,
                  background: p.splitDays === n ? C.aSoft : C.surface,
                  color: p.splitDays === n ? C.accent : C.text,
                  fontSize: 32, fontWeight: 700, transition: 'all 0.15s',
                }}>
                  {n}
                </button>
              ))}
            </div>
            <p style={{ textAlign: 'center', fontSize: 13, color: C.t3 }}>
              days per week · {SPLITS[p.splitDays]?.join(' · ')}
            </p>
          </>
        )}
      </div>

      <button onClick={next} disabled={!canNext} style={{
        width: '100%', padding: '18px',
        background: canNext ? C.accent : C.border,
        color: canNext ? '#fff' : C.t3,
        borderRadius: 18, fontSize: 17, fontWeight: 600, border: 'none',
        cursor: canNext ? 'pointer' : 'default',
        transition: 'background 0.2s, color 0.2s',
        fontFamily: F.sans,
      }}>
        {isLast ? "Let's go →" : 'Continue'}
      </button>
    </div>
  );
}

// ─── SIGN IN SCREEN ───────────────────────────────────────────────────────────

  return (
    <div style={{
      height: '100%', display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      padding: '48px 32px',
      background: `radial-gradient(ellipse at 30% 20%, ${C.aSoft}, transparent 60%), radial-gradient(ellipse at 70% 80%, #EDE9E2, transparent 60%), ${C.bg}`,
    }}>
      <div style={{
        width: 76, height: 76, borderRadius: 24,
        background: C.accent,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: 36, marginBottom: 28,
        boxShadow: '0 12px 32px rgba(190,90,56,0.35)',
      }}>
        🏃
      </div>
      <h1 style={{ fontSize: 40, fontFamily: F.serif, color: C.text, marginBottom: 10, letterSpacing: '-0.5px' }}>
        Forma
      </h1>
      <p style={{ fontSize: 16, color: C.t2, textAlign: 'center', marginBottom: 52, lineHeight: 1.55, maxWidth: 280 }}>
        Your personal health tracker. All your data lives privately in your Google Drive.
      </p>

      {notConfigured ? (
        <div style={{
          background: C.redBg, border: `1px solid ${C.red}30`,
          borderRadius: 14, padding: '16px 20px', marginBottom: 20, width: '100%', maxWidth: 320,
        }}>
          <p style={{ fontSize: 13, color: C.red, fontWeight: 600, marginBottom: 4 }}>Setup required</p>
          <p style={{ fontSize: 12, color: C.t2, lineHeight: 1.5 }}>
            Open <code style={{ fontFamily: F.mono, background: '#fff', padding: '1px 5px', borderRadius: 4 }}>index.html</code> and replace <code style={{ fontFamily: F.mono, background: '#fff', padding: '1px 5px', borderRadius: 4 }}>YOUR_GOOGLE_CLIENT_ID</code> with your OAuth client ID. See README.md.
          </p>
        </div>
      ) : loading ? (
        <p style={{ color: C.t2, fontSize: 15 }}>Connecting…</p>
      ) : (
        <button onClick={onSignIn} style={{
          display: 'flex', alignItems: 'center', gap: 12,
          padding: '16px 28px',
          background: '#fff', border: `1px solid ${C.border}`,
          borderRadius: 16, fontSize: 16, fontWeight: 500, color: C.text,
          boxShadow: '0 2px 12px rgba(0,0,0,0.07)',
          cursor: 'pointer', fontFamily: F.sans,
        }}>
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>
      )}

      <p style={{ fontSize: 12, color: C.t3, textAlign: 'center', marginTop: 36, lineHeight: 1.7, maxWidth: 260 }}>
        No subscription. No server. Data stored privately in your own Google Drive using a hidden app-data folder.
      </p>
    </div>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
function App() {
  const [token, setToken]         = useState(() => sessionStorage.getItem('f_tok') || null);
  const [googleUser, setGoogleUser] = useState(() => { try { return JSON.parse(sessionStorage.getItem('f_user') || 'null'); } catch { return null; } });
  const [data, setDataRaw]        = useState(() => { try { return JSON.parse(localStorage.getItem('forma') || 'null') || DEFAULT_DATA; } catch { return DEFAULT_DATA; } });
  const [driveFileId, setFileId]  = useState(null);
  const [syncStatus, setSync]     = useState('idle');
  const [activeTab, setTab]       = useState('home');
  const [loading, setLoading]     = useState(false);
  const [gisReady, setGisReady]   = useState(false);

  const tokenRef  = useRef(null);
  const fileRef   = useRef(null);
  const syncTimer = useRef(null);
  const tcRef     = useRef(null);

  useEffect(() => { tokenRef.current = token; },      [token]);
  useEffect(() => { fileRef.current  = driveFileId; }, [driveFileId]);

  // Poll for GIS library load
  useEffect(() => {
    const check = setInterval(() => {
      if (window.google?.accounts?.oauth2) { setGisReady(true); clearInterval(check); }
    }, 300);
    return () => clearInterval(check);
  }, []);

  // Init token client once GIS is ready
  useEffect(() => {
    if (!gisReady || CLIENT_ID.includes('YOUR_GOOGLE')) return;
    tcRef.current = window.google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      callback: async resp => {
        if (!resp.access_token) { setLoading(false); return; }
        const tok = resp.access_token;
        sessionStorage.setItem('f_tok', tok);
        setToken(tok);
        tokenRef.current = tok;
        try {
          const userInfo = await getUserInfo(tok);
          sessionStorage.setItem('f_user', JSON.stringify(userInfo));
          setGoogleUser(userInfo);
          // Load from Drive
          const file = await driveSearchFile(tok);
          if (file) {
            fileRef.current = file.id;
            setFileId(file.id);
            try {
              const driveData = await driveDownload(tok, file.id);
              const merged = { ...DEFAULT_DATA, ...driveData, profile: { ...DEFAULT_DATA.profile, ...driveData.profile } };
              setDataRaw(merged);
              localStorage.setItem('forma', JSON.stringify(merged));
            } catch {}
          }
          setSync('synced');
        } catch (e) {
          console.error('Auth error:', e);
        }
        setLoading(false);
      },
    });
  }, [gisReady]);

  function signIn() {
    if (!tcRef.current) return;
    setLoading(true);
    tcRef.current.requestAccessToken();
  }

  function signOut() {
    if (token && window.google?.accounts?.oauth2) {
      window.google.accounts.oauth2.revoke(token, () => {});
    }
    sessionStorage.removeItem('f_tok');
    sessionStorage.removeItem('f_user');
    setToken(null); setGoogleUser(null); setFileId(null); setSync('idle');
  }

  // Sync to Drive (debounced)
  async function syncNow(d) {
    const tok = tokenRef.current;
    const fid = fileRef.current;
    if (!tok) { setSync('idle'); return; }
    setSync('syncing');
    try {
      if (fid) {
        await driveUpdate(tok, fid, d);
      } else {
        const res = await driveCreate(tok, d);
        if (res?.id) { fileRef.current = res.id; setFileId(res.id); }
      }
      setSync('synced');
    } catch (e) {
      console.error('Sync error:', e);
      setSync('error');
    }
  }

  const updateData = useCallback(updater => {
    setDataRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : { ...prev, ...updater };
      localStorage.setItem('forma', JSON.stringify(next));
      clearTimeout(syncTimer.current);
      setSync('pending');
      syncTimer.current = setTimeout(() => syncNow(next), 2500);
      return next;
    });
  }, []);

  // Service worker
  useEffect(() => {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  }, []);

  const notConfigured = CLIENT_ID.includes('YOUR_GOOGLE');

  if (!token) {
    return <SignInScreen onSignIn={signIn} loading={loading} notConfigured={notConfigured} />;
  }

  if (loading) {
    return (
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: C.bg, gap: 12 }}>
        <p style={{ fontSize: 20, fontFamily: F.serif, color: C.text }}>Loading your data…</p>
        <p style={{ fontSize: 13, color: C.t2 }}>Connecting to Google Drive</p>
      </div>
    );
  }

  if (!data.profile?.name) {
    return <OnboardingScreen googleUser={googleUser} onComplete={profile => updateData(prev => ({ ...prev, profile }))} />;
  }

  const screens = { home: HomeScreen, log: LogScreen, gym: GymScreen, me: ProfileScreen };
  const Screen = screens[activeTab] || HomeScreen;

  return (
    <div style={{ height: '100%', position: 'relative', background: C.bg }}>
      <StatusBar syncStatus={syncStatus} />
      <Screen
        data={data}
        onUpdate={updateData}
        onNav={setTab}
        googleUser={googleUser}
        syncStatus={syncStatus}
        onSyncNow={() => syncNow(data)}
        onSignOut={signOut}
      />
      <TabBar active={activeTab} onTab={setTab} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
