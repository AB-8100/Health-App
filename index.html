// ─────────────────────────────────────────────────────────────────────────────
// FORMA — LOCAL AUTH + STORAGE
// Email/password authentication with localStorage persistence.
// ─────────────────────────────────────────────────────────────────────────────
const GOOGLE_CLIENT_ID = '377618672891-jo8pokb9r4i0rttq8646miaslj5cb3eo.apps.googleusercontent.com'; // kept for compat references


// ── Identity helpers ─────────────────────────────────────────────────────────
function getCachedToken() {
  try { return localStorage.getItem('forma_local_token') || null; } catch { return null; }
}
function setCachedToken(token) {
  if (token) localStorage.setItem('forma_local_token', token);
}
function clearCachedToken() {
  localStorage.removeItem('forma_local_token');
}

function getCachedIdentity() {
  try { return JSON.parse(localStorage.getItem('forma_identity')); } catch { return null; }
}
function setCachedIdentity(identity) {
  localStorage.setItem('forma_identity', JSON.stringify(identity));
}
function clearCachedIdentity() {
  localStorage.removeItem('forma_identity');
}

// ── User registry ─────────────────────────────────────────────────────────────
function getUsers() {
  try { return JSON.parse(localStorage.getItem('forma_users')) || []; } catch { return []; }
}
function saveUsers(users) {
  localStorage.setItem('forma_users', JSON.stringify(users));
}

// Simple password hash using btoa (sufficient for a browser prototype)
function hashPassword(email, password) {
  return btoa(email.toLowerCase() + ':' + password);
}

// ── Local data read/write ────────────────────────────────────────────────────
function localDataRead(userId) {
  try { return JSON.parse(localStorage.getItem('forma_data_' + userId)); } catch { return null; }
}
function localDataWrite(userId, data) {
  try { localStorage.setItem('forma_data_' + userId, JSON.stringify(data)); } catch(e) { console.warn('Forma: save failed', e); }
}

// ── High-level Forma data helpers ────────────────────────────────────────────
const LS_CACHE_KEY = 'forma_data_cache';

function loadFromCache() {
  try { return JSON.parse(localStorage.getItem(LS_CACHE_KEY)); } catch { return null; }
}
function saveToCache(data) {
  try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(data)); } catch(e) {}
}

// Debounced local save
let _saveTimer = null;
function scheduleDriveSave(userId, data) {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    try {
      saveToCache(data);
      if (userId && userId !== 'local') {
        localDataWrite(userId, data);
      }
    } catch (err) {
      console.warn('Forma: Local save failed', err);
    }
  }, 2500);
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

// AnimatedNumber: ticks from 0 to value over duration ms.
// Initial state is `value` so content is correct even if rAF is stalled
// (e.g. inside a transformed/offscreen design-canvas artboard). On mount we
// reset to 0 and tween; if the tween never ticks, the next render still
// shows the right number.
function AnimatedNumber({ value, duration = 900, decimals = 0, prefix = "", suffix = "", style }) {
  const [n, setN] = React.useState(value);
  React.useEffect(() => {
    let raf, start, cancelled = false;
    setN(0);
    const step = (t) => {
      if (cancelled) return;
      if (!start) start = t;
      const p = Math.min(1, (t - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setN(value * eased);
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    // Safety net: if rAF never advances, snap to final after duration+200ms
    const safety = setTimeout(() => setN(value), duration + 250);
    return () => { cancelled = true; cancelAnimationFrame(raf); clearTimeout(safety); };
  }, [value, duration]);
  const out = decimals > 0 ? n.toFixed(decimals) : Math.round(n).toLocaleString();
  return <span style={style}>{prefix}{out}{suffix}</span>;
}

// ────────────────────────────────────────────────────────────
// Ring: animated stroke-dasharray ring (CSS-transition driven for robustness)
function Ring({ size = 64, stroke = 7, value, goal, color, track = "#00000010", delay = 0, children }) {
  const target = Math.min(1, value / goal);
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const [drawn, setDrawn] = React.useState(false);
  React.useEffect(() => {
    const id = setTimeout(() => setDrawn(true), 60 + delay);
    return () => clearTimeout(id);
  }, [delay]);
  const offset = c * (1 - (drawn ? target : 0));

  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} stroke={track} strokeWidth={stroke} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke}
          fill="none" strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={offset}
          style={{ transition: 'stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1)' }}/>
      </svg>
      {children && (
        <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
          {children}
        </div>
      )}
    </div>
  );
}

// Concentric rings (Apple Watch style)
function StackedRings({ size = 160, stroke = 14, rings, gap = 4 }) {

                  color={r.color} track={r.color + "20"} delay={i*120} />

  );
}

  return (
    <div style={{ height, background: track, borderRadius: radius, overflow: 'hidden' }}>

        height: '100%', width: w + '%', background: color, borderRadius: radius,
        transition: 'width 1.1s cubic-bezier(.2,.7,.2,1)'

}

// Sparkline (mini line chart in SVG)
function Sparkline({ data, color = "#16A34A", width = 60, height = 22, strokeWidth = 1.5 }) {
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((v - min) / range) * (height - 4) - 2;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg width={width} height={height} style={{ display:'block', overflow:'visible' }}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth={strokeWidth}
        strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={width} cy={height - ((data[data.length-1] - min) / range) * (height - 4) - 2}
              r="2" fill={color}/>
    </svg>
  );
}

})();

  // If user doesn't track cycle, drop the cycle-flavored content from focus rotation
  const visibleFocusCards = tracksCycle
    ? FOCUS_CARDS
    : FOCUS_CARDS.map(c => {
        if (c.id === 'workout') return {
          ...c,
          body: "You've had two full recovery days. Time to push.",
        };
        if (c.id === 'nutrition') return {
          ...c,
          tag:'Nutrition',
          titleParts:['Hit your ', { accent:'protein' }, ' target today.'],
          body:"Connect your nutrition app to see your averages and get personalised targets.",
        };
        return c;
      });

  const [focusIdx, setFocusIdx] = React.useState(0);
  const focusTouchX = React.useRef(null); // tracks swipe start X
  const focus = visibleFocusCards[focusIdx % visibleFocusCards.length];

  // Values are 0 until real data arrives from integrations (Apple Health, Oura, etc.)
  const ringsRefined = [
    { id: 'steps', label: 'Steps',   value: 0, goal: 10000, unit: '',  color: t.steps },
    { id: 'prot',  label: 'Protein', value: 0, goal: 140,   unit: 'g', color: t.prot  },
    { id: 'sleep', label: 'Sleep',   value: 0, goal: 8,     unit: 'h', color: t.sleep },
  ];

  // Style helper to wire "em data-em='accent'" inside titles to the theme accent
  const titleStyle = { fontFamily:t.serif, fontSize:25, lineHeight:1.12, color:t.text, fontStyle:'normal', letterSpacing:'-.01em' };
  const accentEm = { color: t.accent, fontStyle:'normal' };

  const planSplit = plan && window.SPLITS && window.SPLITS[plan.splitDays];
  const todayPlanDay = planSplit ? planSplit.days[(plan.todayIdx || 0) % planSplit.days.length] : null;
  const planExerciseIds = todayPlanDay
    ? [...(todayPlanDay.compound || []), ...(todayPlanDay.accessory || [])]
    : [];

  return (
    <div style={{
      width, height, background:t.bg, fontFamily:t.sans, color:t.text,
      display:'flex', flexDirection:'column', overflow:'hidden', position:'relative'
    }}>
      {/* Subtle ambient glow for dark theme */}
      {theme === 'dark' && (
        <>
          <div style={{
            position:'absolute', top:-60, left:-40, width:240, height:240, borderRadius:'50%',
            background:`radial-gradient(circle, ${t.accent}22, transparent 65%)`, pointerEvents:'none'
          }}/>
          <div style={{
            position:'absolute', top:260, right:-100, width:300, height:300, borderRadius:'50%',
            background:`radial-gradient(circle, ${t.rose}15, transparent 65%)`, pointerEvents:'none'
          }}/>
        </>
      )}

      {/* Status bar */}
      <div style={{
        height:44, display:'flex', alignItems:'flex-end', justifyContent:'space-between',
        padding:'0 22px 8px', fontSize:14, fontWeight:600, color:t.text, position:'relative'
      }}>
        <span>9:41</span>
        <div style={{ display:'flex', gap:5, alignItems:'center', fontSize:11 }}>
          <span>●●●</span><span>📶</span><span>🔋</span>
        </div>
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'4px 20px 14px', position:'relative' }}
           className="phone-scroll">

        {/* Active session banner */}
        {activeSession && (
          <div onClick={onResumeSession} style={{
            background: theme==='dark' ? t.surface : '#FFF',
            border: `1.5px solid ${t.accent}`,
            borderRadius:14, padding:'10px 14px',
            display:'flex', alignItems:'center', gap:11,
            marginTop:6, marginBottom:14, cursor:'pointer',
            boxShadow: theme==='dark' ? `0 0 16px ${t.accent}20` : `0 4px 14px ${t.accent}18`,
          }}>
            <div style={{
              width:34, height:34, borderRadius:10,
              background: t.accent + '18',
              color: t.accent, display:'flex', alignItems:'center', justifyContent:'center',
              flexShrink:0
            }}>
              {activeSession.paused ? (
                <svg width="14" height="14" viewBox="0 0 12 12" fill="currentColor">
                  <rect x="2.5" y="2" width="2.5" height="8" rx="1"/>
                  <rect x="7" y="2" width="2.5" height="8" rx="1"/>
                </svg>
              ) : (
                <PulseDot color={t.accent} size={9}/>
              )}
            </div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{
                fontSize:9, letterSpacing:'.16em', textTransform:'uppercase',
                color: activeSession.paused ? '#B45309' : t.accent,
                fontWeight:600, marginBottom:1
              }}>
                {activeSession.paused ? 'Paused' : 'In progress'}
              </div>
              <div style={{ fontSize:13, color:t.text, fontWeight:500, display:'flex', alignItems:'baseline', gap:8 }}>
                {activeSession.workout || 'Workout'}
                <span style={{ fontFamily:t.mono, fontSize:12, color:t.text2, fontVariantNumeric:'tabular-nums' }}>
                  {`${Math.floor(activeSession.elapsed/60)}:${String(activeSession.elapsed%60).padStart(2,'0')}`}
                </span>
              </div>
            </div>
            <div style={{
              padding:'7px 12px', borderRadius:9, background:t.accent, color:t.accentText,
              fontSize:11, fontWeight:600, fontFamily:t.sans,
              display:'flex', alignItems:'center', gap:5
            }}>
              Resume →
            </div>
          </div>
        )}

        {/* Header — greeting + phase pill + about-me gear */}
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:18 }}>
          <div>
            <div style={{
              fontSize:9.5, letterSpacing:'.18em', textTransform:'uppercase',
              color:t.text3, marginBottom:3
            }}>
              {dateLabel}
            </div>
            <div style={{ fontFamily:t.serif, fontSize:28, lineHeight:1, color:t.text }}>
              Morning, {userName}.
            </div>
          </div>
          {tracksCycle ? (
            <div style={{
              padding:'4px 9px', borderRadius:999,
              border:`1px solid ${theme==='dark' ? t.border2 : t.border}`,
              background:theme==='dark' ? t.surface : '#FFF',
              fontSize:10, color:t.text2, display:'flex', alignItems:'center', gap:5
            }}>
              <span style={{
                width:6, height:6, borderRadius:'50%', background:t.rose,
                boxShadow: theme==='dark' ? `0 0 6px ${t.rose}` : 'none'
              }}/>
              Cycle data pending
            </div>
          ) : (
            <div style={{
              padding:'4px 9px', borderRadius:999,
              border:`1px solid ${theme==='dark' ? t.border2 : t.border}`,
              background:theme==='dark' ? t.surface : '#FFF',
              fontSize:10, color:t.text2, display:'flex', alignItems:'center', gap:5
            }}>
              <span style={{
                width:6, height:6, borderRadius:'50%', background:t.green,
              }}/>
              {profile?.goal === 'strength' ? 'Strength block · Wk 4' :
               profile?.goal === 'muscle'   ? 'Hypertrophy · Wk 4' :
               profile?.goal === 'fat-loss' ? 'Cut · Wk 4' : 'Wk 4'}
            </div>
          )}
          {/* About Me gear button */}
          <button onClick={() => onOpenAbout && onOpenAbout()} style={{
            width:32, height:32, borderRadius:9,
            background: theme==='dark' ? t.surface : '#FFF',
            border:`1px solid ${theme==='dark' ? t.border2 : t.border}`,
            color:t.text2, cursor:'pointer',
            display:'flex', alignItems:'center', justifyContent:'center', fontSize:14,
            marginLeft:6
          }}>⚙</button>
        </div>

        {/* TODAY'S FOCUS — rotating coach card. Swipeable. */}
        <div
          onTouchStart={(e) => { focusTouchX.current = e.touches[0].clientX; }}
          onTouchEnd={(e) => {
            if (focusTouchX.current === null) return;
            const dx = e.changedTouches[0].clientX - focusTouchX.current;
            if (dx < -40) setFocusIdx(i => (i + 1) % visibleFocusCards.length);
            if (dx > 40)  setFocusIdx(i => (i - 1 + visibleFocusCards.length) % visibleFocusCards.length);
            focusTouchX.current = null;
          }}
          style={{
          background: theme==='dark'
            ? `linear-gradient(135deg, ${t.surface} 0%, ${t.surface2} 100%)`
            : t.invSurface,
          border: theme==='dark' ? `1px solid ${t.border2}` : 'none',
          color: theme==='dark' ? t.text : t.invText,
          borderRadius:20, padding:'18px 20px 16px',
          marginBottom:14, position:'relative', overflow:'hidden',
          userSelect:'none', WebkitUserSelect:'none',
        }}>
          {/* glow line top */}
          {theme==='dark' && (
            <div style={{
              position:'absolute', top:0, left:0, right:0, height:1,
              background:`linear-gradient(90deg, transparent, ${t.accent}80, transparent)`

          {theme==='light' && (
            <div style={{
              position:'absolute', top:-30, right:-30, width:140, height:140, borderRadius:'50%',
              background:`radial-gradient(circle, ${t.accent}35, transparent 70%)`,
              pointerEvents:'none'
            }}/>

          {/* Tag row */}
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10, position:'relative' }}>
            <div style={{ display:'flex', alignItems:'center', gap:7 }}>
              <PulseDot color={t.accent} size={6}/>
              <span style={{
                fontSize:9.5, letterSpacing:'.18em', color:t.accent,
                textTransform:'uppercase', fontWeight:500
              }}>
                Today's focus · {focus.tag}
              </span>
            </div>
            {/* dots */}
            <div style={{ display:'flex', gap:4 }}>
              {visibleFocusCards.map((_,i) => (
                <button key={i} onClick={()=>setFocusIdx(i)} style={{
                  width:14, height:3, borderRadius:2, border:'none', cursor:'pointer',
                  background: i===focusIdx
                    ? (theme==='dark' ? t.text : t.invText)
                    : (theme==='dark' ? t.text3 + '60' : t.invText2 + '40')
                }}/>
              ))}
            </div>
          </div>

          {/* Title with accent em */}
          <div style={{ ...titleStyle, color: theme==='dark' ? t.text : t.invText, marginBottom:8, position:'relative', maxWidth:'94%' }}>
            {(() => {
              const renderTitle = (parts) => {
                if (!parts || !Array.isArray(parts)) return String(parts || '');
                return parts.map((part, i) => {
                  if (typeof part === 'string') return <React.Fragment key={i}>{part}</React.Fragment>;
                  if (part && typeof part === 'object' && part.accent) return <span key={i} style={accentEm}>{part.accent}</span>;
                  return null;
                });
              };
              return renderTitle(focus.titleParts);
            })()}
          </div>

          <div style={{
            fontSize:12, lineHeight:1.55,
            color: theme==='dark' ? t.text2 : t.invText2,
            marginBottom:14, position:'relative'
          }}>
            {focus.body}
          </div>

          <div style={{ display:'flex', gap:8, position:'relative' }}>
            <button onClick={() => {
              if (focus.id === 'workout' && onStartSession) onStartSession();
            }} style={{
              flex:1, padding:'11px 14px', borderRadius:11,
              background:t.accent, color:t.accentText,
              border:'none', fontFamily:t.sans, fontSize:12.5, fontWeight:600,
              cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:6
            }}>
              {focus.cta} <span style={{ fontSize:14 }}>{focus.arrow}</span>
            </button>
            <button style={{
              padding:'11px 14px', borderRadius:11, background:'transparent',
              border:`1px solid ${theme==='dark' ? t.border2 : '#FFFFFF30'}`,
              color: theme==='dark' ? t.text2 : t.invText2,
              cursor:'pointer', fontSize:12, fontFamily:t.sans
            }}>Later</button>
          </div>
        </div>

        {/* Rings card — Steps / Protein / Sleep */}
        <div style={{
          background:t.surface, border:`1px solid ${t.border}`, borderRadius:20,
          padding:'16px 18px', marginBottom:12, display:'flex', gap:18, alignItems:'center'
        }}>
          <div style={{
            flexShrink:0,
            filter: theme==='dark' ? 'drop-shadow(0 0 12px rgba(212,165,116,.15))' : 'none'
          }}>
            <StackedRings size={120} stroke={11} gap={3} rings={ringsRefined}/>
          </div>
          <div style={{ flex:1, display:'flex', flexDirection:'column', gap:11 }}>
            {ringsRefined.map((r,i) => {
              const pct = Math.round((r.value/r.goal)*100);
              return (
                <div key={r.id}>
                  <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:2 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:7 }}>
                      <span style={{
                        width:7, height:7, borderRadius:'50%', background:r.color,
                        boxShadow: theme==='dark' ? `0 0 6px ${r.color}80` : 'none'
                      }}/>
                      <span style={{ fontSize:11, color:t.text2, letterSpacing:'.02em' }}>{r.label}</span>
                    </div>
                    <span style={{ fontSize:10.5, color:t.text3, fontVariantNumeric:'tabular-nums' }}>
                      {pct}%
                    </span>
                  </div>
                  <div style={{
                    fontFamily:t.serif, fontSize:17, color:t.text, lineHeight:1,
                    fontVariantNumeric:'tabular-nums'
                  }}>
                    <AnimatedNumber value={r.value}
                      decimals={Number.isInteger(r.value)?0:1}
                      duration={900+i*120}/>
                    <span style={{ fontSize:11, color:t.text3, fontFamily:t.sans, marginLeft:3 }}>
                      / {r.goal.toLocaleString()}{r.unit}
                    </span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* SESSIONS THIS WEEK — uses completedSessions from App state */}
        {(() => {
          const split = SPLITS && plan?.splitDays ? SPLITS[plan.splitDays] : null;
          const planned = split ? split.days.length : 3;
          // Get this week's completed sessions
          const now = new Date();
          const weekStart = new Date(now);
          weekStart.setDate(now.getDate() - (now.getDay() === 0 ? 6 : now.getDay() - 1));
          weekStart.setHours(0,0,0,0);
          const thisWeekDone = completedSessions.filter(s => new Date(s.date) >= weekStart);
          const doneCount = thisWeekDone.length;
          // 8-week rolling count — demo fallback if no real data
          const sparkData = doneCount > 0
            ? [...SESSIONS_WEEKS.slice(1), doneCount]
            : SESSIONS_WEEKS;
          const avg8 = Math.round(SESSIONS_WEEKS.reduce((s,v) => s+v, 0) / SESSIONS_WEEKS.length);
          const aboveAvg = doneCount > avg8;

          // Build full week pill list: completed (green) + remaining planned (grey)
          const completedPills = thisWeekDone.map(s => ({
            kind: 'gym', name: s.workout || 'Session', day: new Date(s.date).toLocaleDateString('en', {weekday:'short'}),
            dur: Math.floor((s.elapsed||0)/60) + 'm', done: true
          }));
          const remainingCount = Math.max(0, planned - doneCount);

          return (
            <div style={{
              background:t.surface, border:`1px solid ${t.border}`, borderRadius:20,
              padding:'16px 18px 14px', marginBottom:12
            }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:12 }}>
                <div>
                  <div style={{ fontSize:10, letterSpacing:'.16em', textTransform:'uppercase', color:t.text3, marginBottom:3 }}>
                    Sessions this week
                  </div>
                  <div style={{ display:'flex', alignItems:'baseline', gap:6 }}>
                    <span style={{ fontFamily:t.serif, fontSize:30, color:t.text, lineHeight:1 }}>
                      <AnimatedNumber value={doneCount} duration={700}/>
                    </span>
                    <span style={{ fontSize:11, color:t.text3 }}>of {planned} complete</span>
                  </div>
                  <div style={{ fontSize:10.5, marginTop:3, fontWeight:500, color: aboveAvg ? t.green : t.text3 }}>
                    {aboveAvg ? `↑ +${doneCount - avg8} vs 8-wk avg` : `↔ avg ${avg8}/wk`}
                  </div>
                </div>
                <div style={{ textAlign:'right' }}>
                  <BarSpark data={sparkData} color={t.accent}
                    dimColor={theme==='dark' ? t.text3 : '#D6CFC2'}
                    max={5} width={120} height={30}/>
                  <div style={{ fontSize:9, color:t.text3, marginTop:4, fontFamily:t.mono, letterSpacing:'.05em' }}>
                    8 wk · per/wk
                  </div>
                </div>
              </div>

              <div style={{ display:'flex', gap:6, flexWrap:'wrap', paddingTop:11, borderTop:`1px solid ${t.border}` }}>
                {/* Completed sessions — green */}
                {completedPills.map((s, i) => (
                  <div key={i} style={{
                    display:'flex', alignItems:'center', gap:6,
                    padding:'5px 9px 5px 8px', borderRadius:8,
                    background:t.green+'12', border:`1px solid ${t.green}30`
                  }}>
                    <span style={{ fontSize:10, color:t.green }}>✓</span>
                    <ActivityIcon kind={s.kind} size={12} color={t.green}/>
                    <span style={{ fontSize:11, color:t.text }}>{s.name}</span>
                    <span style={{ fontSize:10, color:t.text3 }}>· {s.day} · {s.dur}</span>
                  </div>
                ))}
                {/* Remaining planned sessions — grey */}
                {Array.from({length: remainingCount}).map((_, i) => (
                  <div key={'p'+i} style={{
                    display:'flex', alignItems:'center', gap:5,
                    padding:'5px 9px', borderRadius:8,
                    background:'transparent', border:`1px dashed ${t.border2}`
                  }}>
                    <span style={{ fontSize:10, color:t.text3 }}>To go · session {doneCount + i + 1}</span>
                  </div>
                ))}
                {doneCount === 0 && remainingCount === 0 && (
                  <div style={{ fontSize:11, color:t.text3, padding:'4px 0' }}>
                    No sessions planned this week.
                  </div>
                )}
              </div>
            </div>
          );
        })()}

        {/* Today's session preview */}
        <div
          onClick={() => onStartSession && onStartSession()}
          style={{
            background:t.surface, border:`1px solid ${t.border}`, borderRadius:20,
            padding:'16px 18px 14px', marginBottom:12, cursor:'pointer',
            transition:'border-color .15s, transform .15s'
          }}
          onMouseEnter={(e)=>{ e.currentTarget.style.borderColor = t.accent + '60'; }}
          onMouseLeave={(e)=>{ e.currentTarget.style.borderColor = t.border; }}
        >
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:12 }}>
            <div>
              <div style={{
                fontSize:10, letterSpacing:'.16em', textTransform:'uppercase',
                color:t.text3, marginBottom:3
              }}>
                Up next
              </div>
              <div style={{ fontFamily:t.serif, fontSize:22, lineHeight:1.1 }}>
                {todayPlanDay ? todayPlanDay.name + ' day' : 'Rest day'}
              </div>
              <div style={{ fontSize:11, color:t.text2, marginTop:3 }}>
                {todayPlanDay ? todayPlanDay.muscles : 'No session planned'}
              </div>
            </div>
          </div>
          <div style={{ marginBottom:0 }}>
            {planExerciseIds.slice(0, 3).map((id, i) => {
              const ex = window.EX_LIB && window.EX_LIB[id];
              if (!ex) return null;
              return (
                <div key={i} style={{
                  display:'flex', justifyContent:'space-between', alignItems:'center',
                  padding:'8px 0', borderTop: i>0 ? `1px solid ${t.border}` : 'none', fontSize:12
                }}>
                  <div style={{ display:'flex', alignItems:'center', gap:9 }}>
                    <span style={{
                      fontSize:9, color:t.text3, fontFamily:t.mono, width:14
                    }}>{String(i+1).padStart(2,'0')}</span>
                    <span style={{ color:t.text }}>{ex.name}</span>
                    {todayPlanDay?.compound?.includes(id) && <span style={{
                      fontSize:9, color:t.accent, fontWeight:600, letterSpacing:'.04em'
                    }}>key</span>}
                  </div>
                  <span style={{ color:t.text3, fontSize:11 }}>{ex.muscle}</span>
                </div>
              );
            })}
            {planExerciseIds.length > 3 && (
              <div style={{ padding:'8px 0 0', fontSize:10.5, color:t.text3 }}>
                + {planExerciseIds.length - 3} more
              </div>
            )}
            {!todayPlanDay && (
              <div style={{ padding:'8px 0 0', fontSize:11, color:t.text3 }}>
                Set up your training split in the Gym tab.
              </div>
            )}
          </div>
        </div>

        {/* Quick log row */}
        <div style={{
          display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:7,
          marginTop:4
        }}>
          {[
            { id:'sleep', icon:'💤', label:'Log sleep', sub:'' },
            { id:'mood',  icon:'🙂', label:'Log mood',  sub:'' },
            { id:'water', icon:'💧', label:'Log water', sub:'' },
          ].map(q => (
            <button key={q.id} style={{
              background:t.surface, border:`1px solid ${t.border}`, borderRadius:14,
              padding:'10px 8px 9px', textAlign:'center', cursor:'pointer',
              fontFamily:t.sans
            }}>
              <div style={{ fontSize:16, marginBottom:3 }}>{q.icon}</div>
              <div style={{ fontSize:11, color:t.text, fontWeight:500 }}>{q.label}</div>
              <div style={{ fontSize:9.5, color:t.text3, marginTop:2 }}>{q.sub}</div>
            </button>
          ))}
        </div>
      </div>

      <BottomNav theme={theme} active="home" onNav={onNav} tracksCycle={tracksCycle}/>
    </div>
  );
}

window.RefinedHome = RefinedHome;
window.themes = themes;

</script>

<script type="text/babel" data-presets="react">
// In-session gym screen — what you see mid-workout
// Shows current exercise, set tracker with inline weight/reps logging, rest timer,
// and a queue of remaining exercises.

const GYM_QUEUE = [
  {
    id: 'bench',
    name: 'Bench press',
    muscle: 'Chest',
    targetSets: 4,
    targetReps: 8,
    targetWeight: 57.5,
    isPR: true,
    lastWeek: '55kg × 10',
    sets: [],  // seeded fresh on session start
  },
  { id: 'ohp',      name: 'Overhead press',   muscle: 'Shoulders',  targetSets: 4, targetWeight: 37.5, targetReps: 9,  lastWeek: '37.5 × 8',  sets: [] },
  { id: 'incline',  name: 'Incline DB press', muscle: 'Upper chest',targetSets: 3, targetWeight: 26,   targetReps: 10, lastWeek: '24 × 12',   sets: [] },
  { id: 'lateral',  name: 'Lateral raises',   muscle: 'Shoulders',  targetSets: 3, targetWeight: 12,   targetReps: 15, lastWeek: '12 × 15',   sets: [] },
  { id: 'tricep',   name: 'Tricep pushdown',  muscle: 'Triceps',    targetSets: 3, targetWeight: 45,   targetReps: 12, lastWeek: '45 × 12',   sets: [] },
  { id: 'skulls',   name: 'Skull crushers',   muscle: 'Triceps',    targetSets: 3, targetWeight: 22.5, targetReps: 12, lastWeek: '22.5 × 12', sets: [] },
];

function GymSessionScreen({ width = 390, height = 820, theme = 'light', session, setSession, onNav, onExit, onComplete, tracksCycle = true }) {
  const t = themes[theme];

  // Seed all exercises with blank sets on session start.
  // This ensures the user enters their own reps — nothing is pre-filled.
  React.useEffect(() => {
    if (!session.queue) {
      const seeded = GYM_QUEUE.map(ex => ({
        ...ex,
        sets: Array.from({ length: ex.targetSets }, () => ({ w: null, r: null, done: false }))
      }));
      setSession(s => ({ ...s, queue: seeded, exIdx: 0 }));
    }
  }, []);  // eslint-disable-line react-hooks/exhaustive-deps

  const queue   = session.queue   || GYM_QUEUE;
  const exIdx   = session.exIdx   || 0;
  const elapsed = session.elapsed || 0;
  const paused  = session.paused  || false;

  // Local UI state only
  const [restSec, setRestSec] = React.useState(0);
  const [showEndConfirm, setShowEndConfirm] = React.useState(false);

  // rest countdown (local — resets on nav, that's OK)
  React.useEffect(() => {
    if (restSec <= 0 || paused) return;
    const id = setInterval(() => setRestSec(s => Math.max(0, s - 1)), 1000);
    return () => clearInterval(id);
  }, [restSec, paused]);

  const fmt = (s) => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  const cur = queue[exIdx];
  const curSetIdx = (cur?.sets || []).findIndex(s => !s.done);
  const totalDone = queue.reduce((n,e) => n + (e.sets||[]).filter(s=>s.done).length, 0);
  const totalSets = queue.reduce((n,e) => n + e.targetSets, 0);
  const allDone = totalDone >= totalSets;

  const updateSet = (i, field, value) => {
    const next = queue.slice();
    const sets = next[exIdx].sets.slice();
    sets[i] = { ...sets[i], [field]: value };
    next[exIdx] = { ...next[exIdx], sets };
    setSession(s => ({ ...s, queue: next }));
  };
  const logSet = () => {
    if (curSetIdx < 0) return;
    const next = queue.slice();
    const sets = next[exIdx].sets.slice();
    const s = sets[curSetIdx];
    sets[curSetIdx] = {
      w: s.w ?? cur.targetWeight,
      r: s.r ?? cur.targetReps,
      done: true,
    };
    next[exIdx] = { ...next[exIdx], sets };
    setSession(sn => ({ ...sn, queue: next }));
    setRestSec(90);

    // Auto-advance to next exercise if this was the last set
    if (curSetIdx === sets.length - 1) {
      for (let i = exIdx + 1; i < next.length; i++) {
        // Auto-seed missing sets
        if (!next[i].sets || next[i].sets.length === 0) {
          const seeded = Array.from({ length: next[i].targetSets }, () => ({ w: null, r: null, done: false }));
          next[i] = { ...next[i], sets: seeded };
        }
        if ((next[i].sets || []).some(s => !s.done)) {
          setSession(sn => ({ ...sn, queue: next.slice() }));
          setTimeout(() => setSession(sn => ({ ...sn, exIdx: i })), 800);
          break;
        }
      }
    }
  };
  const togglePause = () => setSession(s => ({ ...s, paused: !s.paused }));
  const finishSession = () => {
    setShowEndConfirm(false);
    if (onComplete) onComplete({ queue, elapsed, workout: session.workout });
  };
  const jumpToExercise = (i) => setSession(s => ({ ...s, exIdx: i }));

  return (
    <div style={{
      width, height, background:t.bg, fontFamily:t.sans, color:t.text,
      display:'flex', flexDirection:'column', overflow:'hidden', position:'relative'
    }}>
      {/* Status bar */}
      <div style={{
        height:44, display:'flex', alignItems:'flex-end', justifyContent:'space-between',
        padding:'0 22px 8px', fontSize:14, fontWeight:600, color:t.text
      }}>
        <span>9:41</span>
        <div style={{ display:'flex', gap:5, alignItems:'center', fontSize:11 }}>
          <span>●●●</span><span>📶</span><span>🔋</span>
        </div>
      </div>

      {/* Top app bar */}
      <div style={{
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'2px 14px 12px', borderBottom:`1px solid ${t.border}`,
        background: t.bg, gap:8
      }}>
        <button onClick={() => {
          // If mid-session, show confirm sheet rather than silently leaving.
          if (session.active) { setShowEndConfirm(true); }
          else { onExit && onExit(); }
        }} style={{
          width:32, height:32, borderRadius:9, background:'transparent',
          border:`1px solid ${t.border}`, color:t.text, cursor:'pointer',
          display:'flex', alignItems:'center', justifyContent:'center', fontSize:14,
          flexShrink:0
        }}>←</button>

        <div style={{ display:'flex', alignItems:'center', gap:8, flex:1, justifyContent:'center' }}>
          <div style={{ textAlign:'center', lineHeight:1.1 }}>
            <div style={{
              fontSize:9, letterSpacing:'.18em', color: paused ? '#B45309' : t.text3,
              textTransform:'uppercase', marginBottom:4, fontWeight:500, lineHeight:1
            }}>
              {paused ? 'Paused' : 'In session'}
            </div>
            <div style={{
              fontFamily:t.mono, fontSize:15, color:t.text, lineHeight:1,
              fontVariantNumeric:'tabular-nums', display:'flex', alignItems:'center', gap:6,
              justifyContent:'center'
            }}>
              <span>{fmt(elapsed)}</span>
              {!paused && <PulseDot color={t.green} size={5}/>}
              {paused && <span style={{
                width:5, height:5, borderRadius:'50%', background:'#B45309', display:'inline-block'
              }}/>}
            </div>
          </div>
        </div>

        <div style={{ display:'flex', gap:5, flexShrink:0 }}>
          <button onClick={togglePause} title={paused ? 'Resume' : 'Pause'} style={{
            width:32, height:32, borderRadius:9,
            background: paused ? '#FEF3C7' : 'transparent',
            border:`1px solid ${paused ? '#FBBF24' : t.border}`,
            color: paused ? '#B45309' : t.text2,
            cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center'
          }}>
            {paused ? (
              <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor">
                <path d="M3 2 L10 6 L3 10 Z"/>
              </svg>
            ) : (
              <svg width="10" height="11" viewBox="0 0 10 12" fill="currentColor">
                <rect x="1" y="1" width="2.5" height="10" rx="1"/>
                <rect x="6.5" y="1" width="2.5" height="10" rx="1"/>
              </svg>
            )}
          </button>
          <button onClick={() => setShowEndConfirm(true)} title="End session" style={{
            width:32, height:32, borderRadius:9,
            background:'transparent', border:`1px solid ${t.border}`,
            color: '#BE3B2E', cursor:'pointer',
            display:'flex', alignItems:'center', justifyContent:'center'
          }}>
            <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor">
              <rect x="0" y="0" width="10" height="10" rx="1"/>
            </svg>
          </button>
        </div>
      </div>

      {/* Body */}
      <div style={{ flex:1, overflowY:'auto', padding:'14px 18px 16px', position:'relative' }} className="phone-scroll">

        {/* Session header */}
        <div style={{
          display:'flex', alignItems:'flex-end', justifyContent:'space-between',
          marginBottom:14
        }}>
          <div>
            <div style={{ fontSize:10, letterSpacing:'.16em', color:t.text3, textTransform:'uppercase', marginBottom:3 }}>
              Workout
            </div>
            <div style={{ fontFamily:t.serif, fontSize:24, lineHeight:1, color:t.text }}>
              Push day
            </div>
          </div>
          <div style={{ fontSize:10.5, color:t.text3, letterSpacing:'.06em' }}>
            EX <span style={{ color:t.text }}>{exIdx+1}</span>/{queue.length} ·
            &nbsp;SETS <span style={{ color:t.text }}>{totalDone}</span>/{totalSets}
          </div>
        </div>

        <div style={{
          height:4, background:t.border, borderRadius:999, overflow:'hidden', marginBottom:18
        }}>
          <div style={{
            height:'100%', background:t.accent, borderRadius:999,
            width: `${(totalDone/totalSets)*100}%`,
            transition:'width .4s ease'
          }}/>
        </div>

        {/* Current exercise hero */}
        <div style={{ marginBottom:14 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:6, gap:12 }}>
            <ExerciseImage exerciseId={cur.id} size={56} radius={12} theme={theme}/>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:10, letterSpacing:'.16em', color:t.text3, textTransform:'uppercase', marginBottom:3 }}>
                Now
              </div>
              <div style={{ fontFamily:t.serif, fontSize:28, lineHeight:1, color:t.text }}>
                {cur.name}
              </div>
              <div style={{ fontSize:11.5, color:t.text2, marginTop:3 }}>
                {cur.muscle} · Last week: {cur.lastWeek}
              </div>
            </div>
            {cur.isPR && (
              <div style={{
                padding:'4px 9px', borderRadius:7,
                background:t.accent+'18', color:t.accent,
                border:`1px solid ${t.accent}30`,
                fontSize:9.5, fontWeight:600, letterSpacing:'.08em',
                textTransform:'uppercase', flexShrink:0
              }}>
                ★ PR
              </div>
            )}
          </div>
        </div>

        {/* Set tracker */}
        <div style={{
          background:t.surface, border:`1px solid ${t.border}`, borderRadius:18,
          padding:'4px 0', marginBottom:14, overflow:'hidden'
        }}>
          {/* header row */}
          <div style={{
            display:'grid', gridTemplateColumns:'40px 1fr 1fr 40px', gap:0,
            padding:'10px 16px 8px',
            fontSize:9.5, letterSpacing:'.12em', color:t.text3, textTransform:'uppercase',
            borderBottom:`1px solid ${t.border}`
          }}>
            <span>Set</span>
            <span style={{ textAlign:'center' }}>Weight</span>
            <span style={{ textAlign:'center' }}>Reps</span>
            <span></span>
          </div>
          {(cur.sets||[]).map((s,i) => {
            const isCurrent = i === curSetIdx;
            return (
              <div key={i} style={{
                display:'grid', gridTemplateColumns:'40px 1fr 1fr 40px', gap:0,
                alignItems:'center', padding:'10px 16px',
                borderBottom: i < cur.sets.length - 1 ? `1px solid ${t.border}` : 'none',
                background: isCurrent ? (theme==='dark' ? t.accent+'10' : t.accent+'08') : 'transparent',
              }}>
                <div style={{
                  fontFamily:t.mono, fontSize:12,
                  color: s.done ? t.text3 : (isCurrent ? t.accent : t.text2),
                  fontWeight: isCurrent ? 600 : 400
                }}>
                  {i+1}
                </div>

                {/* Weight cell */}
                <div style={{ display:'flex', justifyContent:'center' }}>
                  {s.done ? (
                    <span style={{ fontFamily:t.mono, fontSize:14, color:t.text2 }}>
                      {s.w}<span style={{ fontSize:10, color:t.text3 }}>kg</span>
                    </span>
                  ) : isCurrent ? (
                    <NumberInput
                      value={s.w ?? cur.targetWeight}
                      onChange={(v) => updateSet(i, 'w', v)}
                      step={2.5} suffix="kg" theme={theme}
                    />
                  ) : (
                    <span style={{ fontSize:13, color:t.text3 }}>
                      {cur.targetWeight}<span style={{ fontSize:10 }}>kg</span>
                    </span>
                  )}
                </div>

                {/* Reps cell */}
                <div style={{ display:'flex', justifyContent:'center' }}>
                  {s.done ? (
                    <span style={{ fontFamily:t.mono, fontSize:14, color:t.text2 }}>
                      ×{s.r}
                    </span>
                  ) : isCurrent ? (
                    <NumberInput
                      value={s.r ?? cur.targetReps}
                      onChange={(v) => updateSet(i, 'r', v)}
                      step={1} prefix="×" theme={theme}
                    />
                  ) : (
                    <span style={{ fontSize:13, color:t.text3 }}>
                      ×{cur.targetReps}
                    </span>
                  )}
                </div>

                <div style={{ textAlign:'center' }}>
                  {s.done ? (
                    <span style={{
                      width:22, height:22, display:'inline-flex', alignItems:'center',
                      justifyContent:'center', borderRadius:'50%',
                      background:t.green+'20', color:t.green, fontSize:13
                    }}>✓</span>
                  ) : isCurrent ? (
                    <span style={{
                      width:8, height:8, borderRadius:'50%', background:t.accent,
                      display:'inline-block',
                      boxShadow: theme==='dark' ? `0 0 8px ${t.accent}` : 'none'
                    }}/>
                  ) : (
                    <span style={{
                      width:8, height:8, borderRadius:'50%',
                      background:'transparent', border:`1px solid ${t.border2}`,
                      display:'inline-block'
                    }}/>
                  )}
                </div>
              </div>
            );
          })}
        </div>

        {/* Rest timer (visible when active) */}
        {restSec > 0 && (
          <div style={{
            background:theme==='dark' ? t.surface : '#FFF6F0',
            border:`1px solid ${theme==='dark' ? t.accent+'30' : t.accent+'40'}`,
            borderRadius:14, padding:'12px 14px', marginBottom:12,
            display:'flex', alignItems:'center', gap:12
          }}>
            <div style={{
              fontFamily:t.serif, fontSize:28, color:t.accent, lineHeight:1,
              fontVariantNumeric:'tabular-nums', minWidth:60
            }}>
              {fmt(restSec)}
            </div>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:11, color:t.text, fontWeight:500 }}>Rest</div>
              <div style={{ fontSize:10, color:t.text3 }}>Breathe. Hydrate. Next set up.</div>
            </div>
            <button
              onClick={() => setRestSec(0)}
              style={{
                padding:'5px 10px', borderRadius:7,
                background:'transparent', border:`1px solid ${t.border2}`,
                color:t.text2, fontSize:11, cursor:'pointer', fontFamily:t.sans
              }}>Skip</button>
          </div>
        )}

        {/* Primary action */}
        <button onClick={allDone ? finishSession : logSet} style={{
          width:'100%', padding:'14px', borderRadius:13,
          background: allDone ? t.green : (curSetIdx < 0 ? t.surface2 : t.accent),
          color: allDone ? '#fff' : (curSetIdx < 0 ? t.text3 : t.accentText),
          border:'none', fontFamily:t.sans, fontSize:14, fontWeight:600,
          cursor: 'pointer',
          marginBottom:18,
          display:'flex', alignItems:'center', justifyContent:'center', gap:7
        }}>
          {allDone
            ? 'Finish workout ✓'
            : (curSetIdx < 0 ? `Next exercise: ${queue[exIdx+1]?.name || ''} →` : `Log set ${curSetIdx+1} of ${cur.targetSets}`)}
        </button>

        {/* Up next queue */}
        <div style={{
          fontSize:10, letterSpacing:'.16em', textTransform:'uppercase',
          color:t.text3, marginBottom:8, padding:'0 4px'
        }}>
          Up next
        </div>
        {queue.slice(exIdx + 1, exIdx + 4).map((e, i) => (
          <div key={e.id} onClick={() => jumpToExercise(exIdx + 1 + i)} style={{
            display:'flex', alignItems:'center', gap:10, padding:'10px 14px',
            background:t.surface, border:`1px solid ${t.border}`, borderRadius:13,
            marginBottom:6, cursor:'pointer'
          }}>
            <ExerciseImage exerciseId={e.id} size={34} radius={8} theme={theme}/>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:12.5, color:t.text }}>{e.name}</div>
              <div style={{ fontSize:10, color:t.text3 }}>{e.muscle} · {e.targetSets} sets</div>
            </div>
            <div style={{ fontFamily:t.mono, fontSize:11, color:t.text2 }}>
              {e.targetWeight}kg × {e.targetReps}
            </div>
          </div>
        ))}
      </div>

      <BottomNav theme={theme} active="gym" onNav={onNav} tracksCycle={tracksCycle}/>

      {/* End-session confirm sheet */}
      {showEndConfirm && (
        <div style={{
          position:'absolute', inset:0, background:'rgba(0,0,0,.45)',
          display:'flex', alignItems:'flex-end', justifyContent:'center', zIndex:50,
          animation: 'om-fade 200ms ease-out'
        }} onClick={() => setShowEndConfirm(false)}>
          <div onClick={(e) => e.stopPropagation()} style={{
            width:'100%', background:t.surface, borderTopLeftRadius:22, borderTopRightRadius:22,
            padding:'18px 20px 22px',
            boxShadow:'0 -10px 40px rgba(0,0,0,.18)'
          }}>
            <div style={{
              width:38, height:4, background:t.border, borderRadius:99, margin:'0 auto 14px'
            }}/>
            <div style={{ fontFamily:t.serif, fontSize:22, color:t.text, marginBottom:6 }}>
              End workout early?
            </div>
            <div style={{ fontSize:12, color:t.text2, marginBottom:16, lineHeight:1.5 }}>
              You've logged <strong style={{ color:t.text }}>{totalDone} of {totalSets} sets</strong> ({fmt(elapsed)} elapsed). Your progress will be saved.
            </div>
            <div style={{ display:'flex', gap:8 }}>
              <button onClick={() => setShowEndConfirm(false)} style={{
                flex:1, padding:'12px', borderRadius:11, background:'transparent',
                border:`1px solid ${t.border2}`, color:t.text,
                fontFamily:t.sans, fontSize:13, fontWeight:500, cursor:'pointer'
              }}>Keep going</button>
              <button onClick={finishSession} style={{
                flex:1, padding:'12px', borderRadius:11,
                background:'#BE3B2E', color:'#fff',
                border:'none', fontFamily:t.sans, fontSize:13, fontWeight:600, cursor:'pointer'
              }}>End & save</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// Inline numeric stepper for set logging
function NumberInput({ value, onChange, step = 1, prefix = '', suffix = '', theme = 'light' }) {
  const t = themes[theme];
  return (
    <div style={{
      display:'inline-flex', alignItems:'center',
      background:t.bg, border:`1px solid ${t.border2}`, borderRadius:8,
      overflow:'hidden'
    }}>
      <button onClick={() => onChange(Number((value - step).toFixed(2)))} style={{
        width:24, height:28, background:'transparent', border:'none',
        color:t.text2, fontSize:14, cursor:'pointer', fontFamily:t.sans
      }}>−</button>
      <span style={{
        minWidth:42, textAlign:'center', fontFamily:t.mono, fontSize:13,
        color:t.text, fontVariantNumeric:'tabular-nums'
      }}>
        {prefix}{value}<span style={{ fontSize:9, color:t.text3 }}>{suffix}</span>
      </span>
      <button onClick={() => onChange(Number((value + step).toFixed(2)))} style={{
        width:24, height:28, background:'transparent', border:'none',
        color:t.text2, fontSize:14, cursor:'pointer', fontFamily:t.sans
      }}>+</button>
    </div>
  );
}

// Post-session summary screen
function GymSummaryScreen({ width = 390, height = 820, theme = 'light', session, onDone, onNav, tracksCycle = true }) {
  const t = themes[theme];
  const fmt = (s) => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  const queue = session?.queue || [];
  const elapsed = session?.elapsed || 0;
  const workout = session?.workout || 'Push day';

  // compute stats
  const exercisesDone = queue.filter(e => (e.sets||[]).some(s => s.done));
  const setsDone = queue.reduce((n,e) => n + (e.sets||[]).filter(s=>s.done).length, 0);
  const totalSets = queue.reduce((n,e) => n + e.targetSets, 0);
  const totalVolume = queue.reduce((sum, e) => {
    return sum + (e.sets||[])
      .filter(s => s.done)
      .reduce((v, s) => v + ((s.w || 0) * (s.r || 0)), 0);
  }, 0);
  const prHits = queue.filter(e => e.isPR && (e.sets||[]).some(s => s.done)).length;
  const completionPct = totalSets ? Math.round((setsDone/totalSets) * 100) : 0;

  return (
    <div style={{
      width, height, background:t.bg, fontFamily:t.sans, color:t.text,
      display:'flex', flexDirection:'column', overflow:'hidden', position:'relative'
    }}>
      <div style={{
        height:44, display:'flex', alignItems:'flex-end', justifyContent:'space-between',
        padding:'0 22px 8px', fontSize:14, fontWeight:600
      }}>
        <span>9:41</span>
        <div style={{ display:'flex', gap:5, alignItems:'center', fontSize:11 }}>
          <span>●●●</span><span>📶</span><span>🔋</span>
        </div>
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'14px 20px 16px' }} className="phone-scroll">

        {/* Celebrate header */}
        <div style={{ textAlign:'center', padding:'14px 0 22px' }}>
          <div style={{
            width:56, height:56, borderRadius:'50%',
            background:`linear-gradient(135deg, ${t.green}, ${t.accent})`,
            display:'flex', alignItems:'center', justifyContent:'center',
            margin:'0 auto 12px', fontSize:26, color:'#fff',
            boxShadow: `0 8px 24px ${t.accent}30`
          }}>✓</div>
          <div style={{
            fontSize:10.5, letterSpacing:'.18em', textTransform:'uppercase',
            color:t.text3, marginBottom:4, fontWeight:500
          }}>
            {completionPct >= 100 ? 'Workout complete' : 'Workout saved'}
          </div>
          <div style={{ fontFamily:t.serif, fontSize:30, color:t.text, lineHeight:1.1, marginBottom:5 }}>
            {workout}
          </div>
          <div style={{ fontSize:12, color:t.text2 }}>
            {completionPct >= 100
              ? `All ${totalSets} sets logged. Strong work.`
              : `${setsDone} of ${totalSets} sets logged`}
          </div>
        </div>

        {/* Big stats */}
        <div style={{
          display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:8, marginBottom:14
        }}>
          {[
            { label: 'Duration',    value: fmt(elapsed),                   sub: 'time on bar',     color: t.text  },
            { label: 'Volume',      value: totalVolume.toLocaleString(),    sub: 'kg lifted',       color: t.accent },
            { label: 'Sets logged', value: `${setsDone}/${totalSets}`,      sub: `${completionPct}% complete`, color: t.green },
            { label: 'PRs hit',     value: prHits.toString(),               sub: prHits ? '★ new best' : 'next session', color: prHits ? '#B45309' : t.text3 },
          ].map((s,i) => (
            <div key={i} style={{
              background:t.surface, border:`1px solid ${t.border}`, borderRadius:14,
              padding:'12px 14px'
            }}>
              <div style={{
                fontSize:9.5, letterSpacing:'.12em', color:t.text3,
                textTransform:'uppercase', marginBottom:4
              }}>{s.label}</div>
              <div style={{
                fontFamily:t.serif, fontSize:24, color:s.color, lineHeight:1,
                fontVariantNumeric:'tabular-nums'
              }}>{s.value}</div>
              <div style={{ fontSize:10, color:t.text3, marginTop:3 }}>{s.sub}</div>
            </div>
          ))}
        </div>

        {/* Exercise breakdown */}
        <div style={{
          background:t.surface, border:`1px solid ${t.border}`, borderRadius:18,
          marginBottom:14, overflow:'hidden'
        }}>
          <div style={{
            padding:'12px 16px 8px',
            fontSize:10, letterSpacing:'.16em', textTransform:'uppercase',
            color:t.text3, borderBottom:`1px solid ${t.border}`
          }}>
            Exercises
          </div>
          {queue.map((e, i) => {
            const doneSets = (e.sets||[]).filter(s => s.done);
            const best = doneSets.reduce((b, s) => {
              if (!b) return s;
              if ((s.w || 0) > (b.w || 0)) return s;
              if ((s.w || 0) === (b.w || 0) && (s.r || 0) > (b.r || 0)) return s;
              return b;
            }, null);
            const isDone = doneSets.length > 0;
            return (
              <div key={e.id} style={{
                display:'flex', alignItems:'center', gap:10,
                padding:'10px 16px',
                borderBottom: i < queue.length - 1 ? `1px solid ${t.border}` : 'none',
                opacity: isDone ? 1 : 0.45
              }}>
                <div style={{
                  width:20, height:20, borderRadius:'50%',
                  background: isDone ? t.green+'25' : t.surface2,
                  color: isDone ? t.green : t.text3,
                  display:'flex', alignItems:'center', justifyContent:'center',
                  fontSize:11, flexShrink:0
                }}>
                  {isDone ? '✓' : i+1}
                </div>
                <div style={{ flex:1 }}>
                  <div style={{
                    fontSize:13, color:t.text, display:'flex', alignItems:'center', gap:6
                  }}>
                    {e.name}
                    {e.isPR && isDone && (
                      <span style={{
                        fontSize:9, color:t.accent, fontWeight:600, letterSpacing:'.04em'
                      }}>★ PR</span>
                    )}
                  </div>
                  <div style={{ fontSize:10.5, color:t.text3 }}>
                    {isDone
                      ? `${doneSets.length} sets · best ${best?.w}kg × ${best?.r}`
                      : `${e.targetSets} sets planned — skipped`}
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        {/* Notes */}
        <div style={{
          background:t.surface, border:`1px solid ${t.border}`, borderRadius:14,
          padding:'12px 14px', marginBottom:14
        }}>
          <div style={{
            fontSize:10, letterSpacing:'.16em', textTransform:'uppercase',
            color:t.text3, marginBottom:6
          }}>
            Session notes
          </div>
          <textarea placeholder="How did it feel? Any tweaks for next time?"
            style={{
              width:'100%', minHeight:64, border:'none', resize:'vertical',
              fontFamily:t.sans, fontSize:12.5, color:t.text,
              background:'transparent', outline:'none',
              lineHeight:1.5
            }}/>
        </div>

        <button onClick={onDone} style={{
          width:'100%', padding:'14px', borderRadius:13,
          background: t.accent, color: t.accentText,
          border:'none', fontFamily:t.sans, fontSize:14, fontWeight:600,
          cursor:'pointer'
        }}>
          Save & back to home
        </button>
      </div>

      <BottomNav theme={theme} active="gym" onNav={onNav} tracksCycle={tracksCycle}/>
    </div>
  );
}

window.GymSummaryScreen = GymSummaryScreen;

window.GymSessionScreen = GymSessionScreen;
window.PlaceholderScreen = PlaceholderScreen;

</script>

};
const SECTION_ORDER = ['compound','accessory','core','mobility'];
const WEEK_DAYS = ['M','T','W','T','F','S','S'];
