// ────────────────────────────────────────────────────────────
// Gym Hub — the Gym tab landing page
function GymHubScreen({ width = 390, height = 820, theme = 'light',
                       plan, todayIdx = 0, dayOfWeek = 1, activeSession,
                       activities = {}, completedSessions = [],
                       onNav, onStartSession, onResumeSession,
                       onChangeSplit, onEditDay, onSelectDay, onTapDay,
                       onBrowseLibrary, onViewSummary, onDeleteSession,
                       onReorderSchedule,
                       tracksCycle = true }) {
  const t = themes[theme];
  const split = SPLITS[plan.splitDays];
  const totalDays = split.days.length;
  const today = split.days[todayIdx % totalDays];
  const todayExercises = SECTION_ORDER.flatMap(sec => (today[sec] || []).map(id => ({ id, sec })));
  const [draggingSlot, setDraggingSlot] = React.useState(null);

  // Use plan.scheduleOverride if present, else use split.schedule
  const schedule = plan.scheduleOverride || split.schedule;

  return (
    <div style={{
      width, height, background:t.bg, fontFamily:t.sans, color:t.text,
      display:'flex', flexDirection:'column', overflow:'hidden', position:'relative'
    }}>
      {/* Status bar */}
      <div style={{
        height:44, display:'flex', alignItems:'flex-end', justifyContent:'space-between',
        padding:'0 22px 8px', fontSize:14, fontWeight:600
      }}>
        <span>9:41</span>
        <div style={{ display:'flex', gap:5, alignItems:'center', fontSize:11 }}>
          <span>●●●</span><span>📶</span><span>🔋</span>
        </div>
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'8px 20px 16px' }} className="phone-scroll">

        {/* Top header */}
        <div style={{ marginBottom:14 }}>
          <div style={{
            fontSize:9.5, letterSpacing:'.18em', textTransform:'uppercase',
            color:t.text3, marginBottom:3
          }}>
            Your plan
          </div>
          <div style={{ fontFamily:t.serif, fontSize:28, lineHeight:1, color:t.text }}>
            {split.name}
          </div>
        </div>

        {/* Split summary card */}
        <div style={{
          background:t.surface, border:`1px solid ${t.border}`, borderRadius:18,
          padding:'14px 16px', marginBottom:14
        }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
            <div style={{
              fontSize:10, letterSpacing:'.16em', textTransform:'uppercase',
              color:t.text3
            }}>
              This week · {split.sub}
            </div>
            <button onClick={onChangeSplit} style={{
              padding:'3px 8px', borderRadius:7,
              background:'transparent', border:`1px solid ${t.border}`,
              color:t.accent, fontSize:11, fontWeight:500, cursor:'pointer',
              fontFamily:t.sans
            }}>Change ›</button>
          </div>

          {/* Weekly grid */}
          <div style={{
            display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:5
          }}>
            {WEEK_DAYS.map((dayLetter, i) => {
              const slot = schedule[i];
              const isToday = i === dayOfWeek;
              const isRest = slot === '—';
              const dayInfo = !isRest ? split.days.find(d => d.id === slot) : null;
              const dayActs = activities[i] || [];
              // Compute this day's date for the current week (Mon = 0)
              const now = new Date();
              const mondayOffset = now.getDay() === 0 ? -6 : 1 - now.getDay();
              const dayDate = new Date(now);
              dayDate.setDate(now.getDate() + mondayOffset + i);
              dayDate.setHours(0,0,0,0);
              const dayDateEnd = new Date(dayDate); dayDateEnd.setHours(23,59,59,999);
              const hasCompleted = completedSessions.some(s => {
                const sd = new Date(s.date);
                return sd >= dayDate && sd <= dayDateEnd;
              });
              const isDragging = draggingSlot === i;
              return (
                <div key={i}
                  onClick={(e) => { e.stopPropagation(); onTapDay && onTapDay(i); }}
                  draggable={!isRest}
                  onDragStart={(e) => { e.dataTransfer.effectAllowed = 'move'; setDraggingSlot(i); }}
                  onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }}
                  onDrop={(e) => {
                    e.preventDefault();
                    if (draggingSlot === null || draggingSlot === i) { setDraggingSlot(null); return; }
                    if (onReorderSchedule) {
                      const newSched = [...schedule];
                      [newSched[draggingSlot], newSched[i]] = [newSched[i], newSched[draggingSlot]];
                      onReorderSchedule(newSched);
                    }
                    setDraggingSlot(null);
                  }}
                  onDragEnd={() => setDraggingSlot(null)}
                  style={{
                    display:'flex', flexDirection:'column', alignItems:'center', gap:4,
                    cursor: isRest ? 'pointer' : 'grab', padding:'2px 0',
                    opacity: isDragging ? 0.4 : 1
                  }}>
                  <div style={{
                    fontSize:9.5, color: isToday ? t.accent : t.text3, fontWeight:500
                  }}>
                    {dayLetter}
                  </div>
                  <div style={{
                    position:'relative',
                    width:32, height:32, borderRadius:8,
                    background: hasCompleted
                      ? '#0090FF'
                      : isRest
                        ? t.surface2
                        : (isToday ? t.accent : (t.accent + '20')),
                    border: hasCompleted
                      ? '1.5px solid #0070CC'
                      : isToday ? `1.5px solid ${t.accent}` : `1px solid ${t.border}`,
                    color: hasCompleted
                      ? '#fff'
                      : isToday ? t.accentText : (isRest ? t.text3 : t.accent),
                    display:'flex', alignItems:'center', justifyContent:'center',
                    fontSize:11, fontWeight:600, fontFamily:t.mono,
                    transition:'background .2s'
                  }}>
                    {hasCompleted ? '✓' : isRest ? (dayActs.length ? '+' : '·') : dayInfo.name.charAt(0)}
                    {/* Activity dot indicator */}
                    {dayActs.length > 0 && !hasCompleted && (
                      <span style={{
                        position:'absolute', top:-3, right:-3,
                        width:10, height:10, borderRadius:'50%',
                        background: '#0090FF', border:`2px solid ${t.surface}`,
                        fontSize:7, color:'#fff', display:'flex',
                        alignItems:'center', justifyContent:'center', lineHeight:1
                      }}>{dayActs.length}</span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{
            marginTop:9, padding:'7px 10px', borderRadius:8,
            background: t.surface2, border:`1px dashed ${t.border2}`,
            fontSize:10, color:t.text3, textAlign:'center', letterSpacing:'.02em'
          }}>
            Tap any day to log a run, swim, yoga or other activity
          </div>
        </div>

        {/* Today's session — large card */}
        <div style={{
          background:t.surface, border:`1.5px solid ${t.accent}50`, borderRadius:20,
          padding:'16px 18px 14px', marginBottom:14,
          boxShadow: theme==='dark' ? `0 0 20px ${t.accent}15` : `0 4px 14px ${t.accent}10`,
        }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:14 }}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{
                fontSize:10, letterSpacing:'.16em', textTransform:'uppercase',
                color:t.accent, marginBottom:3, fontWeight:600
              }}>
                Today · {todayExercises.length} exercises
              </div>
              <div style={{ fontFamily:t.serif, fontSize:26, lineHeight:1.05, color:t.text }}>
                {today.name} day
              </div>
              <div style={{ fontSize:11.5, color:t.text2, marginTop:3 }}>
                {today.muscles}
              </div>
            </div>
            <button onClick={() => onEditDay(today.id)} style={{
              padding:'6px 10px', borderRadius:8,
              background:'transparent', border:`1px solid ${t.border2}`,
              color:t.text2, fontSize:10.5, cursor:'pointer', fontFamily:t.sans,
              display:'flex', alignItems:'center', gap:4
            }}>
              ✎ Edit
            </button>
          </div>

          {/* Sections preview */}
          <div style={{ marginBottom:12 }}>
            {SECTION_ORDER.map(sec => {
              const exs = today[sec] || [];
              if (!exs.length) return null;
              const meta = SECTION_META[sec];
              return (
                <div key={sec} style={{
                  display:'flex', alignItems:'baseline', gap:8, padding:'7px 0',
                  borderTop:`1px solid ${t.border}`
                }}>
                  <div style={{
                    fontSize:9, letterSpacing:'.16em', color:meta.color,
                    textTransform:'uppercase', fontWeight:600,
                    minWidth:64
                  }}>
                    {meta.label}
                  </div>
                  <div style={{ flex:1, fontSize:11.5, color:t.text2, lineHeight:1.45 }}>
                    {exs.map(id => EX_LIB[id]?.name || id).join(' · ')}
                  </div>
                </div>
              );
            })}
          </div>

          {(() => {
            const todayCompleted = completedSessions.find(s => {
              const sd = new Date(s.date);
              const today = new Date();
              return sd.toDateString() === today.toDateString();
            });
            if (todayCompleted) {
              return (
                <div style={{ display:'flex', gap:7 }}>
                  <button onClick={() => onViewSummary && onViewSummary(todayCompleted)} style={{
                    flex:1, padding:'12px', borderRadius:11,
                    background:t.green+'18', color:t.green,
                    border:`1.5px solid ${t.green}40`,
                    fontFamily:t.sans, fontSize:13, fontWeight:600, cursor:'pointer'
                  }}>
                    ✓ Session complete — view summary
                  </button>
                  <button onClick={() => onDeleteSession && onDeleteSession(todayCompleted.id)} style={{
                    width:44, height:44, borderRadius:11, background:'transparent',
                    border:`1px solid ${t.border}`, color:'#BE3B2E',
                    cursor:'pointer', fontSize:13, fontFamily:t.sans,
                    display:'flex', alignItems:'center', justifyContent:'center'
                  }}>×</button>
                </div>
              );
            }
            if (activeSession) {
              return (
                <button onClick={onResumeSession} style={{
                  width:'100%', padding:'12px', borderRadius:11,
                  background:t.accent, color:t.accentText,
                  border:'none', fontFamily:t.sans, fontSize:13, fontWeight:600, cursor:'pointer',
                  display:'flex', alignItems:'center', justifyContent:'center', gap:6
                }}>Resume session →</button>
              );
            }
            return (
              <button onClick={onStartSession} style={{
                width:'100%', padding:'12px', borderRadius:11,
                background:t.accent, color:t.accentText,
                border:'none', fontFamily:t.sans, fontSize:13, fontWeight:600, cursor:'pointer',
                display:'flex', alignItems:'center', justifyContent:'center', gap:6
              }}>Start session →</button>
            );
          })()}
        </div>

// Session Editor — edit one day's exercises grouped by section
function SessionEditorScreen({ width = 390, height = 820, theme = 'light',
                              plan, dayId, onBack, onSave, onNav, tracksCycle = true }) {
  const t = themes[theme];
  const split = SPLITS[plan.splitDays];
  if (!dayId || !split) return null;
  const originalDay = (plan.overrides && plan.overrides[dayId]) || split.days.find(d => d.id === dayId) || split.days[0];

  // Local working copy
  const [day, setDay] = React.useState(originalDay);
  const [addingTo, setAddingTo] = React.useState(null);    // section being added to
  const [searchQ, setSearchQ] = React.useState('');

  const totalEx = SECTION_ORDER.reduce((n, sec) => n + (day[sec]||[]).length, 0);

  const moveItem = (sec, i, dir) => {
    const list = (day[sec] || []).slice();
    const j = i + dir;
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    setDay({ ...day, [sec]: list });
  };
  const removeItem = (sec, i) => {
    const list = (day[sec] || []).slice();
    list.splice(i, 1);
    setDay({ ...day, [sec]: list });
  };
  const addItem = (sec, id) => {
    const list = (day[sec] || []).slice();
    if (!list.includes(id)) list.push(id);
    setDay({ ...day, [sec]: list });
    setAddingTo(null);
    setSearchQ('');
  };

  // Pool of exercises available for the section currently being added to
  const availableForAdd = React.useMemo(() => {
    if (!addingTo) return [];
    const used = new Set(SECTION_ORDER.flatMap(s => day[s] || []));
    const q = searchQ.toLowerCase();
    return Object.entries(EX_LIB)
      .filter(([id, ex]) => {
        if (used.has(id)) return false;
        // Show same-type first, but allow cross-type adding
        const matchesType = ex.type === addingTo;
        const matchesQ = !q || ex.name.toLowerCase().includes(q) || ex.muscle.toLowerCase().includes(q);
        return matchesType && matchesQ;
      })
      .map(([id, ex]) => ({ id, ...ex }));
  }, [addingTo, searchQ, day]);

  return (
    <div style={{
      width, height, background:t.bg, fontFamily:t.sans, color:t.text,
      display:'flex', flexDirection:'column', overflow:'hidden', position:'relative'
    }}>
      <div style={{
        height:44, display:'flex', alignItems:'flex-end', justifyContent:'space-between',
        padding:'0 22px 8px', fontSize:14, fontWeight:600
      }}>
        <span>9:41</span>
        <div style={{ display:'flex', gap:5, alignItems:'center', fontSize:11 }}>
          <span>●●●</span><span>📶</span><span>🔋</span>
        </div>
      </div>

      <ScreenHeader theme={theme} title={`${day.name} day`} sub="Edit session"
        onBack={onBack}
        right={
          <button onClick={() => onSave({ ...day })} style={{
            padding:'6px 12px', borderRadius:8, background:t.accent, color:t.accentText,
            border:'none', fontFamily:t.sans, fontSize:11, fontWeight:600, cursor:'pointer'
          }}>Save</button>
        }
      />

      <div style={{ flex:1, overflowY:'auto', padding:'14px 18px 16px' }} className="phone-scroll">

        <div style={{
          fontSize:11, color:t.text2, marginBottom:14, lineHeight:1.5
        }}>
          {totalEx} exercises across {SECTION_ORDER.filter(s => (day[s]||[]).length).length} sections.
          Reorder, swap, or add anything missing.
        </div>

        {SECTION_ORDER.map(sec => {
          const list = day[sec] || [];
          const meta = SECTION_META[sec];
          return (
            <div key={sec} style={{
              background:t.surface, border:`1px solid ${t.border}`, borderRadius:16,
              padding:'12px 14px 10px', marginBottom:11
            }}>
              <div style={{
                display:'flex', alignItems:'baseline', justifyContent:'space-between',
                marginBottom:8
              }}>
                <div>
                  <div style={{
                    fontSize:10, letterSpacing:'.16em', color:meta.color,
                    textTransform:'uppercase', fontWeight:600
                  }}>
                    {meta.label}
                  </div>
                  <div style={{ fontSize:10, color:t.text3, marginTop:2 }}>{meta.hint}</div>
                </div>
                <span style={{ fontSize:10.5, color:t.text3 }}>{list.length}</span>
              </div>

              {list.map((id, i) => {
                const ex = EX_LIB[id];
                if (!ex) return null;
                return (
                  <div key={id} style={{
                    display:'flex', alignItems:'center', gap:8, padding:'8px 0',
                    borderTop: i>0 ? `1px solid ${t.border}` : 'none'
                  }}>
                    <ExerciseImage exerciseId={id} size={36} radius={8} theme={theme}/>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:12.5, color:t.text }}>{ex.name}</div>
                      <div style={{ fontSize:10, color:t.text3 }}>{ex.muscle}</div>
                    </div>
                    {/* Reorder buttons */}
                    <button onClick={() => moveItem(sec, i, -1)} disabled={i===0} style={{
                      width:22, height:22, borderRadius:5,
                      border:`1px solid ${t.border}`, background:'transparent',
                      color: i===0 ? t.text3 : t.text2, cursor: i===0 ? 'default' : 'pointer',
                      fontSize:10, fontFamily:t.sans, opacity: i===0 ? .4 : 1
                    }}>↑</button>
                    <button onClick={() => moveItem(sec, i, 1)} disabled={i===list.length-1} style={{
                      width:22, height:22, borderRadius:5,
                      border:`1px solid ${t.border}`, background:'transparent',
                      color: i===list.length-1 ? t.text3 : t.text2,
                      cursor: i===list.length-1 ? 'default' : 'pointer',
                      fontSize:10, fontFamily:t.sans, opacity: i===list.length-1 ? .4 : 1
                    }}>↓</button>
                    <button onClick={() => removeItem(sec, i)} style={{
                      width:22, height:22, borderRadius:5,
                      border:`1px solid ${t.border}`, background:'transparent',
                      color: '#BE3B2E', cursor:'pointer', fontSize:13, fontFamily:t.sans
                    }}>×</button>
                  </div>
                );
              })}

              {/* Add button per section */}
              <button onClick={() => setAddingTo(sec)} style={{
                width:'100%', padding:'7px 8px',
                marginTop: list.length ? 8 : 0,
                borderRadius:9, background:'transparent',
                border:`1.5px dashed ${t.border2}`,
                color:t.text3, fontSize:11, cursor:'pointer', fontFamily:t.sans
              }}>
                + Add {meta.label.toLowerCase()}
              </button>
            </div>
          );
        })}
      </div>

      <BottomNav theme={theme} active="gym" onNav={onNav} tracksCycle={tracksCycle}/>

      {/* Add-exercise bottom sheet */}
      {addingTo && (
        <div style={{
          position:'absolute', inset:0, background:'rgba(0,0,0,.4)',
          display:'flex', alignItems:'flex-end', zIndex:50
        }} onClick={() => { setAddingTo(null); setSearchQ(''); }}>
          <div onClick={(e) => e.stopPropagation()} style={{
            width:'100%', background:t.surface,
            borderTopLeftRadius:22, borderTopRightRadius:22,
            padding:'18px 20px 18px', maxHeight:'72%',
            display:'flex', flexDirection:'column'
          }}>
            <div style={{
              width:38, height:4, background:t.border, borderRadius:99, margin:'0 auto 14px'
            }}/>
            <div style={{ fontFamily:t.serif, fontSize:20, color:t.text, marginBottom:4 }}>
              Add {SECTION_META[addingTo].label.toLowerCase()}
            </div>
            <div style={{ fontSize:11, color:t.text3, marginBottom:12 }}>
              {SECTION_META[addingTo].hint}
            </div>
            <input
              autoFocus
              value={searchQ}
              onChange={(e) => setSearchQ(e.target.value)}
              placeholder={`Search ${SECTION_META[addingTo].label.toLowerCase()}…`}
              style={{
                width:'100%', padding:'9px 12px', borderRadius:9,
                border:`1px solid ${t.border}`, background:t.surface2,
                fontFamily:t.sans, fontSize:12.5, color:t.text, outline:'none',
                marginBottom:10
              }}/>
            <div style={{
              overflowY:'auto', flex:1, paddingRight:2,
              maxHeight: 280
            }}>
              {availableForAdd.length ? availableForAdd.map(ex => (
                <button key={ex.id} onClick={() => addItem(addingTo, ex.id)} style={{
                  display:'flex', justifyContent:'space-between', alignItems:'center',
                  width:'100%', padding:'10px 12px', borderRadius:10,
                  background:t.surface2, border:`1px solid ${t.border}`,
                  marginBottom:5, cursor:'pointer', textAlign:'left',
                  fontFamily:t.sans
                }}>
                  <div>
                    <div style={{ fontSize:13, color:t.text }}>{ex.name}</div>
                    <div style={{ fontSize:10, color:t.text3 }}>{ex.muscle}</div>
                  </div>
                  <span style={{ fontSize:18, color:t.accent }}>+</span>
                </button>
              )) : (
                <div style={{
                  textAlign:'center', padding:'30px 0', color:t.text3, fontSize:11.5
                }}>
                  No matches.
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// Day Activities Screen
// Shows all activities (gym + non-gym) logged for a given day of the week.
// New: allows adding a gym session, not just non-gym activities.
// If a gym session is added, recommends the best session type based on
// what else is already in the weekly plan.

const ACTIVITY_TYPES = [
  { id:'gym',   label:'Gym session', emoji:'🏋️', color:'#BE5A38', isGym: true  },
  { id:'run',   label:'Run',         emoji:'🏃', color:'#0090FF', isGym: false },
  { id:'walk',  label:'Walk',        emoji:'🚶', color:'#15803D', isGym: false },
  { id:'swim',  label:'Swim',        emoji:'🏊', color:'#0369A1', isGym: false },
  { id:'yoga',  label:'Yoga',        emoji:'🧘', color:'#6D4AAF', isGym: false },
  { id:'hike',  label:'Hike',        emoji:'⛰️', color:'#854D0E', isGym: false },
  { id:'cycle', label:'Cycle',       emoji:'🚴', color:'#9333EA', isGym: false },
  { id:'other', label:'Other',       emoji:'⚡', color:'#4B5563', isGym: false },
];

// Recommend what gym session to do based on what's already in the plan this week
function getGymRecommendation(plan, dayIdx) {
  const split = SPLITS[plan.splitDays];
  if (!split) return { name: 'Full body', muscles: 'Full body strength' };
  const scheduled = split.days;
  const muscles = scheduled.flatMap(d => (d.muscles || '').split(' · '));
  const hasChest    = muscles.some(m => m.includes('Chest'));
  const hasBack     = muscles.some(m => m.includes('Back') || m.includes('Lats'));
  const hasLegs     = muscles.some(m => m.includes('Leg') || m.includes('Quad') || m.includes('Glute'));
  const hasShoulders= muscles.some(m => m.includes('Shoulder'));
  if (hasChest && hasBack && hasLegs)
    return { name: 'Full body', muscles: 'Full body · Active recovery + mobility' };
  if (!hasLegs)
    return { name: 'Legs', muscles: 'Quads · Hamstrings · Glutes' };
  if (!hasBack)
    return { name: 'Pull', muscles: 'Back · Biceps · Rear delts' };
  if (!hasChest)
    return { name: 'Push', muscles: 'Chest · Shoulders · Triceps' };
  return { name: 'Full body', muscles: 'Full body strength' };
}

  const dayName = DAY_NAMES[dayIdx] || 'Day';
  const dayActivities = activities[dayIdx] || [];

  const [items, setItems] = React.useState([...dayActivities]);
  const [showAdd, setShowAdd] = React.useState(false);
  const [addType, setAddType] = React.useState(null);
  const [duration, setDuration] = React.useState('45');
  const [time, setTime] = React.useState('07:00');
  const [deleteModal, setDeleteModal] = React.useState(null); // item id being deleted

  // Check if this day has a planned gym session in the split
  const split = SPLITS[plan.splitDays];
  const scheduledSlot = split?.schedule[dayIdx];
  const scheduledDay = scheduledSlot && scheduledSlot !== '—'
    ? split.days.find(d => d.id === scheduledSlot) : null;

  const recommendation = getGymRecommendation(plan, dayIdx);

  const addActivity = () => {
    if (!addType) return;
    const typeInfo = ACTIVITY_TYPES.find(a => a.id === addType);
    const newItem = {
      id: Date.now().toString(),
      type: addType,
      label: typeInfo.label,
      emoji: typeInfo.emoji,
      duration: Number(duration) || 45,
      time,
      source: 'Manual',
      isGym: typeInfo.isGym,
    };
    const updated = [...items, newItem];
    setItems(updated);
    if (onSave) onSave(dayIdx, updated);
    setShowAdd(false);
    setAddType(null);
    setDuration('45');
  };

  const removeItem = (id) => {
    const updated = items.filter(i => i.id !== id);
    setItems(updated);
    if (onSave) onSave(dayIdx, updated);
    setDeleteModal(null);
  };

  const totalTime = items.reduce((s, i) => s + (i.duration || 0), 0);

  return (
    <div style={{
      width, height, background:t.bg, fontFamily:t.sans, color:t.text,
      display:'flex', flexDirection:'column', overflow:'hidden', position:'relative'
    }}>
      <div style={{
        height:44, display:'flex', alignItems:'flex-end', justifyContent:'space-between',
        padding:'0 22px 8px', fontSize:14, fontWeight:600
      }}>
        <span>9:41</span>
        <div style={{ display:'flex', gap:5, alignItems:'center', fontSize:11 }}>
          <span>●●●</span><span>📶</span><span>🔋</span>
        </div>
      </div>

      <ScreenHeader theme={theme} title={dayName} sub="Activities"
        onBack={onBack}
        right={
          <button onClick={() => setShowAdd(true)} style={{
            padding:'6px 12px', borderRadius:8, background:t.accent, color:t.accentText,
            border:'none', fontFamily:t.sans, fontSize:11, fontWeight:600, cursor:'pointer'
          }}>+ Add</button>
        }
      />

        {/* Scheduled gym session (from split plan) */}

          <div style={{
            background:t.surface, border:`1.5px solid ${t.accent}40`, borderRadius:16,
            padding:'12px 14px', marginBottom:12

            <div style={{ fontSize:9.5, letterSpacing:'.14em', textTransform:'uppercase', color:t.accent, marginBottom:4, fontWeight:600 }}>
              Planned from your split
            </div>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
              <div>
                <div style={{ fontFamily:t.serif, fontSize:18, color:t.text }}>{scheduledDay.name} day</div>
                <div style={{ fontSize:11, color:t.text2, marginTop:2 }}>{scheduledDay.muscles}</div>
              </div>
              <button onClick={() => onEditGym && onEditGym(scheduledDay.id)} style={{
                padding:'5px 10px', borderRadius:8, background:'transparent',
                border:`1px solid ${t.border}`, color:t.text2,
                fontSize:10.5, cursor:'pointer', fontFamily:t.sans
              }}>✎ Edit</button>
            </div>
          </div>
        )}

        {/* Activities list */}
        {items.length === 0 ? (
          <div style={{ textAlign:'center', padding:'32px 0', color:t.text3, fontSize:12 }}>

          </div>
        ) : (
          items.map((item, i) => {
            const typeInfo = ACTIVITY_TYPES.find(a => a.id === item.type);
            const color = typeInfo?.color || t.accent;
            return (
              <div key={item.id} style={{
                display:'flex', alignItems:'center', gap:11, padding:'11px 14px',
                background:t.surface, border:`1px solid ${t.border}`,

                  background:color+'18', color,
                  display:'flex', alignItems:'center', justifyContent:'center', fontSize:16
                }}>
                  {item.emoji}
                </div>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:13, color:t.text, fontWeight:500 }}>{item.label}</div>
                  <div style={{ fontSize:10.5, color:t.text3 }}>

                    {item.source !== 'Manual' && (
                      <span style={{ marginLeft:5, color:t.text3 }}>· {item.source}</span>
                    )}
                  </div>
                </div>
                <button onClick={() => setDeleteModal(item.id)} style={{
                  width:26, height:26, borderRadius:6, background:'transparent',

                  alignItems:'center', justifyContent:'center'

        {items.length > 0 && (
          <div style={{
            padding:'8px 14px', borderRadius:10,
            background:t.surface2, border:`1px solid ${t.border}`,
            fontSize:11, color:t.text2, marginTop:4
          }}>
            Total active time: <span style={{ fontWeight:500, color:t.text }}>{totalTime} min</span>
          </div>

      </div>

      {showAdd && (

          display:'flex', alignItems:'flex-end', zIndex:50
        }} onClick={() => { setShowAdd(false); setAddType(null); }}>
          <div onClick={(e) => e.stopPropagation()} style={{
            width:'100%', background:t.surface, borderTopLeftRadius:22, borderTopRightRadius:22,
            padding:'18px 20px 24px',
          }}>
            <div style={{ width:38, height:4, background:t.border, borderRadius:99, margin:'0 auto 14px' }}/>
            <div style={{ fontFamily:t.serif, fontSize:20, color:t.text, marginBottom:4 }}>Log activity</div>

            {/* Type picker */}
            <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:7, marginBottom:14 }}>
              {ACTIVITY_TYPES.map(a => {
                const isActive = addType === a.id;
                return (
                  <button key={a.id} onClick={() => setAddType(a.id)} style={{
                    padding:'10px 4px 8px', borderRadius:11,
                    background: isActive ? a.color+'18' : t.surface2,
                    border:`1.5px solid ${isActive ? a.color : t.border}`,
                    cursor:'pointer', fontFamily:t.sans,
                    display:'flex', flexDirection:'column', alignItems:'center', gap:4
                  }}>
                    <span style={{ fontSize:20 }}>{a.emoji}</span>
                    <span style={{ fontSize:10, color: isActive ? a.color : t.text2, fontWeight: isActive ? 600 : 400 }}>
                      {a.label.split(' ')[0]}
                    </span>
                  </button>
                );
              })}
            </div>

            {/* Gym recommendation callout */}
            {addType === 'gym' && (
              <div style={{
                padding:'10px 12px', borderRadius:10, marginBottom:12,
                background:t.accent+'12', border:`1px solid ${t.accent}30`
              }}>
                <div style={{ fontSize:10.5, color:t.accent, fontWeight:600, marginBottom:2 }}>
                  Suggested session
                </div>
                <div style={{ fontSize:13, color:t.text }}>{recommendation.name}</div>
                <div style={{ fontSize:10.5, color:t.text2 }}>{recommendation.muscles}</div>
              </div>
            )}

            {/* Duration + time */}
            <div style={{ display:'flex', gap:8, marginBottom:14 }}>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:10, color:t.text3, marginBottom:4 }}>Duration (min)</div>
                <input
                  value={duration}
                  type="number"
                  onChange={(e) => setDuration(e.target.value)}
                  style={{
                    width:'100%', padding:'9px 12px', borderRadius:9,
                    border:`1px solid ${t.border}`, background:t.surface2,
                    fontFamily:t.mono, fontSize:13, color:t.text, outline:'none'
                  }}
                />
              </div>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:10, color:t.text3, marginBottom:4 }}>Time</div>
                <input
                  value={time}
                  type="time"
                  onChange={(e) => setTime(e.target.value)}
                  style={{
                    width:'100%', padding:'9px 12px', borderRadius:9,
                    border:`1px solid ${t.border}`, background:t.surface2,
                    fontFamily:t.sans, fontSize:13, color:t.text, outline:'none'
                  }}
                />
              </div>
            </div>

            <button
              onClick={addActivity}
              disabled={!addType}
              style={{
                width:'100%', padding:'13px', borderRadius:12,
                background: addType ? t.accent : t.surface2,
                color: addType ? t.accentText : t.text3,
                border:'none', fontFamily:t.sans, fontSize:13, fontWeight:600, cursor: addType ? 'pointer' : 'default'
              }}>
              Log activity
            </button>
          </div>
        </div>
      )}

      {/* Delete confirm modal */}
      {deleteModal && (
        <div style={{
          position:'absolute', inset:0, background:'rgba(0,0,0,.4)',
          display:'flex', alignItems:'flex-end', zIndex:60
        }} onClick={() => setDeleteModal(null)}>
          <div onClick={(e) => e.stopPropagation()} style={{
            width:'100%', background:t.surface, borderTopLeftRadius:22, borderTopRightRadius:22,
            padding:'18px 20px 24px'
          }}>
            <div style={{ width:38, height:4, background:t.border, borderRadius:99, margin:'0 auto 14px' }}/>
            <div style={{ fontFamily:t.serif, fontSize:20, color:t.text, marginBottom:6 }}>Remove activity?</div>
            <div style={{ fontSize:12, color:t.text2, marginBottom:16, lineHeight:1.5 }}>
              This activity will be removed from {dayName}.
            </div>
            <div style={{ display:'flex', gap:8 }}>
              <button onClick={() => setDeleteModal(null)} style={{
                flex:1, padding:'12px', borderRadius:11, background:'transparent',
                border:`1px solid ${t.border2}`, color:t.text,
                fontFamily:t.sans, fontSize:13, cursor:'pointer'
              }}>Cancel</button>
              <button onClick={() => removeItem(deleteModal)} style={{
                flex:1, padding:'12px', borderRadius:11, background:'#BE3B2E', color:'#fff',
                border:'none', fontFamily:t.sans, fontSize:13, fontWeight:600, cursor:'pointer'
              }}>Remove</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


Object.assign(window, {
  GymHubScreen, SplitPickerScreen, SessionEditorScreen,
  DayActivitiesScreen,
  SPLITS, EX_LIB, SECTION_META, SECTION_ORDER
});


</script>

<script type="text/babel" data-presets="react">
// Exercise placeholder images + Exercise Library + Day Activities screen
// ────────────────────────────────────────────────────────────

// Type → color pair used for exercise placeholder cards.
const EX_TYPE_COLORS = {
  compound:  ['#C2410C', '#7C2D12'],   // warm rust
  accessory: ['#B45309', '#78350F'],   // amber-brown
  core:      ['#6D28D9', '#3B1B7A'],   // violet
  mobility:  ['#15803D', '#064E2C'],   // moss
  cardio:    ['#1D4ED8', '#1E2A78'],   // deep blue
};

// Reusable exercise placeholder image.
// Real product: stock photo / looping demo GIF.
// Here: striped colored card with serif initial + DEMO tag,
// which makes the placeholder honest (per design-system guidance).
function ExerciseImage({ exerciseId, size = 56, radius, label = false, theme = 'light' }) {
  const ex = (window.EX_LIB || {})[exerciseId];
  if (!ex) {
    return (
      <div style={{
        width:size, height:size, borderRadius: radius ?? size * 0.18,
        background:'#E5E5E5', display:'flex', alignItems:'center', justifyContent:'center',
        color:'#999', fontSize:10
      }}>?</div>
    );
  }

  // Type sets base palette family; hash of exercise id picks the specific variant.
  // This gives each exercise a distinct card while keeping muscle/type families coherent.
  const palettesByType = {
    compound:  [['#C2410C','#7C2D12'], ['#9A3412','#451A03'], ['#B91C1C','#7F1D1D'], ['#9A2B0C','#5C1A0B'], ['#A82C0E','#481E07']],
    accessory: [['#B45309','#78350F'], ['#92400E','#451A03'], ['#A16207','#713F12'], ['#854D0E','#3F2106'], ['#9F580A','#5A2E03']],
    core:      [['#6D28D9','#3B1B7A'], ['#4F46E5','#1E1B6B'], ['#7C3AED','#3B0E73'], ['#5B21B6','#1F0C5D'], ['#6E2BB0','#371356']],
    mobility:  [['#15803D','#064E2C'], ['#047857','#053929'], ['#0E7C66','#053F33'], ['#1F7A2E','#0A3E18'], ['#0F766E','#053C39']],
    cardio:    [['#1D4ED8','#1E2A78'], ['#1E40AF','#16224E'], ['#0369A1','#06324A'], ['#075985','#04263C'], ['#0E7490','#08394A']],
  };
  const palette = palettesByType[ex.type] || [['#6B6560','#3F3934']];
  // Tiny deterministic hash so the same exercise always picks the same swatch
  const h = String(exerciseId).split('').reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 0);
  const [c1, c2] = palette[Math.abs(h) % palette.length];
  // Gradient angle also varies for visual rhythm
  const angle = 90 + (Math.abs(h) % 4) * 30;
  const initial = ex.name.charAt(0);

  return (
    <div style={{
      width:size, height:size, borderRadius: radius ?? size * 0.18,
      background:`linear-gradient(${angle}deg, ${c1}, ${c2})`,
      position:'relative', overflow:'hidden',
      display:'flex', alignItems:'center', justifyContent:'center',
      color:'#fff', flexShrink:0
    }}>
      {/* Subtle stripe overlay signals placeholder */}
      <div style={{
        position:'absolute', inset:0,
        backgroundImage:'repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 1px, transparent 1px 12px)'
      }}/>
      {/* Decorative blob */}
      <div style={{
        position:'absolute', top:'-20%', right:'-15%', width:'70%', height:'70%',
        borderRadius:'50%', background:'rgba(255,255,255,.07)'
      }}/>
      <span style={{
        fontFamily:"'DM Serif Display', serif",
        fontSize: typeof size === 'number' ? size * 0.46 : 36, lineHeight:1, opacity:0.95, position:'relative'
      }}>{initial}</span>
      {/* Demo tag in corner — only on larger cards */}
      {typeof size === 'number' && size >= 48 && (
        <span style={{
          position:'absolute', bottom: size*0.06, right: size*0.08,
          fontSize: size * 0.11,
          color:'rgba(255,255,255,.75)', letterSpacing:'.1em',
          fontFamily:"'JetBrains Mono', monospace"
        }}>DEMO</span>
      )}
      {label && (
        <div style={{
          position:'absolute', left:0, right:0, bottom:0,
          padding:'5px 7px 5px',
          background:'linear-gradient(to top, rgba(0,0,0,.55), transparent)',
          fontSize: typeof size === 'number' ? size * 0.13 : 11, color:'#fff', lineHeight:1.2
        }}>
          {ex.name}
        </div>
      )}
    </div>
  );
}

// ────────────────────────────────────────────────────────────
// Exercise Library — searchable grid with filters
const MUSCLE_GROUPS = [
  { id:'all',    label:'All' },
  { id:'chest',  label:'Chest',     matches:['Chest','Upper chest','Lower chest'] },
  { id:'back',   label:'Back',      matches:['Lats/Biceps','Upper back','Mid back','Full back'] },
  { id:'shoulders', label:'Shoulders', matches:['Shoulders','Front delts','Rear delts'] },
  { id:'arms',   label:'Arms',      matches:['Triceps','Biceps','Brachialis'] },
  { id:'legs',   label:'Legs',      matches:['Quads','Quads/Glutes','Hamstrings','Glutes','Calves'] },
  { id:'core',   label:'Core',      matches:['Core','Abs','Lower abs','Obliques','Deep core','Anti-rotation'] },
  { id:'mobility', label:'Mobility', matches:['Spine','Hips','Spine/hips','Glutes/hips','Ankles','Hamstrings'] },
];

const TYPE_FILTERS = [
  { id:'all',       label:'All' },
  { id:'compound',  label:'Compound' },
  { id:'accessory', label:'Accessory' },
  { id:'core',      label:'Core' },
  { id:'mobility',  label:'Mobility' },
];

function ExerciseLibraryScreen({ width = 390, height = 820, theme = 'light',
                                onBack, onNav, tracksCycle = true }) {
  const t = themes[theme];
  const [search, setSearch] = React.useState('');
  const [muscleFilter, setMuscleFilter] = React.useState('all');
  const [typeFilter, setTypeFilter] = React.useState('all');
  const [selected, setSelected] = React.useState(null);  // exercise id for detail modal

  const filtered = React.useMemo(() => {
    const q = search.toLowerCase();
    const muscleSpec = MUSCLE_GROUPS.find(g => g.id === muscleFilter);
    return Object.entries(window.EX_LIB || {})
      .map(([id, ex]) => ({ id, ...ex }))
      .filter(ex => {
        if (typeFilter !== 'all' && ex.type !== typeFilter) return false;
        if (muscleFilter !== 'all') {
          const m = (muscleSpec?.matches) || [];
          if (!m.some(s => ex.muscle === s)) return false;
        }
        if (q && !ex.name.toLowerCase().includes(q) && !ex.muscle.toLowerCase().includes(q)) return false;
        return true;
      });
  }, [search, muscleFilter, typeFilter]);

  // Grouped count per muscle group (for filter chip badges)
  const muscleCounts = React.useMemo(() => {
    const counts = {};
    Object.values(window.EX_LIB || {}).forEach(ex => {
      MUSCLE_GROUPS.forEach(g => {
        if (g.id === 'all') return;
        if (g.matches.some(s => ex.muscle === s)) counts[g.id] = (counts[g.id] || 0) + 1;
      });
    });
    return counts;
  }, []);

  const totalCount = Object.keys(window.EX_LIB || {}).length;
  const selectedEx = selected ? { id: selected, ...(window.EX_LIB || {})[selected] } : null;

  return (
    <div style={{
      width, height, background:t.bg, fontFamily:t.sans, color:t.text,
      display:'flex', flexDirection:'column', overflow:'hidden', position:'relative'
    }}>
      <div style={{
        height:44, display:'flex', alignItems:'flex-end', justifyContent:'space-between',
        padding:'0 22px 8px', fontSize:14, fontWeight:600
      }}>
        <span>9:41</span>
        <div style={{ display:'flex', gap:5, alignItems:'center', fontSize:11 }}>
          <span>●●●</span><span>📶</span><span>🔋</span>
        </div>
      </div>

      <ScreenHeader theme={theme} title="Exercise library" sub={`${totalCount} exercises`}
        onBack={onBack}/>

      <div style={{ flex:1, overflowY:'auto', padding:'12px 18px 16px' }} className="phone-scroll">

        {/* Search */}
        <div style={{ position:'relative', marginBottom:12 }}>
          <input
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="Search exercises or muscle…"
            style={{
              width:'100%', padding:'10px 12px 10px 36px', borderRadius:11,
              border:`1px solid ${t.border}`, background:t.surface,
              fontFamily:t.sans, fontSize:13, color:t.text, outline:'none'
            }}/>
          <span style={{
            position:'absolute', left:12, top:'50%', transform:'translateY(-50%)',
            color:t.text3, fontSize:14
          }}>⌕</span>
        </div>

        {/* Type filter chips */}
        <div style={{ display:'flex', gap:5, overflowX:'auto', marginBottom:9, paddingBottom:2 }}
             className="phone-scroll">
          {TYPE_FILTERS.map(f => (
            <button key={f.id} onClick={() => setTypeFilter(f.id)} style={{
              padding:'5px 11px', borderRadius:99, whiteSpace:'nowrap',
              background: typeFilter === f.id ? t.text : t.surface,
              color: typeFilter === f.id ? '#fff' : t.text2,
              border: `1px solid ${typeFilter === f.id ? t.text : t.border}`,
              fontFamily:t.sans, fontSize:11, fontWeight:500, cursor:'pointer'
            }}>{f.label}</button>
          ))}
        </div>

        {/* Muscle filter chips */}
        <div style={{ display:'flex', gap:5, overflowX:'auto', marginBottom:12, paddingBottom:2 }}
             className="phone-scroll">
          {MUSCLE_GROUPS.map(g => {
            const count = g.id === 'all' ? totalCount : (muscleCounts[g.id] || 0);
            return (
              <button key={g.id} onClick={() => setMuscleFilter(g.id)} style={{
                padding:'5px 11px', borderRadius:99, whiteSpace:'nowrap',
                background: muscleFilter === g.id ? t.accent+'18' : 'transparent',
                color: muscleFilter === g.id ? t.accent : t.text3,
                border: `1px solid ${muscleFilter === g.id ? t.accent : t.border}`,
                fontFamily:t.sans, fontSize:11, fontWeight:500, cursor:'pointer'
              }}>
                {g.label}
                {count > 0 && (
                  <span style={{
                    marginLeft:5, fontSize:9, color:muscleFilter === g.id ? t.accent : t.text3,
                    opacity:0.7
                  }}>{count}</span>
                )}
              </button>
            );
          })}
        </div>

        <div style={{
          fontSize:10.5, color:t.text3, marginBottom:9, padding:'0 2px',
          display:'flex', justifyContent:'space-between'
        }}>
          <span>{filtered.length} matching</span>
          {(typeFilter !== 'all' || muscleFilter !== 'all' || search) && (
            <button onClick={() => { setTypeFilter('all'); setMuscleFilter('all'); setSearch(''); }} style={{
              background:'transparent', border:'none', color:t.accent, cursor:'pointer',
              fontSize:10.5, fontFamily:t.sans
            }}>Clear filters</button>
          )}
        </div>

        {/* Grid of exercises */}
        <div style={{
          display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:9
        }}>
          {filtered.map(ex => (
            <button key={ex.id}
              onClick={() => setSelected(ex.id)}
              style={{
                background:t.surface, border:`1px solid ${t.border}`, borderRadius:14,
                padding:0, cursor:'pointer', textAlign:'left',
                display:'flex', flexDirection:'column', overflow:'hidden',
                fontFamily:t.sans
              }}>
              <div style={{ width:'100%', aspectRatio:'4/3', padding:8 }}>
                <ExerciseImage exerciseId={ex.id} size={'100%'} radius={10} theme={theme}/>
              </div>
              <div style={{ padding:'8px 11px 11px' }}>
                <div style={{ fontSize:12.5, color:t.text, lineHeight:1.2 }}>
                  {ex.name}
                </div>
                <div style={{
                  fontSize:9.5, color:t.text3, marginTop:3,
                  display:'flex', alignItems:'center', gap:5
                }}>
                  <span style={{
                    width:5, height:5, borderRadius:'50%',
                    background: EX_TYPE_COLORS[ex.type]?.[0] || t.text3
                  }}/>
                  {ex.muscle}
                </div>
              </div>
            </button>
          ))}
        </div>

        {filtered.length === 0 && (
          <div style={{ textAlign:'center', padding:'30px 0', color:t.text3, fontSize:12 }}>
            No matches.
          </div>
        )}
      </div>

      <BottomNav theme={theme} active="gym" onNav={onNav} tracksCycle={tracksCycle}/>

      {/* Detail modal */}
      {selectedEx && (
        <div style={{
          position:'absolute', inset:0, background:'rgba(0,0,0,.45)',
          display:'flex', alignItems:'flex-end', zIndex:50
        }} onClick={() => setSelected(null)}>
          <div onClick={(e) => e.stopPropagation()} style={{
            width:'100%', background:t.surface,
            borderTopLeftRadius:22, borderTopRightRadius:22,
            padding:'18px 20px 22px', maxHeight:'80%',
            display:'flex', flexDirection:'column'
          }}>
            <div style={{
              width:38, height:4, background:t.border, borderRadius:99, margin:'0 auto 14px'
            }}/>

            {/* Big hero image */}
            <div style={{ marginBottom:14, position:'relative' }}>
              <div style={{ width:'100%', aspectRatio:'2/1' }}>
                <ExerciseImage exerciseId={selectedEx.id} size={'100%'} radius={14} theme={theme}/>
              </div>
              <div style={{
                position:'absolute', bottom:10, left:10, right:10,
                display:'flex', alignItems:'flex-end', justifyContent:'space-between',
                color:'#fff'
              }}>
                <div>
                  <div style={{
                    fontSize:9.5, letterSpacing:'.18em', opacity:0.85,
                    textTransform:'uppercase', marginBottom:1
                  }}>
                    {selectedEx.type}
                  </div>
                  <div style={{ fontFamily:t.serif, fontSize:22, lineHeight:1 }}>
                    {selectedEx.name}
                  </div>
                </div>
                <button style={{
                  width:38, height:38, borderRadius:'50%', background:'rgba(255,255,255,.2)',
                  border:'1px solid rgba(255,255,255,.4)', color:'#fff', cursor:'pointer',
                  fontSize:14, display:'flex', alignItems:'center', justifyContent:'center'
                }}>▶</button>
              </div>
            </div>

            <div style={{ overflowY:'auto', flex:1, paddingRight:2 }}>
              <div style={{
                display:'flex', gap:6, flexWrap:'wrap', marginBottom:14
              }}>
                <span style={{
                  fontSize:11, padding:'4px 10px', borderRadius:99,
                  background:t.surface2, border:`1px solid ${t.border}`, color:t.text2
                }}>
                  Target · {selectedEx.muscle}
                </span>
                <span style={{
                  fontSize:11, padding:'4px 10px', borderRadius:99,
                  background:EX_TYPE_COLORS[selectedEx.type][0] + '20',
                  border:`1px solid ${EX_TYPE_COLORS[selectedEx.type][0]}40`,

}

// ────────────────────────────────────────────────────────────
// Day Activities — schedule gym + non-gym sessions for a specific day
const ACTIVITY_TYPES = [
  { id:'run',    label:'Run',         emoji:'🏃', source:'Strava' },
  { id:'cycle',  label:'Cycle',       emoji:'🚴', source:'Strava' },
  { id:'swim',   label:'Swim',        emoji:'🏊', source:'Strava' },
  { id:'walk',   label:'Walk',        emoji:'🚶', source:'Manual' },
  { id:'hike',   label:'Hike',        emoji:'⛰️', source:'Strava' },
  { id:'yoga',   label:'Yoga',        emoji:'🧘', source:'Manual' },
  { id:'pilates',label:'Pilates',     emoji:'🤸', source:'Manual' },
  { id:'class',  label:'Class',       emoji:'💃', source:'Manual' },
  { id:'climb',  label:'Climbing',    emoji:'🧗', source:'Manual' },
];

const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

function DayActivitiesScreen({ width = 390, height = 820, theme = 'light',
                              plan, dayIdx, activities = {},
                              onBack, onSave, onNav, tracksCycle = true,
                              onEditGym }) {
  const t = themes[theme];
  const split = SPLITS[plan.splitDays];
  const slot = split.schedule[dayIdx];
  const isRestDay = slot === '—';
  const gymDay = !isRestDay ? split.days.find(d => d.id === slot) : null;
  const [dayActs, setDayActs] = React.useState(activities[dayIdx] || []);
  const [addingType, setAddingType] = React.useState(null);
  const [draft, setDraft] = React.useState({ duration: 30, time: '07:00', notes: '' });

  const totalDuration = dayActs.reduce((n, a) => n + (a.duration || 0), 0);

  const addActivity = () => {
    const type = ACTIVITY_TYPES.find(t => t.id === addingType);
    if (!type) return;
    const id = `${addingType}-${Date.now()}`;
    setDayActs([...dayActs, {
      id, type:addingType, label:type.label, emoji:type.emoji,
      duration: draft.duration, time: draft.time, notes: draft.notes, source: type.source
    }]);
    setAddingType(null);
    setDraft({ duration: 30, time: '07:00', notes: '' });
  };
  const removeActivity = (id) => setDayActs(dayActs.filter(a => a.id !== id));

  const save = () => {
    if (onSave) onSave(dayIdx, dayActs);
    onBack();
  };

  return (
    <div style={{
      width, height, background:t.bg, fontFamily:t.sans, color:t.text,
      display:'flex', flexDirection:'column', overflow:'hidden', position:'relative'
    }}>
      <div style={{
        height:44, display:'flex', alignItems:'flex-end', justifyContent:'space-between',
        padding:'0 22px 8px', fontSize:14, fontWeight:600
      }}>
        <span>9:41</span>
        <div style={{ display:'flex', gap:5, alignItems:'center', fontSize:11 }}>
          <span>●●●</span><span>📶</span><span>🔋</span>
        </div>
      </div>

      <ScreenHeader theme={theme} title={DAY_NAMES[dayIdx]} sub="Schedule"
        onBack={onBack}
        right={
          <button onClick={save} style={{
            padding:'6px 12px', borderRadius:8, background:t.accent, color:t.accentText,
            border:'none', fontFamily:t.sans, fontSize:11, fontWeight:600, cursor:'pointer'
          }}>Save</button>
        }
      />

      <div style={{ flex:1, overflowY:'auto', padding:'14px 18px 16px' }} className="phone-scroll">

        {/* Gym session for this day */}
        <div style={{
          fontSize:10, letterSpacing:'.16em', textTransform:'uppercase',
          color:t.text3, marginBottom:8, padding:'0 4px'
        }}>
          Gym session
        </div>
        {gymDay ? (
          <div onClick={() => onEditGym && onEditGym(gymDay.id)} style={{
            background:t.surface, border:`1px solid ${t.border}`, borderRadius:14,
            padding:'12px 14px', marginBottom:18, cursor:'pointer',
            display:'flex', alignItems:'center', gap:11
          }}>
            <div style={{
              width:38, height:38, borderRadius:10, background:t.accent,
              color:t.accentText, fontFamily:t.serif, fontSize:18,
              display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0
            }}>{gymDay.name.charAt(0)}</div>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:13, color:t.text, fontWeight:500 }}>{gymDay.name} day</div>
              <div style={{ fontSize:10.5, color:t.text3 }}>
                {gymDay.muscles}
              </div>
            </div>
            <span style={{ fontSize:10, color:t.accent, fontWeight:500 }}>Edit ›</span>
          </div>
        ) : (
          <div style={{
            background:t.surface2, border:`1px dashed ${t.border2}`, borderRadius:14,
            padding:'12px 14px', marginBottom:18, fontSize:12, color:t.text3,
            textAlign:'center'
          }}>
            Rest day — no gym scheduled
          </div>
        )}

        {/* Other activities */}
        <div style={{
          fontSize:10, letterSpacing:'.16em', textTransform:'uppercase',
          color:t.text3, marginBottom:8, padding:'0 4px',
          display:'flex', justifyContent:'space-between', alignItems:'baseline'
        }}>
          <span>Other activities</span>
          {dayActs.length > 0 && <span style={{ letterSpacing:'.04em' }}>
            {dayActs.length} · {totalDuration}m total
          </span>}
        </div>

        {dayActs.map(a => (
          <div key={a.id} style={{
            background:t.surface, border:`1px solid ${t.border}`, borderRadius:13,
            padding:'10px 14px', marginBottom:6,
            display:'flex', alignItems:'center', gap:11
          }}>
            <div style={{
              width:34, height:34, borderRadius:9, background:'#0090FF18',
              fontSize:16, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0
            }}>{a.emoji}</div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:12.5, color:t.text, fontWeight:500 }}>{a.label}</div>
              <div style={{ fontSize:10.5, color:t.text3, marginTop:1 }}>
                {a.duration}m · {a.time} · from {a.source}
              </div>
            </div>
            <button onClick={() => removeActivity(a.id)} style={{
              width:24, height:24, borderRadius:6, border:`1px solid ${t.border}`,
              background:'transparent', color:'#BE3B2E', cursor:'pointer',
              fontSize:12, fontFamily:t.sans
            }}>×</button>
          </div>
        ))}

        {dayActs.length === 0 && (
          <div style={{
            background:t.surface2, border:`1px dashed ${t.border2}`, borderRadius:13,
            padding:'14px 14px', marginBottom:8, textAlign:'center'
          }}>
            <div style={{ fontSize:12, color:t.text2, marginBottom:4 }}>
              Nothing logged yet.
            </div>
            <div style={{ fontSize:10.5, color:t.text3, lineHeight:1.5 }}>
              Add a run, swim, yoga class or other activity — auto-synced from connected apps when available.
            </div>
          </div>
        )}

        <button onClick={() => setAddingType('run')} style={{
          width:'100%', padding:'12px', borderRadius:13,
          background:t.accent, color:t.accentText,
          border:'none', fontFamily:t.sans, fontSize:13, fontWeight:600, cursor:'pointer',
          marginTop: dayActs.length ? 6 : 0,
          display:'flex', alignItems:'center', justifyContent:'center', gap:5
        }}>
          + Add activity
        </button>
      </div>

      <BottomNav theme={theme} active="gym" onNav={onNav} tracksCycle={tracksCycle}/>

      {/* Add activity sheet */}
      {addingType && (
        <div style={{
          position:'absolute', inset:0, background:'rgba(0,0,0,.45)',
          display:'flex', alignItems:'flex-end', zIndex:50
        }} onClick={() => setAddingType(null)}>
          <div onClick={(e) => e.stopPropagation()} style={{
            width:'100%', background:t.surface,
            borderTopLeftRadius:22, borderTopRightRadius:22,
            padding:'18px 20px 20px'
          }}>
            <div style={{
              width:38, height:4, background:t.border, borderRadius:99, margin:'0 auto 14px'
            }}/>
            <div style={{ fontFamily:t.serif, fontSize:22, color:t.text, marginBottom:14 }}>
              Add activity
            </div>

            {/* Activity type grid */}
            <div style={{
              display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:6, marginBottom:14
            }}>
              {ACTIVITY_TYPES.map(at => (
                <button key={at.id} onClick={() => setAddingType(at.id)} style={{
                  padding:'10px 6px', borderRadius:11,
                  background: addingType === at.id ? t.accent+'15' : t.surface2,
                  border: `1.5px solid ${addingType === at.id ? t.accent : t.border}`,
                  cursor:'pointer', fontFamily:t.sans,
                  display:'flex', flexDirection:'column', alignItems:'center', gap:3
                }}>
                  <span style={{ fontSize:20 }}>{at.emoji}</span>
                  <span style={{ fontSize:10.5, color:t.text, fontWeight:500 }}>{at.label}</span>
                  <span style={{ fontSize:9, color:t.text3 }}>{at.source}</span>
                </button>
              ))}
            </div>

            {/* Duration + Time */}
            <div style={{
              display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:14
            }}>
              <div>
                <div style={{
                  fontSize:9, letterSpacing:'.16em', textTransform:'uppercase',
                  color:t.text3, marginBottom:5
                }}>Duration</div>
                <NumberRow value={draft.duration} min={5} max={300} step={5} unit="min"
                  onChange={(v) => setDraft({...draft, duration: v})} theme={theme}/>
              </div>
              <div>
                <div style={{
                  fontSize:9, letterSpacing:'.16em', textTransform:'uppercase',
                  color:t.text3, marginBottom:5
                }}>Time</div>
                <input type="time" value={draft.time}
                  onChange={(e) => setDraft({...draft, time: e.target.value})}
                  style={{
                    width:'100%', padding:'9px 12px', borderRadius:11,
                    border:`1px solid ${t.border2}`, background:t.surface,
                    fontFamily:t.mono, fontSize:14, color:t.text, outline:'none'
                  }}/>
              </div>
            </div>

            <div style={{ display:'flex', gap:8 }}>
              <button onClick={() => setAddingType(null)} style={{
                flex:1, padding:'12px', borderRadius:11,
                background:'transparent', border:`1px solid ${t.border2}`,
                color:t.text, fontFamily:t.sans, fontSize:13, fontWeight:500, cursor:'pointer'
              }}>Cancel</button>
              <button onClick={addActivity} style={{
                flex:1, padding:'12px', borderRadius:11,
                background:t.accent, color:t.accentText,
                border:'none', fontFamily:t.sans, fontSize:13, fontWeight:600, cursor:'pointer'
              }}>Add</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

Object.assign(window, {
  ExerciseImage, ExerciseLibraryScreen, DayActivitiesScreen,
  ACTIVITY_TYPES, MUSCLE_GROUPS, EX_TYPE_COLORS
});

</script>

<script type="text/babel" data-presets="react">
// Onboarding flow — multi-step setup wizard
// Captures profile basics, data imports, and split preference

// ────────────────────────────────────────────────────────────
// Available data sources for import. Period tracker only shown if user tracks cycle.
const IMPORT_SOURCES = [

  { id:'mfp',      name:'MyFitnessPal',   scope:'Meals · Macros · Calories', color:'#0072CE', glyph:'M', cycleOnly:false },

  { id:'flo',      name:'Flo',            scope:'Period & cycle history',  color:'#E85DA1', glyph:'F', cycleOnly:true },
  { id:'clue',     name:'Clue',           scope:'Period & cycle history',  color:'#1C1917', glyph:'C', cycleOnly:true },
];

const GOAL_OPTIONS = [
  { id:'strength',    label:'Build strength',  sub:'Heavy compounds, progressive overload', icon:'💪' },
  { id:'muscle',      label:'Build muscle',    sub:'Hypertrophy focus, higher volume',      icon:'🏋️' },
  { id:'fat-loss',    label:'Lose fat',        sub:'Calorie deficit + maintain muscle',     icon:'🔥' },
  { id:'active',      label:'Stay active',     sub:'Habit-building, general health',        icon:'🌿' },
  { id:'flexibility', label:'Mobility & flow', sub:'Stretch, yoga, recover',                icon:'🧘' },
];

// ────────────────────────────────────────────────────────────
function OnboardingScreen({ width = 390, height = 820, theme = 'light', onComplete, initial }) {
  const t = themes[theme];
  const [step, setStep] = React.useState(0);

  // The profile builds up across steps
  const [profile, setProfile] = React.useState(initial || {
    name: '',
    age: 30,
    sex: '',
    tracksCycle: null,
    height: 168,
    weight: 65,
    goal: '',
    connected: [],
    splitDays: 3,
  });

  // Step config — controls which steps appear (cycle step hidden if N/A)
  const allSteps = ['welcome','basics','cycle','goal','imports','split','done'];
  const steps = profile.sex === 'male' || profile.tracksCycle === false
    ? allSteps.filter(s => s !== 'cycle')
    : allSteps;
  const current = steps[step] || 'welcome';
  const progress = (step + 1) / steps.length;
  const isLast = step === steps.length - 1;

  const next = () => {
    if (isLast) {
      onComplete(profile);
    } else {
      setStep(s => Math.min(s + 1, steps.length - 1));
    }
  };
  const back = () => setStep(s => Math.max(0, s - 1));

  // Whether Next is enabled
  const canAdvance = (() => {
    if (current === 'basics') return profile.name && profile.sex;
    if (current === 'cycle') return profile.tracksCycle !== null;
    if (current === 'goal') return !!profile.goal;
    return true;
  })();

  const update = (patch) => setProfile(p => ({ ...p, ...patch }));

  return (
    <div style={{
      width, height, background:t.bg, fontFamily:t.sans, color:t.text,
      display:'flex', flexDirection:'column', overflow:'hidden', position:'relative'
    }}>
      {/* Ambient glow */}
      <div style={{
        position:'absolute', top:-80, right:-60, width:280, height:280, borderRadius:'50%',
        background:`radial-gradient(circle, ${t.accent}28, transparent 65%)`, pointerEvents:'none'
      }}/>
      <div style={{
        position:'absolute', bottom:-100, left:-80, width:300, height:300, borderRadius:'50%',
        background:`radial-gradient(circle, ${theme==='dark'?t.purple:'#6D4AAF'}18, transparent 65%)`, pointerEvents:'none'
      }}/>

      {/* Status bar */}
      <div style={{
        height:44, display:'flex', alignItems:'flex-end', justifyContent:'space-between',
        padding:'0 22px 8px', fontSize:14, fontWeight:600, position:'relative'
      }}>
        <span>9:41</span>
        <div style={{ display:'flex', gap:5, alignItems:'center', fontSize:11 }}>
          <span>●●●</span><span>📶</span><span>🔋</span>
        </div>
      </div>

      {/* Top progress + back */}
      <div style={{
        padding:'4px 20px 14px', display:'flex', alignItems:'center', gap:12,
        position:'relative'
      }}>
        {step > 0 && current !== 'done' ? (
          <button onClick={back} style={{
            width:32, height:32, borderRadius:9, background:'transparent',
            border:`1px solid ${t.border}`, color:t.text, cursor:'pointer',
            display:'flex', alignItems:'center', justifyContent:'center', fontSize:14,
            flexShrink:0
          }}>←</button>
        ) : <div style={{ width:32, flexShrink:0 }}/>}

        {/* Progress bar */}
        <div style={{ flex:1 }}>
          <div style={{
            height:3, background:t.border, borderRadius:99, overflow:'hidden'
          }}>
            <div style={{
              height:'100%', background:t.accent, borderRadius:99,
              width: `${progress*100}%`, transition:'width .4s cubic-bezier(.2,.7,.2,1)'
            }}/>
          </div>
          <div style={{
            fontSize:9.5, color:t.text3, marginTop:4, letterSpacing:'.06em',
            display:'flex', justifyContent:'space-between'
          }}>
            <span>Step {step + 1} of {steps.length}</span>
            <span style={{ textTransform:'uppercase' }}>{current === 'done' ? '' : current.replace(/-/g,' ')}</span>
          </div>
        </div>
        <div style={{ width:32 }}/>
      </div>

      {/* Step body */}
      <div style={{ flex:1, overflowY:'auto', padding:'14px 22px 16px', position:'relative' }}
           className="phone-scroll">

        {current === 'welcome' && (
          <div style={{ padding:'12px 0' }}>
            <div style={{
              width:64, height:64, borderRadius:18,
              background:`linear-gradient(135deg, ${t.accent}, #6D4AAF)`,
              display:'flex', alignItems:'center', justifyContent:'center',
              fontFamily:t.serif, fontSize:34, color:'#fff', marginBottom:24,
              boxShadow: `0 14px 40px ${t.accent}30`
            }}>F</div>
            <div style={{
              fontFamily:t.serif, fontSize:38, lineHeight:1.05, color:t.text,
              marginBottom:12, letterSpacing:'-.01em'
            }}>
              Welcome to <span style={{ color:t.accent }}>Forma.</span>
            </div>
            <div style={{ fontSize:13.5, color:t.text2, lineHeight:1.55, marginBottom:24 }}>
              Strength, nutrition, and recovery — tuned to your body and your cycle.
              Let's set you up. Takes about a minute.
            </div>
            <div style={{
              padding:'14px 16px', borderRadius:14,
              background:t.surface, border:`1px solid ${t.border}`,
              display:'flex', gap:11, marginBottom:10
            }}>
              <div style={{
                width:30, height:30, borderRadius:9, background:t.accent+'18', color:t.accent,
                display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, flexShrink:0
              }}>🔒</div>
              <div style={{ fontSize:12, color:t.text2, lineHeight:1.5 }}>
                Everything stays on your device. You decide what we sync.
              </div>
            </div>
          </div>
        )}

        {current === 'basics' && (
          <div>
            <div style={{
              fontFamily:t.serif, fontSize:30, lineHeight:1.1, color:t.text,
              marginBottom:8, letterSpacing:'-.01em'
            }}>
              About you.
            </div>
            <div style={{ fontSize:12.5, color:t.text2, marginBottom:22, lineHeight:1.5 }}>
              We use this to personalise your plan and recommendations.
            </div>

            <Field label="What should we call you?" theme={theme}>
              <input value={profile.name} onChange={(e) => update({ name: e.target.value })}
                autoFocus placeholder="Your name"
                style={inputStyle(t)}/>
            </Field>

            <Field label="Sex assigned at birth" theme={theme}
              hint="Used to tailor recommendations. You'll control cycle tracking next.">
              <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:6 }}>
                {[
                  { value:'female', label:'Female' },
                  { value:'male',   label:'Male'   },
                  { value:'other',  label:'Other'  },
                ].map(o => (
                  <button key={o.value}
                    onClick={() => update({
                      sex: o.value,

                      tracksCycle: profile.tracksCycle === null && o.value === 'female' ? true
                                  : (o.value === 'male' ? false : profile.tracksCycle)
                    })}
                    style={selectStyle(t, profile.sex === o.value)}>
                    {o.label}
                  </button>
                ))}
              </div>
            </Field>

            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
              <Field label="Age" theme={theme}>
                <NumberRow value={profile.age} min={14} max={90} unit="yrs"
                  onChange={(v) => update({ age: v })} theme={theme}/>
              </Field>
              <Field label="Weight" theme={theme}>
                <NumberRow value={profile.weight} min={30} max={200} step={0.5} unit="kg"
                  onChange={(v) => update({ weight: v })} theme={theme}/>
              </Field>
            </div>

            <Field label="Height" theme={theme}>
              <NumberRow value={profile.height} min={130} max={220} unit="cm"
                onChange={(v) => update({ height: v })} theme={theme}/>
            </Field>

        )}

        {current === 'cycle' && (
          <div>

              fontFamily:t.serif, fontSize:30, lineHeight:1.1, color:t.text,
              marginBottom:8, letterSpacing:'-.01em'
            }}>
              Cycle tracking.
            </div>
            <div style={{ fontSize:12.5, color:t.text2, marginBottom:22, lineHeight:1.5 }}>
              Forma can tailor your training and nutrition to your menstrual cycle —
              follicular peaks, luteal slow-downs, period care. Optional.
            </div>

            <button onClick={() => update({ tracksCycle: true })} style={{
              width:'100%', textAlign:'left', padding:'14px 16px', borderRadius:14,
              background: profile.tracksCycle === true ? t.accent+'10' : t.surface,
              border:`1.5px solid ${profile.tracksCycle === true ? t.accent : t.border}`,
              cursor:'pointer', fontFamily:t.sans, marginBottom:10,
              display:'flex', gap:12, alignItems:'flex-start'
            }}>
              <div style={{
                width:34, height:34, borderRadius:10,
                background: profile.tracksCycle === true ? t.accent+'25' : t.surface2,
                color: profile.tracksCycle === true ? t.accent : t.text2,
                display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, flexShrink:0
              }}>🌸</div>
              <div style={{ flex:1 }}>

          {hint}
        </div>
      )}
    </div>
  );
}

function inputStyle(t) {
  return {
    width:'100%', padding:'12px 14px', borderRadius:11,
    border:`1px solid ${t.border2}`, background:t.surface,
    fontFamily:t.sans, fontSize:14, color:t.text, outline:'none'
  };
}

function selectStyle(t, active) {
  return {
    padding:'10px', borderRadius:11,
    background: active ? t.text : t.surface,
    color: active ? '#fff' : t.text,
    border: active ? `1.5px solid ${t.text}` : `1px solid ${t.border}`,
    fontFamily:t.sans, fontSize:12.5, cursor:'pointer', fontWeight:500
  };
}

function NumberRow({ value, min, max, step = 1, unit, onChange, theme }) {
  const t = themes[theme];
  const clamp = (v) => Math.max(min, Math.min(max, v));
  const [draft, setDraft] = React.useState(String(value));
  // Keep draft in sync when value changes via +/− buttons
  React.useEffect(() => { setDraft(String(value)); }, [value]);

  const commit = (raw) => {
    const n = parseFloat(raw);
    if (Number.isNaN(n)) { setDraft(String(value)); return; }
    onChange(clamp(n));
  };

  return (
    <div style={{
      display:'flex', alignItems:'stretch',
      background:t.surface, border:`1px solid ${t.border2}`, borderRadius:11,
      overflow:'hidden'
    }}>
      <button onClick={() => onChange(clamp(Number((value - step).toFixed(1))))} style={{
        width:38, background:'transparent', border:'none', color:t.text2,
        fontSize:16, cursor:'pointer', fontFamily:t.sans,
        borderRight:`1px solid ${t.border}`, flexShrink:0
      }}>−</button>
      <div style={{
        flex:1, display:'flex', alignItems:'center', justifyContent:'center', gap:4,
        minWidth:0
      }}>
        <input
          type="text"
          inputMode="decimal"
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onBlur={(e) => commit(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }}
          style={{
            width: Math.max(28, String(draft).length * 11 + 6),
            maxWidth:'70%',
            border:'none', outline:'none', background:'transparent',
            fontFamily:t.serif, fontSize:18, color:t.text,
            fontVariantNumeric:'tabular-nums', textAlign:'center', padding:0
          }}
        />
        <span style={{ fontSize:11, color:t.text3, fontFamily:t.sans, flexShrink:0 }}>{unit}</span>
      </div>
      <button onClick={() => onChange(clamp(Number((value + step).toFixed(1))))} style={{
        width:38, background:'transparent', border:'none', color:t.text2,
        fontSize:16, cursor:'pointer', fontFamily:t.sans,
        borderLeft:`1px solid ${t.border}`, flexShrink:0
      }}>+</button>
    </div>
  );
}

window.OnboardingScreen = OnboardingScreen;

</script>

function MacroRing({ size = 110, strokeW = 10, consumed, target, color, label, theme }) {
  const t = themes[theme];
  const pct = target > 0 ? Math.min(1, consumed / target) : 0;
  const r = (size - strokeW) / 2;
  const c = 2 * Math.PI * r;
  const [drawn, setDrawn] = React.useState(false);
  React.useEffect(() => { const id = setTimeout(() => setDrawn(true), 100); return () => clearTimeout(id); }, []);
  const offset = c * (1 - (drawn ? pct : 0));
  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:5 }}>
      <div style={{ position:'relative', width:size, height:size }}>
        <svg width={size} height={size} style={{ transform:'rotate(-90deg)' }}>

          <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={strokeW}
            fill="none" strokeLinecap="round"
            strokeDasharray={c} strokeDashoffset={offset}
            style={{ transition:'stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1)' }}/>
