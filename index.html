          alignItems:'center', justifyContent:'center'
        }}>
          <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:20, color:t.text, lineHeight:1 }}>
            {consumed}
          </div>
          <div style={{ fontSize:9.5, color:t.text3, letterSpacing:'.04em' }}>/{target}</div>
        </div>
      </div>
      <div style={{ fontSize:10, color:color, fontWeight:600, letterSpacing:'.06em', textTransform:'uppercase' }}>
        {label}
      </div>
    </div>
  );
}

// ─── Macro bar component ───────────────────────────────────────────────────────
function MacroBar({ consumed, target, color, label, unit = 'g', theme }) {
  const t = themes[theme];
  const pct = target > 0 ? Math.min(100, (consumed / target) * 100) : 0;
  const [w, setW] = React.useState(0);
  React.useEffect(() => { const id = setTimeout(() => setW(pct), 80); return () => clearTimeout(id); }, [pct]);
  return (
    <div style={{ flex:1 }}>
      <div style={{ display:'flex', justifyContent:'space-between', marginBottom:4 }}>
        <span style={{ fontSize:10, color:t.text2, fontWeight:500 }}>{label}</span>
        <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:t.text3 }}>
          {consumed}<span style={{ color:t.text3 }}>/{target}{unit}</span>
        </span>
      </div>
      <div style={{ height:5, background:color+'20', borderRadius:999, overflow:'hidden' }}>
        <div style={{
          height:'100%', width:w+'%', background:color, borderRadius:999,
          transition:'width 1s cubic-bezier(.2,.7,.2,1)'
        }}/>
      </div>
    </div>
  );
}

// ─── Main FoodScreen ──────────────────────────────────────────────────────────
function FoodScreen({
  width = 390, height = 820, theme = 'light',
  foodLog = {}, userSettings = {}, plan = {}, activities = {},
  completedSessions = [],
  onUpdateFood,
  onNav, tracksCycle = true,
}) {
  const t = themes[theme];
  const base        = userSettings.dailyCaloriesBase || 1500;
  const gymBoost    = userSettings.gymDayBoost || 250;

  // Current viewing date (defaults to today, arrows navigate)
  const [viewDate, setViewDate]   = React.useState(new Date());
  const [addMeal,  setAddMeal]    = React.useState(null);   // meal id that the sheet is open for
  const [search,   setSearch]     = React.useState('');
  const [selected, setSelected]   = React.useState(null);   // food from DB being added
  const [grams,    setGrams]      = React.useState('');
  const [customName, setCustomName] = React.useState('');
  const [customCal,  setCustomCal]  = React.useState('');
  const [customProt, setCustomProt] = React.useState('');
  const [showCustom, setShowCustom] = React.useState(false);
  const [showWeekly, setShowWeekly] = React.useState(false);

  const today    = new Date();
  const vKey     = foodDateKey(viewDate);
  const isToday  = vKey === foodDateKey(today);
  const entries  = foodLog[vKey]?.entries || [];

  // Day target — fixed (no gym day adjustments)
  const vDow     = foodDow(viewDate);
  const split    = SPLITS && plan.splitDays ? SPLITS[plan.splitDays] : null;
  const isGymDay = split && split.schedule[vDow] !== '—';
  const completedGymThisDay = completedSessions.some(s => foodDateKey(new Date(s.date)) === vKey);
  const hasActivity = (activities[vDow] || []).some(a => a.duration >= 30);
  const dayTarget = base; // fixed — no gym day adjustments

  // Detect if today had a heavy compound session (for info banner)
  const todayCompletedSession = completedSessions.find(s => foodDateKey(new Date(s.date)) === vKey);
  const isHeavyCompoundDay = todayCompletedSession && split && (() => {
    const sched = plan.scheduleOverride || (split ? split.schedule : []);
    const slot = sched[vDow];
    if (!slot || slot === '—') return false;
    const day = split.days.find(d => d.id === slot);
    return day && day.compound && day.compound.length >= 2;
  })();

  // Macro targets — derived from calorie target (30% protein, 40% carbs, 30% fat)
  const protTarget = Math.round(dayTarget * 0.30 / 4);
  const carbTarget = Math.round(dayTarget * 0.40 / 4);
  const fatTarget  = Math.round(dayTarget * 0.30 / 9);

  // Today's totals
  const totCal  = entries.reduce((s, e) => s + (e.calories || 0), 0);
  const totProt = entries.reduce((s, e) => s + (e.protein  || 0), 0);
  const totCarb = entries.reduce((s, e) => s + (e.carbs    || 0), 0);
  const totFat  = entries.reduce((s, e) => s + (e.fat      || 0), 0);

  const calPct = dayTarget > 0 ? Math.min(1, totCal / dayTarget) : 0;
  let ringColor = '#15803D';
  if (calPct > 1.15)      ringColor = '#BE3B2E';
  else if (calPct > 1.05) ringColor = '#B45309';

  // Weekly data for overview
  const weekStart = foodGetWeekStart(today);
  const weekDays  = Array.from({length:7}, (_,i) => {
    const d   = foodAddDays(weekStart, i);
    const tgt = base; // fixed — no gym day adjustments
    const k   = foodDateKey(d);
    const con = (foodLog[k]?.entries || []).reduce((s,e) => s + (e.calories||0), 0);
    return { d, key:k, label:FOOD_DAY_LABELS[i], target:tgt, consumed:con,
             isToday: k === foodDateKey(today), isFuture: d > today };
  });

  // Food DB search
  const filteredDB = React.useMemo(() => {
    if (!search.trim()) return FOOD_DB.slice(0, 16);
    const q = search.toLowerCase();
    return FOOD_DB.filter(f => f.name.toLowerCase().includes(q) || f.cat.toLowerCase().includes(q));
  }, [search]);

  // Calculate nutrition for currently entered grams
  const calcNutrition = (food, g) => {
    const mult = Number(g) / 100;
    return {
      calories: Math.round(food.cal * mult),
      protein:  Math.round(food.p   * mult * 10) / 10,
      carbs:    Math.round(food.c   * mult * 10) / 10,
      fat:      Math.round(food.f   * mult * 10) / 10,
    };
  };

  const confirmAdd = () => {
    if (!selected || !grams) return;
    const n = calcNutrition(selected, grams);
    const entry = {
      id: Date.now().toString(),
      name: selected.name + ' (' + grams + 'g)',
      meal: addMeal,
      time: new Date().toTimeString().slice(0,5),
      grams: Number(grams),
      ...n
    };
    const updated = [...entries, entry];
    if (onUpdateFood) onUpdateFood(vKey, updated);
    resetSheet();
  };

  const confirmCustom = () => {
    const cal = Number(customCal);
    if (!cal || cal <= 0) return;
    const entry = {
      id: Date.now().toString(),
      name: customName.trim() || 'Custom food',
      meal: addMeal,
      time: new Date().toTimeString().slice(0,5),
      grams: 0,
      calories: cal,
      protein:  Number(customProt) || 0,
      carbs:    0,
      fat:      0,
    };
    const updated = [...entries, entry];
    if (onUpdateFood) onUpdateFood(vKey, updated);
    resetSheet();
  };

  const removeEntry = (id) => {
    const updated = entries.filter(e => e.id !== id);
    if (onUpdateFood) onUpdateFood(vKey, updated);
  };

  const resetSheet = () => {
    setAddMeal(null); setSearch(''); setSelected(null); setGrams('');
    setCustomName(''); setCustomCal(''); setCustomProt(''); setShowCustom(false);
  };

  const navigateDay = (delta) => {
    setViewDate(d => foodAddDays(d, delta));
  };

  // Touch swipe for date navigation
  const swipeRef = React.useRef(null);
  const onTouchStart = (e) => { swipeRef.current = e.touches[0].clientX; };
  const onTouchEnd   = (e) => {
    if (!swipeRef.current) return;
    const dx = e.changedTouches[0].clientX - swipeRef.current;
    if (dx < -40) navigateDay(1);
    if (dx > 40)  navigateDay(-1);
    swipeRef.current = null;
  };

  const dateLabel = isToday ? 'Today' : viewDate.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'short' });

  return (
    <div style={{
      width, height, background:t.bg, fontFamily:t.sans, color:t.text,
      display:'flex', flexDirection:'column', overflow:'hidden', position:'relative'
    }}>
      {/* Status bar */}
      <div style={{
        height:44, display:'flex', alignItems:'flex-end', justifyContent:'space-between',
        padding:'0 22px 8px', fontSize:14, fontWeight:600, color:t.text, flexShrink:0
      }}>
        <span>9:41</span>
        <div style={{ display:'flex', gap:5, alignItems:'center', fontSize:11 }}>
          <span>●●●</span><span>📶</span><span>🔋</span>
        </div>
      </div>

      {/* Header with day navigation */}
      <div style={{
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'2px 18px 12px', flexShrink:0
      }}>
        <button onClick={() => navigateDay(-1)} style={{
          width:32, height:32, borderRadius:9, background:'transparent',
          border:`1px solid ${t.border}`, color:t.text2, cursor:'pointer',
          display:'flex', alignItems:'center', justifyContent:'center', fontSize:16
        }}>‹</button>
        <div style={{ textAlign:'center' }}>
          <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:22, color:t.text, lineHeight:1 }}>
            {dateLabel}
          </div>
          {!isToday && (
            <button onClick={() => setViewDate(new Date())} style={{
              marginTop:3, fontSize:10, color:t.accent, background:'transparent',
              border:'none', cursor:'pointer', fontFamily:t.sans
            }}>Back to today</button>
          )}
        </div>
        <button onClick={() => navigateDay(1)} style={{
          width:32, height:32, borderRadius:9, background:'transparent',
          border:`1px solid ${t.border}`, color:t.text2, cursor:'pointer',
          display:'flex', alignItems:'center', justifyContent:'center', fontSize:16
        }}>›</button>
      </div>

      {/* Scrollable body — swipeable */}
      <div
        style={{ flex:1, overflowY:'auto', padding:'0 18px 16px', position:'relative' }}
        className="phone-scroll"
        onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
      >

        {/* ── CALORIE RING + MACRO BARS ── */}
        <div style={{
          background:t.surface, border:`1px solid ${t.border}`, borderRadius:20,
          padding:'16px 18px', marginBottom:12
        }}>
          <div style={{ display:'flex', gap:16, alignItems:'center' }}>
            {/* Big calorie ring */}
            <div style={{ position:'relative', flexShrink:0 }}>
              {(() => {
                const r = 44, sw = 11, sz = r*2+sw;
                const circ = 2*Math.PI*r;
                const [drawn, setD] = React.useState(false);
                React.useEffect(() => { const id = setTimeout(() => setD(true), 80); return () => clearTimeout(id); }, [totCal]);
                const off = circ * (1 - (drawn ? calPct : 0));
                return (
                  <div style={{ position:'relative', width:sz, height:sz }}>
                    <svg width={sz} height={sz} style={{ transform:'rotate(-90deg)' }}>
                      <circle cx={sz/2} cy={sz/2} r={r} stroke={ringColor+'25'} strokeWidth={sw} fill="none"/>
                      <circle cx={sz/2} cy={sz/2} r={r} stroke={ringColor} strokeWidth={sw}
                        fill="none" strokeLinecap="round"
                        strokeDasharray={circ} strokeDashoffset={off}
                        style={{ transition:'stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1)' }}/>
                    </svg>
                    <div style={{
                      position:'absolute', inset:0, display:'flex', flexDirection:'column',
                      alignItems:'center', justifyContent:'center'
                    }}>
                      <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:22, color:t.text, lineHeight:1 }}>
                        {totCal}
                      </div>
                      <div style={{ fontSize:9, color:t.text3, letterSpacing:'.04em', marginTop:2 }}>
                        /{dayTarget} kcal
                      </div>
                    </div>
                  </div>
                );
              })()}
            </div>

            {/* Macro bars */}
            <div style={{ flex:1, display:'flex', flexDirection:'column', gap:10 }}>
              <MacroBar consumed={Math.round(totProt)} target={protTarget}
                color={t.accent} label="Protein" unit="g" theme={theme}/>
              <MacroBar consumed={Math.round(totCarb)} target={carbTarget}
                color='#0369A1' label="Carbs" unit="g" theme={theme}/>
              <MacroBar consumed={Math.round(totFat)} target={fatTarget}
                color='#6D4AAF' label="Fat" unit="g" theme={theme}/>
            </div>
          </div>

          {/* Remaining callout */}
          {(() => {
            const rem = dayTarget - totCal;
            const over = rem < 0;
            return (
              <div style={{
                marginTop:12, padding:'8px 12px', borderRadius:9,
                background: over ? '#BE3B2E12' : t.surface2,
                border:`1px solid ${over ? '#BE3B2E30' : t.border}`,
                display:'flex', justifyContent:'space-between', alignItems:'center'
              }}>
                <span style={{ fontSize:11, color:t.text2 }}>
                  {over ? 'Over by' : 'Remaining'}
                </span>
                <span style={{
                  fontFamily:"'DM Serif Display',serif", fontSize:18, lineHeight:1,
                  color: over ? '#BE3B2E' : t.green
                }}>
                  {Math.abs(rem)} kcal
                </span>
              </div>
            );
          })()}
        </div>

        {/* ── HEAVY SESSION BANNER ── */}
        {completedGymThisDay && isHeavyCompoundDay && (
          <div style={{
            padding:'10px 14px', borderRadius:12, marginBottom:10,
            background: t.accent + '12', border:`1px solid ${t.accent}30`,
            display:'flex', alignItems:'center', gap:10
          }}>
            <span style={{ fontSize:16 }}>💪</span>
            <div style={{ flex:1, fontSize:11.5, color:t.text2, lineHeight:1.45 }}>
              <span style={{ fontWeight:600, color:t.text }}>Big session today</span> — consider adding 200–300 extra kcal from carbs and protein.
            </div>
          </div>
        )}

        {/* ── COPY FROM YESTERDAY BANNER ── */}
        {(() => {
          const yesterday = foodAddDays(viewDate, -1);
          const yesterdayKey = foodDateKey(yesterday);
          const yesterdayEntries = foodLog[yesterdayKey]?.entries || [];
          if (entries.length === 0 && yesterdayEntries.length > 0) {
            return (
              <div style={{
                padding:'10px 14px', borderRadius:12, marginBottom:10,
                background: t.surface, border:`1px dashed ${t.border2}`,
                display:'flex', alignItems:'center', justifyContent:'space-between', gap:10
              }}>
                <div style={{ fontSize:11.5, color:t.text2 }}>
                  Nothing logged yet — copy from yesterday?
                </div>
                <button onClick={() => {
                  const copied = yesterdayEntries.map(e => ({ ...e, id: Date.now().toString() + Math.random(), time: new Date().toTimeString().slice(0,5) }));
                  if (onUpdateFood) onUpdateFood(vKey, copied);
                }} style={{
                  padding:'5px 11px', borderRadius:8, background:t.accent, color:t.accentText,
                  border:'none', fontFamily:t.sans, fontSize:11, fontWeight:600, cursor:'pointer', whiteSpace:'nowrap'
                }}>
                  Copy yesterday
                </button>
              </div>
            );
          }
          return null;
        })()}

        {/* ── MEAL SECTIONS ── */}
        {MEALS.map(meal => {
          const mealEntries = entries.filter(e => e.meal === meal.id);
          const mealCal  = mealEntries.reduce((s,e) => s + (e.calories||0), 0);
          const mealProt = mealEntries.reduce((s,e) => s + (e.protein||0), 0);
          return (
            <div key={meal.id} style={{
              background:t.surface, border:`1px solid ${t.border}`, borderRadius:18,
              marginBottom:10, overflow:'hidden'
            }}>
              {/* Meal header */}
              <div style={{
                display:'flex', alignItems:'center', justifyContent:'space-between',
                padding:'12px 14px 10px',
                borderBottom: mealEntries.length > 0 ? `1px solid ${t.border}` : 'none'
              }}>
                <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                  <span style={{ fontSize:15 }}>{meal.emoji}</span>
                  <div>
                    <div style={{ fontSize:13, color:t.text, fontWeight:500 }}>{meal.label}</div>
                    {mealCal > 0 && (
                      <div style={{ fontSize:10, color:t.text3, marginTop:1 }}>
                        {mealCal} kcal
                        {mealProt > 0 && <span style={{ marginLeft:5, color:meal.color }}>{Math.round(mealProt)}g protein</span>}
                      </div>
                    )}
                  </div>
                </div>
                <button onClick={() => { setAddMeal(meal.id); setSearch(''); setSelected(null); setGrams(''); setShowCustom(false); }} style={{
                  width:28, height:28, borderRadius:7, background:meal.color+'18',
                  border:`1px solid ${meal.color}30`, color:meal.color,
                  cursor:'pointer', fontSize:16, display:'flex',
                  alignItems:'center', justifyContent:'center', fontFamily:t.sans
                }}>+</button>
              </div>

              {/* Meal items */}
              {mealEntries.map((e, i) => (
                <div key={e.id} style={{
                  display:'flex', alignItems:'center', gap:10, padding:'9px 14px',
                  borderBottom: i < mealEntries.length-1 ? `1px solid ${t.border}` : 'none'
                }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:12.5, color:t.text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                      {e.name}
                    </div>
                    <div style={{ display:'flex', gap:8, marginTop:2, fontSize:10, color:t.text3 }}>
                      <span style={{ color:t.text2, fontFamily:"'JetBrains Mono',monospace" }}>{e.calories} kcal</span>
                      {e.protein > 0 && <span style={{ color:t.accent }}>P {Math.round(e.protein)}g</span>}
                      {e.carbs   > 0 && <span style={{ color:'#0369A1' }}>C {Math.round(e.carbs)}g</span>}
                      {e.fat     > 0 && <span style={{ color:'#6D4AAF' }}>F {Math.round(e.fat)}g</span>}
                    </div>
                  </div>
                  <button onClick={() => removeEntry(e.id)} style={{
                    width:24, height:24, borderRadius:5, background:'transparent',
                    border:`1px solid ${t.border}`, color:'#BE3B2E',
                    cursor:'pointer', fontSize:13, flexShrink:0
                  }}>×</button>
                </div>
              ))}

              {mealEntries.length === 0 && (
                <div style={{ padding:'10px 14px', fontSize:11, color:t.text3 }}>
                  Nothing logged for {meal.label.toLowerCase()} yet.
                </div>
              )}
            </div>
          );
        })}

        {/* ── WEEKLY OVERVIEW (collapsible) ── */}
        <button onClick={() => setShowWeekly(v => !v)} style={{
          width:'100%', display:'flex', alignItems:'center', justifyContent:'space-between',
          padding:'11px 14px', borderRadius:13,
          background:t.surface, border:`1px solid ${t.border}`,
          cursor:'pointer', fontFamily:t.sans, marginBottom:6
        }}>
          <span style={{ fontSize:12, color:t.text, fontWeight:500 }}>Weekly overview</span>
          <span style={{ fontSize:11, color:t.text3 }}>{showWeekly ? '▲' : '▼'}</span>
        </button>

        {showWeekly && (
          <div style={{
            background:t.surface, border:`1px solid ${t.border}`, borderRadius:16,
            padding:'14px 16px', marginBottom:12
          }}>
            {/* Week bars */}
            <div style={{ display:'flex', gap:5, alignItems:'flex-end', height:56, marginBottom:8 }}>
              {weekDays.map(day => {
                const pct = day.target > 0 ? Math.min(1.3, day.consumed / day.target) : 0;
                const barH = Math.max(2, pct * 44);
                let barCol = t.border;
                if (day.consumed > 0) {
                  const r = day.consumed / day.target;
                  barCol = r > 1.2 ? '#BE3B2E' : r > 1.08 ? '#B45309' : '#15803D';
                }
                const isViewing = day.key === vKey;
                return (
                  <div key={day.key} onClick={() => setViewDate(new Date(day.d))}
                    style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:4, cursor:'pointer' }}>
                    <div style={{ width:'100%', height:44, display:'flex', alignItems:'flex-end' }}>
                      <div style={{
                        width:'100%', height:barH, borderRadius:3, background:barCol,
                        outline: isViewing ? `2px solid ${t.accent}` : 'none', outlineOffset:1
                      }}/>
                    </div>
                    <div style={{ fontSize:9.5, color:day.isToday ? t.accent : t.text3, fontWeight:day.isToday ? 600 : 400 }}>
                      {day.label.slice(0,2)}
                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{ fontSize:10.5, color:t.text2 }}>
              Week total: <span style={{ fontWeight:500, color:t.text }}>
                {weekDays.reduce((s,d) => s+d.consumed, 0).toLocaleString()} kcal
              </span>
              {' '}/ target {weekDays.reduce((s,d) => s+d.target, 0).toLocaleString()} kcal
            </div>
          </div>
        )}
      </div>

      <BottomNav theme={theme} active="food" onNav={onNav} tracksCycle={tracksCycle}/>

      {/* ── ADD FOOD BOTTOM SHEET ── */}
      {addMeal && (
        <div style={{
          position:'absolute', inset:0, background:'rgba(0,0,0,.45)',
          display:'flex', alignItems:'flex-end', zIndex:50
        }} onClick={resetSheet}>
          <div onClick={(e) => e.stopPropagation()} style={{
            width:'100%', background:t.surface,
            borderTopLeftRadius:22, borderTopRightRadius:22,
            padding:'16px 20px 24px', maxHeight:'88%',
            display:'flex', flexDirection:'column'
          }}>
            <div style={{ width:38, height:4, background:t.border, borderRadius:99, margin:'0 auto 12px' }}/>

            {/* Sheet header */}
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
              <div>
                <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:18, color:t.text }}>
                  {MEALS.find(m => m.id === addMeal)?.emoji} Add to {MEALS.find(m => m.id === addMeal)?.label}
                </div>
              </div>
              <button onClick={() => setShowCustom(v => !v)} style={{
                padding:'4px 10px', borderRadius:7, background:'transparent',
                border:`1px solid ${t.border}`, color:t.text2,
                fontSize:10.5, cursor:'pointer', fontFamily:t.sans
              }}>
                {showCustom ? 'Search foods' : 'Custom entry'}
              </button>
            </div>

            {showCustom ? (
              // Custom entry form
              <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                <div style={{ fontSize:10.5, color:t.text2, marginBottom:2 }}>
                  Enter calories manually — useful for meals you've weighed yourself or restaurant food.
                </div>
                <input value={customName} onChange={(e) => setCustomName(e.target.value)}
                  placeholder="Food name (e.g. Nando's chicken wrap)"
                  style={{ padding:'10px 12px', borderRadius:10, border:`1px solid ${t.border}`,
                    background:t.surface2, fontFamily:t.sans, fontSize:13, color:t.text, outline:'none' }}
                />
                <div style={{ display:'flex', gap:8 }}>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:10, color:t.text3, marginBottom:4 }}>Calories (kcal)*</div>
                    <input value={customCal} type="number"
                      onChange={(e) => setCustomCal(e.target.value)}
                      style={{ width:'100%', padding:'10px 12px', borderRadius:10,
                        border:`1px solid ${t.border}`, background:t.surface2,
                        fontFamily:"'JetBrains Mono',monospace", fontSize:13, color:t.text, outline:'none' }}
                    />
                  </div>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:10, color:t.text3, marginBottom:4 }}>Protein (g, optional)</div>
                    <input value={customProt} type="number"
                      onChange={(e) => setCustomProt(e.target.value)}
                      style={{ width:'100%', padding:'10px 12px', borderRadius:10,
                        border:`1px solid ${t.border}`, background:t.surface2,
                        fontFamily:"'JetBrains Mono',monospace", fontSize:13, color:t.text, outline:'none' }}
                    />
                  </div>
                </div>
                <button onClick={confirmCustom} disabled={!customCal || Number(customCal) <= 0} style={{
                  padding:'13px', borderRadius:12, border:'none', fontFamily:t.sans,
                  fontSize:13, fontWeight:600, cursor: customCal ? 'pointer' : 'default',
                  background: customCal ? t.accent : t.surface2,
                  color: customCal ? t.accentText : t.text3
                }}>Log food</button>
              </div>

            ) : selected ? (
              // Portion selector for a chosen food
              <div>
                <div style={{
                  background:t.surface2, border:`1px solid ${t.border}`, borderRadius:12,
                  padding:'12px 14px', marginBottom:14
                }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
                    <div>
                      <div style={{ fontSize:14, color:t.text, fontWeight:500 }}>{selected.name}</div>
                      <div style={{ fontSize:10.5, color:t.text3 }}>{selected.cat} · {selected.cal} kcal per 100g</div>
                    </div>
                    <button onClick={() => { setSelected(null); setGrams(''); }} style={{
                      width:24, height:24, borderRadius:6, background:'transparent',
                      border:`1px solid ${t.border}`, color:t.text3, cursor:'pointer', fontSize:13
                    }}>‹</button>
                  </div>
                </div>

                <div style={{ marginBottom:12 }}>
                  <div style={{ fontSize:10.5, color:t.text2, marginBottom:6 }}>
                    Portion size (grams)
                  </div>
                  <div style={{ display:'flex', gap:6, marginBottom:10 }}>
                    {[selected.defaultG, Math.round(selected.defaultG * 0.5), Math.round(selected.defaultG * 1.5)].map(g => (
                      <button key={g} onClick={() => setGrams(String(g))} style={{
                        flex:1, padding:'9px 0', borderRadius:9,
                        background: grams === String(g) ? t.accent : t.surface2,
                        color: grams === String(g) ? t.accentText : t.text2,
                        border:`1px solid ${grams === String(g) ? t.accent : t.border}`,
                        fontFamily:"'JetBrains Mono',monospace", fontSize:13, cursor:'pointer'
                      }}>{g}g</button>
                    ))}
                  </div>
                  <input value={grams} type="number"
                    onChange={(e) => setGrams(e.target.value)}
                    placeholder="Or enter grams..."
                    style={{ width:'100%', padding:'10px 12px', borderRadius:10,
                      border:`1px solid ${t.border}`, background:t.surface2,
                      fontFamily:"'JetBrains Mono',monospace", fontSize:13, color:t.text, outline:'none' }}
                  />
                </div>

                {grams && Number(grams) > 0 && (() => {
                  const n = calcNutrition(selected, grams);
                  return (
                    <div style={{
                      display:'flex', gap:8, marginBottom:14,
                      padding:'10px 12px', borderRadius:10,
                      background:t.surface2, border:`1px solid ${t.border}`
                    }}>
                      {[
                        { label:'kcal', val:n.calories, color:t.text },
                        { label:'prot', val:n.protein+'g', color:t.accent },
                        { label:'carbs', val:n.carbs+'g', color:'#0369A1' },
                        { label:'fat', val:n.fat+'g', color:'#6D4AAF' },
                      ].map(m => (
                        <div key={m.label} style={{ flex:1, textAlign:'center' }}>
                          <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:16, color:m.color }}>{m.val}</div>
                          <div style={{ fontSize:9.5, color:t.text3, marginTop:2 }}>{m.label}</div>
                        </div>
                      ))}
                    </div>
                  );
                })()}

                <button onClick={confirmAdd} disabled={!grams || Number(grams) <= 0} style={{
                  width:'100%', padding:'13px', borderRadius:12, border:'none',
                  fontFamily:t.sans, fontSize:13, fontWeight:600,
                  cursor: grams ? 'pointer' : 'default',
                  background: grams ? t.accent : t.surface2,
                  color: grams ? t.accentText : t.text3
                }}>Add to {MEALS.find(m => m.id === addMeal)?.label}</button>
              </div>

            ) : (
              // Food search list
              <div style={{ display:'flex', flexDirection:'column', flex:1, minHeight:0 }}>
                <div style={{ position:'relative', marginBottom:10 }}>
                  <input
                    autoFocus value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="Search foods or category…"
                    style={{ width:'100%', padding:'10px 36px 10px 12px', borderRadius:10,
                      border:`1px solid ${t.border}`, background:t.surface2,
                      fontFamily:t.sans, fontSize:13, color:t.text, outline:'none' }}
                  />
                  {search && (
                    <button onClick={() => setSearch('')} style={{
                      position:'absolute', right:10, top:'50%', transform:'translateY(-50%)',
                      background:'transparent', border:'none', color:t.text3, cursor:'pointer', fontSize:16
                    }}>×</button>
                  )}
                </div>

                <div style={{ overflowY:'auto', flex:1 }}>
                  {filteredDB.map((food, i) => (
                    <button key={food.id} onClick={() => { setSelected(food); setGrams(String(food.defaultG)); }} style={{
                      width:'100%', display:'flex', alignItems:'center', justifyContent:'space-between',
                      padding:'10px 12px', borderRadius:10, textAlign:'left',
                      background: i % 2 === 0 ? t.surface2 : 'transparent',
                      border:`1px solid ${t.border}`, marginBottom:5,
                      cursor:'pointer', fontFamily:t.sans
                    }}>
                      <div>
                        <div style={{ fontSize:13, color:t.text }}>{food.name}</div>
                        <div style={{ fontSize:10, color:t.text3, marginTop:2 }}>
                          {food.cat} · {food.cal} kcal · {food.p}g protein per 100g
                        </div>
                      </div>
                      <span style={{ fontSize:14, color:t.text3 }}>›</span>
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

window.FoodScreen = FoodScreen;

</script>

<script type="text/babel" data-presets="react">
// screen-about.jsx
// "About Me" screen — profile, training defaults, calorie settings, connected apps.
// Accessed via the gear icon on the Home screen header.
//
// Props:
//   profile       — user profile from App state
//   userSettings  — { dailyCaloriesBase, gymDayBoost } from App state
//   plan          — training plan from App state
//   onSaveProfile — (updatedProfile) => void
//   onSaveSettings — (updatedSettings) => void
//   onBack, onNav, tracksCycle

const CONNECTED_SERVICES = [
  { id: 'strava',   name: 'Strava',       scope: 'Runs · Rides · Workouts',  color: '#FC5200', glyph: 'S' },
  { id: 'apple',    name: 'Apple Health', scope: 'Steps · Sleep · Weight',   color: '#000',    glyph: 'A' },
  { id: 'oura',     name: 'Oura',         scope: 'Sleep · HRV · Recovery',   color: '#1C1917', glyph: 'O' },
  { id: 'mfp',      name: 'MyFitnessPal', scope: 'Meals · Macros · Calories',color: '#0072CE', glyph: 'M' },
  { id: 'garmin',   name: 'Garmin',       scope: 'Workouts · HR · GPS',      color: '#007CC3', glyph: 'G' },
  { id: 'flo',      name: 'Flo',          scope: 'Period & cycle history',   color: '#E85DA1', glyph: 'F' },
];

const GOAL_LABELS = {
  strength: 'Build strength',
  muscle: 'Build muscle',
  'fat-loss': 'Lose fat',
  active: 'Stay active',
  flexibility: 'Mobility & flow',
};

// Simple editable field row
function FieldRow({ label, value, unit, type = 'number', step, onChange, theme }) {
  const t = themes[theme];
  const [editing, setEditing] = React.useState(false);
  const [local, setLocal] = React.useState(String(value));

  const commit = () => {
    const v = type === 'number' ? Number(local) : local;
    if (type === 'number' && !isNaN(v) && v > 0) onChange(v);
    else if (type === 'text' && local.trim()) onChange(local.trim());
    setEditing(false);
  };

  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '11px 0', borderBottom: `1px solid ${t.border}`,
    }}>
      <span style={{ fontSize: 13, color: t.text }}>{label}</span>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        {editing ? (
          <>
            <input
              autoFocus
              value={local}
              type={type}
              step={step}
              onChange={(e) => setLocal(e.target.value)}
              onBlur={commit}
              onKeyDown={(e) => e.key === 'Enter' && commit()}
              style={{
                width: 80, padding: '4px 8px', borderRadius: 7,
                border: `1px solid ${t.accent}`, background: t.surface2,
                fontFamily: t.mono, fontSize: 13, color: t.text, outline: 'none',
                textAlign: 'right',
              }}
            />
            {unit && <span style={{ fontSize: 11, color: t.text3 }}>{unit}</span>}
          </>
        ) : (
          <>
            <span style={{ fontFamily: t.mono, fontSize: 13, color: t.text2 }}>
              {value}{unit ? ` ${unit}` : ''}
            </span>
            <button onClick={() => { setLocal(String(value)); setEditing(true); }} style={{
              padding: '3px 8px', borderRadius: 6, background: 'transparent',
              border: `1px solid ${t.border}`, color: t.accent,
              fontSize: 10, fontWeight: 600, cursor: 'pointer', fontFamily: t.sans,
            }}>Edit</button>
          </>
        )}
      </div>
    </div>
  );
}

// Section card wrapper
function Section({ title, children, theme }) {
  const t = themes[theme];
  return (
    <div style={{
      background: t.surface, border: `1px solid ${t.border}`, borderRadius: 18,
      padding: '14px 16px', marginBottom: 12,
    }}>
      <div style={{
        fontSize: 10, letterSpacing: '.14em', textTransform: 'uppercase',
        color: t.text3, marginBottom: 10, fontWeight: 500,
      }}>
        {title}
      </div>
      {children}
    </div>
  );
}

function AboutScreen({
  width = 390, height = 820, theme = 'light',
  profile = {}, userSettings = {}, plan = {},
  onSaveProfile, onSaveSettings,
  onBack, onNav, onSignOut, tracksCycle = true,
}) {
  const t = themes[theme];

  const [localProfile, setLP] = React.useState({ ...profile });
  const [localSettings, setLS] = React.useState({
    dailyCaloriesBase: userSettings.dailyCaloriesBase || 1500,
    gymDayBoost: userSettings.gymDayBoost || 250,
    weightUnit: userSettings.weightUnit || 'kg',
    heightUnit: userSettings.heightUnit || 'cm',
    ...userSettings,
  });

  // Simulated connected state — in production this would be OAuth status
  const [connected, setConnected] = React.useState(
    new Set(profile.connected || [])
  );

  const updateProfile = (key, val) => {
    const updated = { ...localProfile, [key]: val };
    setLP(updated);
    if (onSaveProfile) onSaveProfile(updated);
  };

  const updateSettings = (key, val) => {
    const updated = { ...localSettings, [key]: val };
    setLS(updated);
    if (onSaveSettings) onSaveSettings(updated);
  };

  const toggleService = (id) => {
    const next = new Set(connected);
    if (next.has(id)) next.delete(id);
    else next.add(id);
    setConnected(next);
    updateProfile('connected', [...next]);
  };

  const goals = ['strength', 'muscle', 'fat-loss', 'active', 'flexibility'];

  return (
    <div style={{
      width, height, background: t.bg, fontFamily: t.sans, color: t.text,
      display: 'flex', flexDirection: 'column', overflow: 'hidden', position: 'relative',
    }}>
      {/* Status bar */}
      <div style={{
        height: 44, display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between',
        padding: '0 22px 8px', fontSize: 14, fontWeight: 600, color: t.text,
      }}>
        <span>9:41</span>
        <div style={{ display: 'flex', gap: 5, alignItems: 'center', fontSize: 11 }}>
          <span>●●●</span><span>📶</span><span>🔋</span>
        </div>
      </div>

      {/* Header bar */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 12,
        padding: '2px 16px 12px', borderBottom: `1px solid ${t.border}`,
      }}>
        <button onClick={onBack} style={{
          width: 32, height: 32, borderRadius: 9, background: 'transparent',
          border: `1px solid ${t.border}`, color: t.text, cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14,
        }}>←</button>
        <div style={{ fontFamily: t.serif, fontSize: 20, color: t.text }}>About me</div>
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '14px 18px 16px' }} className="phone-scroll">

        {/* Profile avatar + name */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 16 }}>
          <div style={{
            width: 56, height: 56, borderRadius: '50%',
            background: `linear-gradient(135deg, ${t.accent}, #6D4AAF)`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontFamily: t.serif, fontSize: 24, color: '#fff', flexShrink: 0,
          }}>
            {(localProfile.name || 'U').charAt(0)}
          </div>
          <div>
            <div style={{ fontFamily: t.serif, fontSize: 22, color: t.text, lineHeight: 1 }}>
              {localProfile.name || 'Your name'}
            </div>
            <div style={{ fontSize: 11, color: t.text3, marginTop: 3 }}>
              {GOAL_LABELS[localProfile.goal] || 'No goal set'}
              {' · '}
              {plan.splitDays || 3}-day split
            </div>
          </div>
        </div>

        {/* Body stats */}
        <Section title="Body stats" theme={theme}>
          <FieldRow label="Name" value={localProfile.name || ''} type="text"
            onChange={(v) => updateProfile('name', v)} theme={theme} />
          <FieldRow label="Age" value={localProfile.age || 30} unit="years"
            onChange={(v) => updateProfile('age', v)} theme={theme} />
          <FieldRow label="Height" value={localProfile.height || 168}
            unit={localSettings.heightUnit} step={1}
            onChange={(v) => updateProfile('height', v)} theme={theme} />
          <FieldRow label="Weight" value={localProfile.weight || 65}
            unit={localSettings.weightUnit} step={0.1}
            onChange={(v) => updateProfile('weight', v)} theme={theme} />
          {/* Unit toggle */}
          <div style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '11px 0',
          }}>
            <span style={{ fontSize: 13, color: t.text }}>Units</span>
            <div style={{ display: 'flex', gap: 5 }}>
              {['kg / cm', 'lbs / ft'].map((u, i) => {
                const isMetric = i === 0;
                const active = isMetric ? localSettings.weightUnit === 'kg' : localSettings.weightUnit === 'lbs';
                return (
                  <button key={u} onClick={() => {
                    updateSettings('weightUnit', isMetric ? 'kg' : 'lbs');
                    updateSettings('heightUnit', isMetric ? 'cm' : 'ft');
                  }} style={{
                    padding: '4px 9px', borderRadius: 7,
                    background: active ? t.text : 'transparent',
                    color: active ? '#fff' : t.text2,
                    border: `1px solid ${active ? t.text : t.border}`,
                    fontSize: 10.5, cursor: 'pointer', fontFamily: t.sans, fontWeight: 500,

          </div>
          <FieldRow label="Daily base" value={localSettings.dailyCaloriesBase}

          </div>
        </Section>

        {/* Default split */}
        <Section title="Default training split" theme={theme}>
          <div style={{ fontSize: 11, color: t.text2, marginBottom: 10, lineHeight: 1.5 }}>

          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 6 }}>
            {[1, 2, 3, 4, 5].map(n => {

          <div style={{ marginTop: 8, fontSize: 11, color: t.text3 }}>

                  color: isOn ? '#fff' : t.text3,

                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, color: t.text, fontWeight: 500 }}>{svc.name}</div>
                  <div style={{ fontSize: 10.5, color: t.text3 }}>{svc.scope}</div>
                </div>
                <button onClick={() => toggleService(svc.id)} style={{
                  padding: '5px 12px', borderRadius: 8,

          })}
        </Section>

        {/* App info + sign out */}
        <div style={{
          textAlign: 'center', padding: '8px 0 16px',
          fontSize: 10.5, color: t.text3, lineHeight: 1.6,
        }}>
          Forma · v2.0 · Data stored in your Google Drive
        </div>

        {onSignOut && (
          <button onClick={onSignOut} style={{
            width: '100%', padding: '13px 0', borderRadius: 14,
            background: 'transparent',
            border: `1px solid ${theme === 'dark' ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.1)'}`,
            color: '#BE3B2E', fontFamily: t.sans, fontSize: 14, fontWeight: 500,
            cursor: 'pointer', marginBottom: 8,
          }}>
            Sign out
          </button>
        )}
      </div>
    </div>
  );
}

window.AboutScreen = AboutScreen;

</script>

<script type="text/babel" data-presets="react">

// ─────────────────────────────────────────────────────────────────────────────
// AuthScreen
// Full-screen sign-in gate. Uses Google Identity Services One Tap / button.
// On success calls onAuthSuccess({ googleUser, accessToken, driveData }).
// ─────────────────────────────────────────────────────────────────────────────
function AuthScreen({ theme = 'light', onAuthSuccess }) {
  const accent = '#BE5A38';
  const bg     = theme === 'dark' ? '#111114' : '#F5F2ED';
  const card   = theme === 'dark' ? '#1C1C22' : '#FFFFFF';
  const text   = theme === 'dark' ? '#F0EDE8' : '#1C1917';
  const text2  = theme === 'dark' ? '#9A9398' : '#6B6560';

  const [status, setStatus] = React.useState('idle'); // idle | signing-in | loading-data | error
  const [error,  setError]  = React.useState('');
  const btnRef = React.useRef(null);

  // Render the official Google button once GIS has loaded
  React.useEffect(() => {
    if (!btnRef.current) return;
    const tryRender = () => {
      if (typeof google === 'undefined' || !google.accounts) {
        setTimeout(tryRender, 300);
        return;
      }
      if (GOOGLE_CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com') return;
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
        auto_select: false,
      });
      google.accounts.id.renderButton(btnRef.current, {
        theme: theme === 'dark' ? 'filled_black' : 'outline',
        size: 'large',
        width: 280,
        text: 'continue_with',
        logo_alignment: 'left',
      });
    };
    tryRender();
  }, [theme]);

  // Called by GIS with an ID token after the user picks their Google account
  const handleCredentialResponse = async (response) => {
    setStatus('signing-in');
    setError('');
    try {
      // Decode ID token to get identity (name, email, picture, sub)
      const payload = decodeJwtPayload(response.credential);
      const identity = {
        id:      payload.sub,
        email:   payload.email,
        name:    payload.name,
        picture: payload.picture,
      };
      setCachedIdentity(identity);

      // Now request an access token for Drive (may show consent screen on first use)
      setStatus('loading-data');
      const accessToken = await requestAccessToken();

      // Load existing Forma data from Drive (or null if first login)
      const driveData = await driveRead(accessToken);

      onAuthSuccess({ identity, accessToken, driveData });
    } catch (err) {
      console.error('Auth error', err);
      setError('Sign-in failed. Please try again.');
      setStatus('error');
    }
  };

  // Manual "Continue with Google" button — triggers the token client directly
  // (fallback if One Tap was dismissed or GIS button didn't render)
  const handleManualSignIn = async () => {
    setStatus('signing-in');
    setError('');
    try {
      const accessToken = await requestAccessToken();
      const identity = getCachedIdentity() || { id: 'unknown', email: '', name: 'User', picture: null };
      const driveData = await driveRead(accessToken);
      onAuthSuccess({ identity, accessToken, driveData });
    } catch (err) {
      setError('Sign-in failed. Make sure pop-ups are allowed for this page.');
      setStatus('error');
    }
  };

  const isLoading = status === 'signing-in' || status === 'loading-data';

  return (
    <div style={{
      width: '100%', height: '100%', background: bg,
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      padding: '0 28px', boxSizing: 'border-box',
    }}>
      {/* Wordmark */}
      <div style={{ textAlign: 'center', marginBottom: 48 }}>
        <div style={{
          fontFamily: 'DM Serif Display, serif',
          fontSize: 52, color: accent, letterSpacing: '-0.02em', lineHeight: 1,
        }}>Forma</div>
        <div style={{
          fontSize: 12, color: text2, marginTop: 8,
          letterSpacing: '.12em', textTransform: 'uppercase',
        }}>
          Personal Health Tracker
        </div>
      </div>

      {/* Card */}
      <div style={{
        width: '100%', background: card, borderRadius: 24,
        padding: '32px 24px', boxSizing: 'border-box', textAlign: 'center',
        boxShadow: theme === 'dark'
          ? '0 8px 40px rgba(0,0,0,.5)'
          : '0 4px 32px rgba(0,0,0,.08)',
      }}>
        <div style={{ fontSize: 16, fontWeight: 600, color: text, marginBottom: 6 }}>
          Welcome back
        </div>
        <div style={{ fontSize: 13, color: text2, marginBottom: 28, lineHeight: 1.5 }}>
          Sign in with your Google account to access your health data — stored privately in your own Google Drive.
        </div>

        {/* GIS renders its own button here */}
        {!isLoading && (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
            <div ref={btnRef} />

            {/* Fallback manual button */}
            <button onClick={handleManualSignIn} style={{
              padding: '11px 24px', borderRadius: 10,
              background: 'transparent',
              border: `1px solid ${theme === 'dark' ? 'rgba(255,255,255,.15)' : 'rgba(0,0,0,.12)'}`,
              color: text2, fontSize: 13, cursor: 'pointer',
              fontFamily: 'DM Sans, sans-serif',
            }}>
              Continue with Google ↗
            </button>
          </div>
        )}

        {/* Loading state */}
        {isLoading && (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
            <div style={{
              width: 28, height: 28, border: `2.5px solid ${accent}`,
              borderTopColor: 'transparent', borderRadius: '50%',
              animation: 'spin 0.8s linear infinite',
            }} />
            <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
            <div style={{ fontSize: 13, color: text2 }}>
              {status === 'signing-in' ? 'Connecting to Google…' : 'Loading your data…'}
            </div>
          </div>
        )}

        {/* Error */}
        {error && (
          <div style={{
            marginTop: 16, padding: '10px 14px', borderRadius: 10,
            background: 'rgba(190,58,46,.1)', border: '1px solid rgba(190,58,46,.2)',
            color: '#BE3B2E', fontSize: 13, lineHeight: 1.4,
          }}>
            {error}
          </div>
        )}
      </div>

      {/* Config warning */}
      {GOOGLE_CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com' && (
        <div style={{
          marginTop: 20, padding: '12px 16px', borderRadius: 12,
          background: 'rgba(190,90,56,.12)', border: '1px solid rgba(190,90,56,.25)',
          color: accent, fontSize: 12, lineHeight: 1.5, textAlign: 'center',
        }}>
          ⚠️ Replace <code>GOOGLE_CLIENT_ID</code> in index.html with your OAuth Client ID to enable sign-in.
        </div>
      )}

      {/* Privacy note */}
      <div style={{
        marginTop: 20, fontSize: 11, color: text2,
        textAlign: 'center', lineHeight: 1.6, maxWidth: 280,
      }}>
        Your data is saved to a private folder in your own Google Drive. Forma cannot see other files in your Drive.
      </div>
    </div>
  );
}

window.AuthScreen = AuthScreen;
</script>

<!-- ─── App() root ────────────────────────────────────────────────────────── -->
<script type="text/babel" data-presets="react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "accent": "#BE5A38",
  "showOnboarding": false
}/*EDITMODE-END*/;

// ─────────────────────────────────────────────────────────────────────────────
// Default values for a brand-new profile
// ─────────────────────────────────────────────────────────────────────────────
const EMPTY_PROFILE = {
  name: '', age: 30, sex: '', tracksCycle: null,
  height: 168, weight: 65, goal: '', connected: [], splitDays: 3,
};
const DEFAULT_SETTINGS = {
  dailyCaloriesBase: 1500,
  gymDayBoost: 250,
  weightUnit: 'kg',
  heightUnit: 'cm',
};
const DEFAULT_PLAN = { splitDays: 3, todayIdx: 0, overrides: {} };

// ─────────────────────────────────────────────────────────────────────────────
// Splash screen — shown while checking for a cached session on load
// ─────────────────────────────────────────────────────────────────────────────
function SplashScreen({ theme = 'light', userName }) {
  const bg     = theme === 'dark' ? '#111114' : '#F5F2ED';
  const accent = '#BE5A38';
  const text2  = theme === 'dark' ? '#9A9398' : '#6B6560';
  return (
    <div style={{
      width: '100%', height: '100%', background: bg,
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center', gap: 20,
    }}>
      <div style={{ fontFamily: 'DM Serif Display, serif', fontSize: 48, color: accent, letterSpacing: '-0.02em' }}>
        Forma
      </div>
      <div style={{
        width: 28, height: 28, border: `2.5px solid ${accent}`,
        borderTopColor: 'transparent', borderRadius: '50%',
        animation: 'spin 0.8s linear infinite',
      }} />
      <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
      {userName && (
        <div style={{ fontSize: 13, color: text2 }}>Welcome back, {userName}</div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// App — root component
// ─────────────────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // ── Auth / loading state ─────────────────────────────────────────────────
  // 'loading'     = checking for cached session on startup
  // 'unauthenticated' = no session, show AuthScreen
  // 'ready'       = signed in, app is usable
  const [authState, setAuthState]   = React.useState('loading');
  const [accessToken, setAccessToken] = React.useState(null);
  const [identity, setIdentity]     = React.useState(null); // { id, name, email, picture }
  const [syncStatus, setSyncStatus] = React.useState('idle'); // idle | saving | error

  // ── App state ────────────────────────────────────────────────────────────
  const [screen, setScreen]               = React.useState('home');
  const [profile, setProfileRaw]          = React.useState(EMPTY_PROFILE);
  const [onboardingActive, setOnboarding] = React.useState(false);
  const [plan, setPlanRaw]                = React.useState(DEFAULT_PLAN);
  const [userSettings, setSettingsRaw]    = React.useState(DEFAULT_SETTINGS);
  const [editingDayId, setEditingDayId]   = React.useState(null);
  const [editingDayIdx, setEditingDayIdx] = React.useState(null);
  const [activities, setActivities]       = React.useState({});
  const [session, setSession]             = React.useState({
    active: false, paused: false, elapsed: 0, workout: '', queue: null,
  });
  const [lastSession, setLastSession]             = React.useState(null);
  const [completedSessions, setCompletedSessions] = React.useState([]);
  const [foodLog, setFoodLog]                     = React.useState({});

  // ── Startup: check for a cached access token ─────────────────────────────
  // If the user signed in before and the token is still valid (< 1 hour old,
  // stored in sessionStorage), skip the sign-in screen entirely.
  React.useEffect(() => {
    const cachedToken    = getCachedToken();
    const cachedIdentity = getCachedIdentity();
    if (cachedToken && cachedIdentity) {
      setAccessToken(cachedToken);
      setIdentity(cachedIdentity);
      // Load data from Drive in the background; use local cache instantly
      const cached = loadFromCache();
      if (cached) hydrateState(cached);
      driveRead(cachedToken)
        .then(data => { if (data) { hydrateState(data); saveToCache(data); } })
        .catch(() => {})
        .finally(() => setAuthState('ready'));
    } else {
      setAuthState('unauthenticated');
    }
  }, []);

  // ── Hydrate all state from a Forma data object (Drive or cache) ──────────
  const hydrateState = (data) => {
    if (!data) return;
    if (data.profile)           setProfileRaw(data.profile);
    if (data.plan)              setPlanRaw(data.plan);
    if (data.userSettings)      setSettingsRaw(data.userSettings);
    if (data.completedSessions) setCompletedSessions(data.completedSessions);
    if (data.foodLog)           setFoodLog(data.foodLog);
    if (data.activities)        setActivities(data.activities);
    setOnboarding(!data.profile || !data.profile.name);
  };

  // ── Build the full data snapshot for saving ──────────────────────────────
  const buildSnapshot = (overrides = {}) => ({
    profile, plan, userSettings,
    completedSessions, foodLog, activities,
    savedAt: new Date().toISOString(),
    ...overrides,
  });

  // ── Debounced Drive save triggered whenever key state changes ────────────
  const tokenRef = React.useRef(accessToken);
  React.useEffect(() => { tokenRef.current = accessToken; }, [accessToken]);

  const scheduleSave = React.useCallback((overrides = {}) => {
    if (!tokenRef.current) return;
    setSyncStatus('saving');
    const snapshot = buildSnapshot(overrides);
    saveToCache(snapshot);
    scheduleDriveSave(tokenRef.current, snapshot);
    // Visual feedback: reset to idle after debounce + write time
    setTimeout(() => setSyncStatus('idle'), 4000);
  }, [profile, plan, userSettings, completedSessions, foodLog, activities]);

  // ── Wrapped setters that auto-save ───────────────────────────────────────
  const setProfile = (updater) => {
    setProfileRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : { ...prev, ...updater };
      setTimeout(() => scheduleSave({ profile: next }), 0);
      return next;
    });
  };
  const setPlan = (updater) => {
    setPlanRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      setTimeout(() => scheduleSave({ plan: next }), 0);
      return next;
    });
  };
  const setUserSettings = (updater) => {
    setSettingsRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : { ...prev, ...updater };
      setTimeout(() => scheduleSave({ userSettings: next }), 0);
      return next;
    });
  };

  // ── Auth success callback from AuthScreen ────────────────────────────────
  const handleAuthSuccess = ({ identity: id, accessToken: token, driveData }) => {
    setIdentity(id);
    setAccessToken(token);
    if (driveData) {
      hydrateState(driveData);
      saveToCache(driveData);
    } else {
      // First time — no data in Drive yet → run onboarding
      setOnboarding(true);
    }
    setAuthState('ready');
  };

  // ── Sign out ─────────────────────────────────────────────────────────────
  const signOut = () => {
    if (typeof google !== 'undefined' && google.accounts) {
      google.accounts.id.disableAutoSelect();
    }
    clearCachedToken();
    clearCachedIdentity();
    _driveFileId = null;
    setAccessToken(null);
    setIdentity(null);
    setProfileRaw(EMPTY_PROFILE);
    setPlanRaw(DEFAULT_PLAN);
    setSettingsRaw(DEFAULT_SETTINGS);
    setCompletedSessions([]);
    setFoodLog({});
    setActivities({});
    setSession({ active: false, paused: false, elapsed: 0, workout: '', queue: null });
    setAuthState('unauthenticated');
    setScreen('home');
  };

  // ── Session timer ────────────────────────────────────────────────────────
  React.useEffect(() => {
    if (!session.active || session.paused) return;
    const id = setInterval(() => setSession(s => ({ ...s, elapsed: s.elapsed + 1 })), 1000);
    return () => clearInterval(id);
  }, [session.active, session.paused]);

  // ── Theme sync ───────────────────────────────────────────────────────────
  React.useEffect(() => {
    document.body.setAttribute('data-theme', tweaks.theme);
  }, [tweaks.theme]);

  // ── Session helpers ──────────────────────────────────────────────────────
  const startSession = () => {
    const split = SPLITS[plan.splitDays] || SPLITS[3];
    if (!split || !split.days || !split.days.length) return;
    const today = split.days[(plan.todayIdx || 0) % split.days.length];
    setSession(s => ({ ...s, active: true, paused: false, elapsed: 0, workout: today.name + ' day', queue: null }));
    setScreen('gym-session');
  };
  const finishSession = (final) => {
    const completed = { ...session, ...final, id: Date.now().toString(), date: new Date().toISOString(), endedAt: Date.now() };
    setLastSession(completed);
    setCompletedSessions(prev => {
      const next = [...prev, completed];
      setTimeout(() => scheduleSave({ completedSessions: next }), 0);
      return next;
    });
    setScreen('gym-summary');
  };
  const closeSummary = () => {
    setSession({ active: false, paused: false, elapsed: 0, workout: '', queue: null });
    setScreen('home');
  };
  const deleteSession = (id) => setCompletedSessions(prev => {
    const next = prev.filter(s => s.id !== id);
    setTimeout(() => scheduleSave({ completedSessions: next }), 0);
    return next;
  });
  const viewSummary = (sessionData) => { setLastSession(sessionData); setScreen('gym-summary'); };

  // ── Food ─────────────────────────────────────────────────────────────────
  const updateFood = (dateKey, entries) => setFoodLog(prev => {
    const next = { ...prev, [dateKey]: { entries } };
    setTimeout(() => scheduleSave({ foodLog: next }), 0);
    return next;
  });

  // ── Navigation ───────────────────────────────────────────────────────────
  const navigate = (target) => {
    if (target === 'gym') setScreen(session.active ? 'gym-session' : 'gym-hub');
    else setScreen(target);
  };

  // ── Onboarding complete ──────────────────────────────────────────────────
  const completeOnboarding = (newProfile) => {
    setProfile(newProfile);
    setPlan({ splitDays: newProfile.splitDays || 3, todayIdx: 0, overrides: {} });
    setUserSettings(DEFAULT_SETTINGS);
    setOnboarding(false);
    setScreen('home');
  };

  // ── Sync status indicator ────────────────────────────────────────────────
  // A small cloud icon shown in the label bar below the phone frame
  const syncLabel = syncStatus === 'saving' ? '↑ Saving…' : syncStatus === 'error' ? '⚠ Sync error' : '✓ Saved';

  // ── Render gates ─────────────────────────────────────────────────────────
  if (authState === 'loading') {
    const cached = getCachedIdentity();
    return (
      <div className="stage">
        <div className="phone-frame">
          <div className="phone-notch"/>
          <div className="phone-inner">
            <SplashScreen theme={tweaks.theme} userName={cached && cached.name} />
          </div>
        </div>
        <div className="label">Forma · Loading</div>
      </div>
    );
  }

  if (authState === 'unauthenticated') {
    return (
      <div className="stage">
        <div className="phone-frame">
          <div className="phone-notch"/>
          <div className="phone-inner">
            <AuthScreen theme={tweaks.theme} onAuthSuccess={handleAuthSuccess} />
          </div>
        </div>
        <div className="label">Forma · Sign in</div>
      </div>
    );
  }

  // ── Main app render ───────────────────────────────────────────────────────
  const renderScreen = (s) => {
    if (onboardingActive)
      return <OnboardingScreen width={374} height={804} theme={tweaks.theme}
               onComplete={completeOnboarding}
               initial={EMPTY_PROFILE} />;
    if (s === 'home')
      return <RefinedHome width={374} height={804} theme={tweaks.theme}
               profile={profile}
               plan={plan}
               completedSessions={completedSessions}
               onNav={navigate}
               onStartSession={startSession}
               activeSession={session.active ? session : null}
               onResumeSession={() => setScreen('gym-session')}
               onOpenAbout={() => setScreen('about-me')} />;
    if (s === 'gym-hub')
      return <GymHubScreen width={374} height={804} theme={tweaks.theme}
               plan={plan}
               todayIdx={plan.todayIdx}
               dayOfWeek={new Date().getDay() === 0 ? 6 : new Date().getDay() - 1}
               activities={activities}
               completedSessions={completedSessions}
               activeSession={session.active ? session : null}
               tracksCycle={profile.tracksCycle}
               onNav={navigate}
               onStartSession={startSession}
               onResumeSession={() => setScreen('gym-session')}
               onChangeSplit={() => setScreen('gym-split')}
               onEditDay={(dayId) => { setEditingDayId(dayId); setTimeout(() => setScreen('gym-edit'), 0); }}
               onSelectDay={(i) => { setPlan(p => ({ ...p, todayIdx: i })); }}
               onTapDay={(dayIdx) => { setEditingDayIdx(dayIdx); setScreen('gym-day'); }}
               onBrowseLibrary={() => setScreen('gym-library')}
               onViewSummary={viewSummary}
               onDeleteSession={deleteSession}
               onReorderSchedule={(newSched) => setPlan(p => ({ ...p, scheduleOverride: newSched }))} />;
    if (s === 'gym-split')
      return <SplitPickerScreen width={374} height={804} theme={tweaks.theme}
               plan={plan}
               tracksCycle={profile.tracksCycle}
               onBack={() => setScreen('gym-hub')}
               onSave={(d) => { setPlan(p => ({ ...p, splitDays: d, todayIdx: 0 })); setScreen('gym-hub'); }}
               onNav={navigate} />;
    if (s === 'gym-edit') {
      const split = SPLITS[plan.splitDays] || SPLITS[3];
      if (!split) return null;
      const fallbackId = split.days[0].id;
      const resolvedDayId = editingDayId || fallbackId;
      if (!resolvedDayId) return null;
      return <SessionEditorScreen width={374} height={804} theme={tweaks.theme}
               plan={plan}
               dayId={resolvedDayId}
               tracksCycle={profile.tracksCycle}
               onBack={() => setScreen('gym-hub')}
               onSave={(updatedDay) => {
                 setPlan(p => ({ ...p, overrides: { ...p.overrides, [updatedDay.id]: updatedDay } }));
                 setScreen('gym-hub');
               }}
               onNav={navigate} />;
    }
    if (s === 'gym-day')
      return <DayActivitiesScreen width={374} height={804} theme={tweaks.theme}
               plan={plan}
               dayIdx={editingDayIdx ?? 1}
               activities={activities}
               tracksCycle={profile.tracksCycle}
               onBack={() => setScreen('gym-hub')}
               onSave={(idx, list) => {
                 setActivities(a => {
                   const next = { ...a, [idx]: list };
                   setTimeout(() => scheduleSave({ activities: next }), 0);
                   return next;
                 });
               }}
               onEditGym={(dayId) => { setEditingDayId(dayId); setScreen('gym-edit'); }}
               onNav={navigate} />;
    if (s === 'food')
      return <FoodScreen width={374} height={804} theme={tweaks.theme}
               foodLog={foodLog}
               userSettings={userSettings}
               plan={plan}
               activities={activities}
               completedSessions={completedSessions}
               onUpdateFood={updateFood}
               onNav={navigate}
               tracksCycle={profile.tracksCycle} />;
    if (s === 'about-me')
      return <AboutScreen width={374} height={804} theme={tweaks.theme}
               profile={profile}
               userSettings={userSettings}
               plan={plan}
               identity={identity}
               onSaveProfile={(p) => setProfile(prev => ({ ...prev, ...p }))}
               onSaveSettings={(s) => setUserSettings(prev => ({ ...prev, ...s }))}
               onBack={() => setScreen('home')}
               onNav={navigate}
               onSignOut={signOut}
               tracksCycle={profile.tracksCycle} />;
    if (s === 'gym-library')
      return <ExerciseLibraryScreen width={374} height={804} theme={tweaks.theme}
               tracksCycle={profile.tracksCycle}
               onBack={() => setScreen('gym-hub')}
               onNav={navigate} />;
    if (s === 'gym-session' || s === 'gym')
      return <GymSessionScreen width={374} height={804} theme={tweaks.theme}
               session={session} setSession={setSession}
               tracksCycle={profile.tracksCycle}
               onNav={navigate}
               onExit={() => setScreen(session.active ? 'home' : 'gym-hub')}
               onComplete={finishSession} />;
    if (s === 'gym-summary')
      return <GymSummaryScreen width={374} height={804} theme={tweaks.theme}
               session={lastSession}
               tracksCycle={profile.tracksCycle}
               onDone={closeSummary}
               onNav={navigate} />;
    return <PlaceholderScreen width={374} height={804} theme={tweaks.theme}
             screen={s} onNav={navigate} tracksCycle={profile.tracksCycle} />;
  };

  const screenLabel = onboardingActive
    ? 'ONBOARDING'
    : screen.replace(/^gym-?/, '').toUpperCase() || screen.toUpperCase();

  return (
    <>
      <div className="stage">
        <div className="phone-frame">
          <div className="phone-notch"/>
          <div className="phone-inner">
            <div key={onboardingActive ? 'onboarding' : screen} className="screen-anim">
              {renderScreen(screen)}
            </div>
          </div>
        </div>
        <div className="label">
          Forma · {screenLabel} · {(identity && identity.name) || profile.name || ''} · {syncLabel}
        </div>
      </div>

      <TweaksPanel title="Dev tools">
        <TweakSection label="Theme">
          <TweakRadio
            label="Mode"
            value={tweaks.theme}
            options={[{ value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }]}
            onChange={(v) => setTweak('theme', v)}
          />
        </TweakSection>
        <TweakSection label="Navigate">
          <TweakSelect
            label="Screen"
            value={onboardingActive ? 'onboarding' : screen}
            options={[
              { value: 'onboarding',  label: 'Onboarding' },
              { value: 'home',        label: 'Home' },
              { value: 'gym-hub',     label: 'Gym · Hub' },
              { value: 'gym-split',   label: 'Gym · Split picker' },
              { value: 'gym-edit',    label: 'Gym · Session editor' },
              { value: 'gym-day',     label: 'Gym · Day activities' },
              { value: 'gym-library', label: 'Gym · Exercise library' },
              { value: 'gym-session', label: 'Gym · In session' },
              { value: 'gym-summary', label: 'Gym · Summary' },
              { value: 'food',        label: 'Food · Weekly tracker' },
              { value: 'about-me',   label: 'About me' },
              { value: 'cycle',       label: 'Cycle (stub)' },
            ]}
            onChange={(v) => {
              if (v === 'onboarding') setOnboarding(true);
              else { setOnboarding(false); setScreen(v); }
            }}
          />
        </TweakSection>
        <TweakSection label="Account">
          <TweakButton label="Sign out" onClick={signOut} />
          <TweakButton label="Re-run onboarding" secondary
            onClick={() => { setOnboarding(true); setScreen('home'); }} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
